  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #160048;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- URL EXECUTAVEL OFICIAL DO GOOGLE APPS SCRIPT DO PORTAL GP 360 -->
  <iframe id="appFrame" src="https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycbzuISkuZ2-KtWL-zI87DcTrZyN4e6dPK9H4M6c1r8c9EjpAkF87Go4LrmzwVDH94LI/exec" allow="geolocation; camera"></iframe>

  <script>
    // Registro do Service Worker para suporte a PWA nativo e remocao de barra no Chrome/Android
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('Service Worker GP360 registrado com sucesso:', reg.scope);
          })
          .catch(function(err) {
            console.log('Falha ao registrar Service Worker:', err);
          });
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      // Ajusta dinamicamente a altura para telas de celular com barra de status
      function adjustHeight() {
        document.body.style.height = window.innerHeight + 'px';
      }
      window.addEventListener('resize', adjustHeight);
      adjustHeight();
    });
  </script>
</body>
</html>
