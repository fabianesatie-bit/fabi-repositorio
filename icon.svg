<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4203A9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#160048;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17F036;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FBE53B;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF8A00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF14B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0087FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF14B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0087FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <g filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="195" ry="120" fill="none" stroke="url(#ringGrad1)" stroke-width="14" transform="rotate(-28 256 256)" />
    <ellipse cx="256" cy="256" rx="185" ry="105" fill="none" stroke="url(#ringGrad2)" stroke-width="8" transform="rotate(28 256 256)" />
  </g>
  <text x="51%" y="54%" font-family="Arial, sans-serif" font-size="180" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">GP</text>
</svg>
