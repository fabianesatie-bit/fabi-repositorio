<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscrição Posicionamento Estratégico 2026</title>
    <!-- Soft Pastel UI (Design System GP360) -->
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #F8FAFC;
        color: #334155;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }
      .card-container {
        background: #FFFFFF;
        max-width: 800px;
        width: 100%;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
        border-top: 5px solid #7C3AED;
      }
      h2 { color: #6B21A8; font-weight: 600; margin-top: 0; text-align: center; }
      p.subtitle { color: #64748B; font-size: 0.95em; margin-bottom: 25px; text-align: center; }
      
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
      .form-group { margin-bottom: 20px; }
      label { display: block; font-weight: 500; margin-bottom: 8px; color: #475569; font-size: 0.9em; }
      .req { color: #F43F5E; }
      
      input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
        box-sizing: border-box;
        background-color: #F8FAFC;
        font-size: 14px;
        transition: all 0.3s ease;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #7C3AED;
        background-color: #FFFFFF;
        box-shadow: 0 0 0 3px #E9D5FF;
      }
      
      .highlight-input { background-color: #FFFBEB; border-color: #FCD34D; }
      
      .btn {
        background-color: #7C3AED;
        color: #FFFFFF;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s;
      }
      .btn:hover { background-color: #6D28D9; }
      .btn:disabled { background-color: #CBD5E1; cursor: not-allowed; }
      
      .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; font-size: 0.95em; }
      .alert-info { background-color: #EFF6FF; color: #1E40AF; border: 1px solid #BFDBFE; }
      .alert-error { background-color: #FFF1F2; color: #9F1239; border: 1px solid #FECDD3; }
      .alert-success { background-color: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
      .alert-warning { background-color: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
      
      .hidden { display: none !important; }
      .readonly-field { background-color: #F1F5F9; color: #94A3B8; cursor: not-allowed; }
      
      @media (max-width: 600px) {
        .grid-2, .grid-3 { grid-template-columns: 1fr; }
        .card-container { padding: 20px; }
      }
    </style>
  </head>
  <body>
    
    <div class="card-container">
      <!-- CABEÇALHO COM IMAGEM (NOVO MÉTODO ANTI-CORS PARA IFRAMES DO APPS SCRIPT) -->
      <div style="text-align: center; margin-bottom: 25px;">
         <img src="https://lh3.googleusercontent.com/d/11hXfYVWii84PNbAr86xQFA0dR6oGNHGj" alt="Banner Posicionamento Estratégico" style="max-width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
      </div>

      <h2>Inscrição Posicionamento Estratégico 2026</h2>
      <p class="subtitle">Preencha os dados abaixo com atenção. Informações marcadas com <span class="req">*</span> são obrigatórias.</p>
      
      <div id="statusAlert"></div>
      
      <form id="formColeta" novalidate class="hidden">
        
        <h3 style="color:#2563EB; font-size:1.1em; border-bottom:1px solid #E2E8F0; padding-bottom:10px;">1. Validação de Identidade</h3>
        
        <div class="grid-3">
          <div class="form-group">
            <label>E-mail Logado (Permissão)</label>
            <input type="text" id="dispEmail" class="readonly-field" readonly>
          </div>
          <div class="form-group">
            <label>Origem do Colaborador <span class="req">*</span></label>
            <select id="inpOrigem" class="highlight-input" required>
              <option value="">Selecione...</option>
              <option value="LOJAS">Lojas</option>
              <option value="ESCRITORIO">Escritório</option>
            </select>
          </div>
          <div class="form-group">
            <label>ID Crachá (Matrícula) <span class="req">*</span></label>
            <input type="number" id="inpId" required placeholder="Ex: 12345" style="border-left: 4px solid #F59E0B;" disabled title="Selecione a origem primeiro">
          </div>
        </div>

        <div id="areaDadosCompletos" class="hidden">
          <h3 style="color:#2563EB; font-size:1.1em; border-bottom:1px solid #E2E8F0; padding-bottom:10px; margin-top:30px;">2. Informações Logísticas e Pessoais</h3>
          
          <div class="grid-2">
            <div class="form-group">
              <label>Nome Completo (Automático da Base)</label>
              <input type="text" id="inpNome" class="readonly-field" readonly>
            </div>
            <div class="form-group">
              <label>Sexo <span class="req">*</span></label>
              <select id="inpSexo" class="highlight-input" required>
                <option value="">Selecione...</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>

          <!-- VALIDAÇÃO DO NOME DO RG (SEGURANÇA DE EMBARQUE) -->
          <div class="form-group" style="background-color: #EFF6FF; padding: 15px; border-radius: 8px; border-left: 4px solid #2563EB;">
            <label>O nome exibido acima está <b>exatamente igual ao seu RG</b> (para emissão de passagem)? <span class="req">*</span></label>
            <select id="inpConfirmaNome" class="highlight-input" required>
              <option value="Sim">Sim, está correto para embarque</option>
              <option value="Não">Não, preciso digitar como está no documento</option>
            </select>
          </div>

          <div id="divNomeCorreto" class="form-group hidden">
            <label>Digite seu Nome Completo EXATAMENTE como no RG <span class="req">*</span></label>
            <input type="text" id="inpNomeCorreto" class="highlight-input" placeholder="Maria da Silva Santos">
          </div>

          <!-- LACTANTES COM NOVO TEXTO -->
          <div class="form-group">
             <label>Você é mãe lactante e precisará levar acompanhante e o bebê? (Lactantes com bebês de até 1 ano e 11 meses) <span class="req">*</span></label>
             <select id="inpLactante" class="highlight-input" required>
               <option value="Não">Não</option>
               <option value="Sim">Sim</option>
             </select>
          </div>

          <div id="divAcompanhantes" class="hidden" style="background-color: #F8FAFC; padding: 15px; border-radius: 8px; border: 1px dashed #7C3AED; margin-bottom: 20px;">
             <h4 style="color: #6B21A8; margin-top: 0; margin-bottom: 15px;">Dados do Acompanhante e Bebê</h4>
             <div class="grid-2">
                <div class="form-group"><label>Nome do Acompanhante <span class="req">*</span></label><input type="text" id="inpNomeAcomp" class="highlight-input"></div>
                <div class="form-group"><label>CPF do Acompanhante <span class="req">*</span></label><input type="text" id="inpCpfAcomp" class="highlight-input"></div>
                <div class="form-group"><label>RG do Acompanhante <span class="req">*</span></label><input type="text" id="inpRgAcomp" class="highlight-input"></div>
                <div class="form-group"><label>Data Nasc. Acompanhante <span class="req">*</span></label><input type="date" id="inpNascAcomp" class="highlight-input"></div>
                <div class="form-group"><label>Nome do Bebê <span class="req">*</span></label><input type="text" id="inpNomeBebe" class="highlight-input"></div>
                <div class="form-group"><label>Data Nasc. Bebê <span class="req">*</span></label><input type="date" id="inpNascBebe" class="highlight-input"></div>
             </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>DDD <span class="req">*</span></label>
              <input type="number" id="inpDdd" class="highlight-input" required placeholder="Ex: 11" min="11" max="99">
            </div>
            <div class="form-group">
              <label>Celular <span class="req">*</span></label>
              <input type="number" id="inpCelular" class="highlight-input" required placeholder="Ex: 987654321">
            </div>
          </div>

          <!-- CONTATO DE EMERGÊNCIA -->
          <div class="form-group">
            <label>Contato de Emergência (Nome e Telefone com DDD) <span class="req">*</span></label>
            <input type="text" id="inpEmergencia" class="highlight-input" required placeholder="Ex: João Silva - (11) 98888-7777">
          </div>

          <div class="form-group">
            <label>Restrição Alimentar (Alergias) <span class="req">*</span></label>
            <input type="text" id="inpRestricao" class="highlight-input" required placeholder="Nenhuma, intolerância à lactose, etc...">
          </div>
          
          <div class="grid-2">
            <div class="form-group">
              <label>E-mail Corporativo (Magalu) <span class="req">*</span></label>
              <input type="email" id="inpEmailMagalu" class="highlight-input" required placeholder="nome@magazineluiza.com.br">
            </div>
            <div class="form-group">
              <label>E-mail Pessoal Secundário <span class="req">*</span></label>
              <input type="email" id="inpEmailPessoal" class="highlight-input" required placeholder="nome@gmail.com">
            </div>
          </div>

          <!-- TIPO DE TRANSPORTE COM MENSAGEM CULTURAL -->
          <div class="form-group">
            <label>Tipo de Transporte Principal <span class="req">*</span></label>
            <select id="inpTransporte" class="highlight-input" required>
              <option value="">Selecione...</option>
              <option value="Aéreo">Aéreo</option>
              <option value="Rodoviário">Rodoviário (Ônibus)</option>
              <option value="Próprio">Carro Próprio (Use sempre que possível carona amiga, Atitude de Dono sempre &#128512;)</option>
              <option value="Rota">Rota da Empresa</option>
            </select>
          </div>

          <div id="divAeroportos" class="grid-2 hidden">
            <div class="form-group">
              <label>Aeroporto Preferência (1ª Opção) <span class="req">*</span></label>
              <input type="text" id="inpAero1" class="highlight-input" placeholder="Sigla ou Nome">
            </div>
            <div class="form-group">
              <label>Aeroporto Preferência (2ª Opção)</label>
              <input type="text" id="inpAero2" class="highlight-input" placeholder="Sigla ou Nome">
            </div>
          </div>

          <div class="form-group">
            <label>Sugestões/Observações sobre Rotas</label>
            <input type="text" id="inpObsRotas" class="highlight-input" placeholder="(Alguma observação)">
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label>Regional (Automático/Manual) <span class="req">*</span></label>
              <input type="text" id="inpRegionalAuto" class="readonly-field" required readonly>
            </div>
            <div class="form-group">
              <label>Cidade Base de Embarque <span class="req">*</span></label>
              <input type="text" id="inpCidadeEmbarque" class="highlight-input" required placeholder="De onde sai?">
            </div>
            <div class="form-group">
              <label>Possui Mobilidade Reduzida? <span class="req">*</span></label>
              <select id="inpMobilidade" class="highlight-input" required>
                <option value="">Selecione...</option>
                <option value="Não">Não</option>
                <option value="Sim">Sim, preciso de adaptação</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Observações Gerais</label>
            <textarea id="inpObsGerais" class="highlight-input" rows="3" placeholder="Qualquer outra informação relevante para a logística..."></textarea>
          </div>
          
          <!-- CAMPOS OCULTOS -->
          <input type="hidden" id="inpFilialAuto">
          <input type="hidden" id="inpRgAuto">
          <input type="hidden" id="inpOrgaoAuto">
          <input type="hidden" id="inpCpfAuto">
          <input type="hidden" id="inpNascimentoAuto">
          <input type="hidden" id="inpCargoAuto">

          <button type="button" class="btn" id="btnEnviar" onclick="validarEEnviar()">Confirmar Inscrição</button>
        </div>
      </form>
    </div>

    <script>
      // Desbloqueia a matrícula somente após escolher a origem
      document.getElementById('inpOrigem').addEventListener('change', function() {
         const inpId = document.getElementById('inpId');
         if(this.value !== "") {
            inpId.disabled = false;
            inpId.focus();
         } else {
            inpId.disabled = true;
            inpId.value = "";
         }
      });

      // Validação Condicional do Nome Correto RG
      document.getElementById('inpConfirmaNome').addEventListener('change', function() {
         const divCorreto = document.getElementById('divNomeCorreto');
         const inpCorreto = document.getElementById('inpNomeCorreto');
         if (this.value === 'Não') {
            divCorreto.classList.remove('hidden');
            inpCorreto.required = true;
         } else {
            divCorreto.classList.add('hidden');
            inpCorreto.required = false;
            inpCorreto.value = "";
         }
      });

      // Lactantes
      document.getElementById('inpLactante').addEventListener('change', function() {
        const div = document.getElementById('divAcompanhantes');
        const isLactante = this.value === 'Sim';
        if (isLactante) {
          div.classList.remove('hidden');
        } else {
          div.classList.add('hidden');
        }
        ['inpNomeAcomp', 'inpCpfAcomp', 'inpRgAcomp', 'inpNascAcomp', 'inpNomeBebe', 'inpNascBebe'].forEach(id => {
            document.getElementById(id).required = isLactante;
            if (!isLactante) document.getElementById(id).value = "";
        });
      });

      // Transporte Aeroportos
      document.getElementById('inpTransporte').addEventListener('change', function() {
        const divAero = document.getElementById('divAeroportos');
        const inpAero1 = document.getElementById('inpAero1');
        
        // Verifica se a opção selecionada inclui a palavra "Aéreo"
        if (this.value.indexOf('Aéreo') !== -1) {
          divAero.classList.remove('hidden');
          inpAero1.required = true;
        } else {
          divAero.classList.add('hidden');
          inpAero1.required = false;
          inpAero1.value = "";
          document.getElementById('inpAero2').value = "";
        }
      });

      // Sessão Google
      document.addEventListener("DOMContentLoaded", function() {
        mostrarAlerta("info", "Autenticando sessão do Google...");
        google.script.run.withSuccessHandler(function(res) {
            document.getElementById('dispEmail').value = res.emailLogado || 'Sessão Ativa';
            document.getElementById('statusAlert').innerHTML = '';
            document.getElementById('formColeta').classList.remove('hidden');
        }).withFailureHandler(function(err) {
            mostrarAlerta("error", "Erro ao carregar permissões.");
        }).obterInfoSessao(); 
      });

      // Busca dupla (Com Origem e Trava de Serialização)
      document.getElementById('inpId').addEventListener('change', function() {
        var cracha = this.value.trim();
        var origem = document.getElementById('inpOrigem').value;
        if(!cracha || !origem) return;
        
        mostrarAlerta("info", "A procurar dados corporativos de forma segura...");
        document.getElementById('areaDadosCompletos').classList.add('hidden');
        
        google.script.run.withSuccessHandler(function(res) {
          if (!res) {
             mostrarAlerta("error", "Erro crítico de comunicação: O servidor falhou ao enviar os dados da base.");
             return;
          }

          if(res.sucesso) {
             document.getElementById('statusAlert').innerHTML = '';
             document.getElementById('inpNome').value = res.dados.nome;
             
             document.getElementById('inpConfirmaNome').value = 'Sim';
             document.getElementById('divNomeCorreto').classList.add('hidden');
             document.getElementById('inpNomeCorreto').required = false;
             document.getElementById('inpNomeCorreto').value = "";

             const regField = document.getElementById('inpRegionalAuto');
             regField.value = res.dados.regional;
             
             if(origem === 'ESCRITORIO') {
                 regField.readOnly = false;
                 regField.classList.remove('readonly-field');
                 regField.classList.add('highlight-input');
                 mostrarAlerta("info", "Selecionou ESCRITÓRIO. Por favor, <b>confirme ou edite manualmente</b> a sua Regional abaixo.");
             } else {
                 regField.readOnly = true;
                 regField.classList.add('readonly-field');
                 regField.classList.remove('highlight-input');
             }

             document.getElementById('inpFilialAuto').value = res.dados.filial;
             document.getElementById('inpRgAuto').value = res.dados.rg || "";
             document.getElementById('inpOrgaoAuto').value = res.dados.orgao || "";
             document.getElementById('inpCpfAuto').value = res.dados.cpf || "";
             document.getElementById('inpNascimentoAuto').value = res.dados.nascimento || "";
             document.getElementById('inpCargoAuto').value = res.dados.cargo || "";

             document.getElementById('areaDadosCompletos').classList.remove('hidden');
          } else {
             mostrarAlerta("warning", res.msg); 
          }
        }).validarEBuscarID(cracha, origem); 
      });

      function validarEEnviar() {
        const form = document.getElementById('formColeta');
        if (!form.checkValidity()) {
          form.reportValidity();
          mostrarAlerta("error", "Por favor, preencha todos os campos obrigatórios (*).");
          return;
        }
        
        const nomeFinal = document.getElementById('inpConfirmaNome').value === 'Não' 
                        ? document.getElementById('inpNomeCorreto').value 
                        : document.getElementById('inpNome').value;

        // Extrai apenas a palavra principal caso o utilizador tenha selecionado a opção de carro com a mensagem longa
        var transporteSelecionado = document.getElementById('inpTransporte').value;
        if(transporteSelecionado.indexOf('Próprio') !== -1) {
             transporteSelecionado = 'Próprio';
        }

        const payload = {
           id: document.getElementById('inpId').value,
           origemBase: document.getElementById('inpOrigem').value,
           nomeCompleto: nomeFinal,
           regional: document.getElementById('inpRegionalAuto').value, 
           filial: document.getElementById('inpFilialAuto').value,
           rg: document.getElementById('inpRgAuto').value,
           orgao: document.getElementById('inpOrgaoAuto').value,
           cpf: document.getElementById('inpCpfAuto').value,
           nascimento: document.getElementById('inpNascimentoAuto').value,
           cargo: document.getElementById('inpCargoAuto').value,
           sexo: document.getElementById('inpSexo').value,
           ddd: document.getElementById('inpDdd').value,
           celular: document.getElementById('inpCelular').value,
           contatoEmergencia: document.getElementById('inpEmergencia').value,
           restricaoAlimentar: document.getElementById('inpRestricao').value,
           emailMagalu: document.getElementById('inpEmailMagalu').value,
           emailPessoal: document.getElementById('inpEmailPessoal').value,
           tipoTransporte: transporteSelecionado, // Grava apenas "Próprio" na base de dados
           observacaoRotas: document.getElementById('inpObsRotas').value,
           aeroporto1: document.getElementById('inpAero1').value,
           aeroporto2: document.getElementById('inpAero2').value,
           cidadeEmbarque: document.getElementById('inpCidadeEmbarque').value,
           mobilidadeReduzida: document.getElementById('inpMobilidade').value,
           observacoesGerais: document.getElementById('inpObsGerais').value,
           
           isLactante: document.getElementById('inpLactante').value === 'Sim',
           nomeAcomp: document.getElementById('inpNomeAcomp') ? document.getElementById('inpNomeAcomp').value : "",
           cpfAcomp: document.getElementById('inpCpfAcomp') ? document.getElementById('inpCpfAcomp').value : "",
           rgAcomp: document.getElementById('inpRgAcomp') ? document.getElementById('inpRgAcomp').value : "",
           nascAcomp: document.getElementById('inpNascAcomp') ? document.getElementById('inpNascAcomp').value : "",
           nomeBebe: document.getElementById('inpNomeBebe') ? document.getElementById('inpNomeBebe').value : "",
           nascBebe: document.getElementById('inpNascBebe') ? document.getElementById('inpNascBebe').value : ""
        };
        
        document.getElementById('btnEnviar').disabled = true;
        document.getElementById('btnEnviar').innerText = "A gravar...";
        mostrarAlerta("info", "A gravar os dados logísticos, aguarde...");
        
        google.script.run.withSuccessHandler(function(res) {
           if (!res) {
              mostrarAlerta("error", "Erro ao guardar: O servidor não respondeu adequadamente.");
              document.getElementById('btnEnviar').disabled = false;
              document.getElementById('btnEnviar').innerText = "Confirmar Inscrição";
              return;
           }
           if(res.sucesso) {
             document.getElementById('formColeta').classList.add('hidden');
             mostrarAlerta("success", "&#9989; " + res.msg + "<br><br>Pode fechar esta página.");
           } else {
             mostrarAlerta("warning", "&#9888;&#65039; " + res.msg);
             document.getElementById('btnEnviar').disabled = false;
             document.getElementById('btnEnviar').innerText = "Confirmar Inscrição";
           }
        }).withFailureHandler(function(err) {
             mostrarAlerta("error", "Erro de ligação. Tente novamente.");
             document.getElementById('btnEnviar').disabled = false;
             document.getElementById('btnEnviar').innerText = "Confirmar Inscrição";
        }).salvarDados(payload);
      }
      
      function mostrarAlerta(tipo, mensagem) {
         const alertDiv = document.getElementById('statusAlert');
         alertDiv.className = "alert alert-" + tipo;
         alertDiv.innerHTML = mensagem;
         alertDiv.style.display = "block";
      }
    </script>
  </body>
</html>
