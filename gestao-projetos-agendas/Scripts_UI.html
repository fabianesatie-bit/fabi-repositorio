  // =========================================================================
  // 1. ESTADO GLOBAL DA APLICAÇÃO (SPA STATE)
  // =========================================================================
  const appState = {
    projetos: [],
    tarefas: [],
    eventosCalendario: [],
    historicoTempo: [],
    infoSemana: null,
    infoDia: null,
    infoMes: null,
    hojeISO: '',
    modoVisualizacao: 'semana', // 'dia', 'semana', 'mes'
    dataReferencia: '',
    abaAtiva: 'agenda-semanal',
    subnavProjetos: 'ativos', // 'ativos' ou 'arquivados'
    filtroAreaProjeto: 'Todos',
    filtroBuscaProjeto: '',
    projetoFocoId: null, // null = todos em grade; ID = projeto individual focado em formato Trello
    tarefasConcluidasAbertas: {},
    filtroBuscaBloqueio: '',
    filtroBuscaHistorico: '',
    expandirTodos: true,
    accordionAberto: {},
    tarefaEmFocoBloqueio: null,
    
    // Motor do Cronômetro Ativo (Dock de Produtividade)
    cronometro: {
      idTarefa: null,
      tituloTarefa: '',
      nomeProjeto: '',
      segundos: 0,
      timestampInicio: null,
      ativo: false,
      intervalId: null
    }
  };

  // Cores da Paleta Botânica para Projetos / Washi Tape
  const PALETA_CORES_PROJETO = [
    { nome: 'Lavanda Rose', hex: '#ffd7f6', border: '#72526d' },
    { nome: 'Menta Botânica', hex: '#d2e9cf', border: '#4f634f' },
    { nome: 'Terracota Suave', hex: '#ffdbc8', border: '#7e5236' },
    { nome: 'Lilás Silvestre', hex: '#ebdce7', border: '#8c6a86' },
    { nome: 'Orquídea', hex: '#e9e1db', border: '#4e444c' }
  ];

  // =========================================================================
  // 2. INICIALIZAÇÃO & CARREGAMENTO DE DADOS (GOOGLE APPS SCRIPT RPC)
  // =========================================================================
  window.addEventListener('DOMContentLoaded', () => {
    inicializarDataHoje();
    restaurarCronometroLocal();
    carregarDadosApp();
  });

  function inicializarDataHoje() {
    const hoje = new Date();
    const opcoes = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    const dataFmt = hoje.toLocaleDateString('pt-BR', opcoes);
    // Capitaliza primeira letra
    const dataFinal = dataFmt.charAt(0).toUpperCase() + dataFmt.slice(1);
    
    const elData = document.getElementById('header-data-hoje');
    if (elData) elData.textContent = dataFinal;
  }

  function carregarDadosApp() {
    mostrarToast('Sincronizando ecossistema com Google Workspace...', 'info');

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn('Executando em ambiente local de teste. Carregando dados simulados.');
      carregarMockLocal();
      return;
    }

    // Se dataReferencia não estiver definida, usa a data atual local
    if (!appState.dataReferencia) {
      appState.dataReferencia = formatarDataLocalISO(new Date());
    }

    google.script.run
      .withSuccessHandler(onDadosIniciaisCarregados)
      .withFailureHandler(onErroServidor)
      .obterDadosIniciaisApp(appState.dataReferencia, appState.modoVisualizacao);

    // Carrega também histórico para as métricas com tratamento isolado
    try {
      google.script.run
        .withSuccessHandler(onHistoricoCarregado)
        .withFailureHandler((err) => console.warn('Aviso: histórico não pôde ser carregado:', err))
        .obterHistoricoTempoCompleto();
    } catch (eHist) {
      console.warn('Falha controlada ao invocar histórico:', eHist);
    }
  }

  function onDadosIniciaisCarregados(resposta) {
    try {
      if (!resposta || !resposta.sucesso) {
        const msg = (resposta && resposta.mensagem) ? resposta.mensagem : 'Erro ao obter dados do servidor.';
        mostrarToast(msg, 'error');
        const container = document.getElementById('week-accordion-container');
        if (container) {
          container.innerHTML = `
            <div class="p-8 text-center bg-[#fff8f5] border border-[#ffdad6] rounded-2xl text-[#ba1a1a]">
              <span class="material-symbols-outlined text-[32px] mb-2 block text-[#ba1a1a]">error</span>
              <p class="font-bold text-sm mb-1 text-[#211a1e]">Não foi possível sincronizar os dados da agenda</p>
              <p class="text-xs mb-4 text-[#80747d]">${escapeHtml(msg)}</p>
              <button type="button" class="px-4 py-2 bg-[#72526d] text-white rounded-xl text-xs font-bold hover:bg-[#5f445b] transition-all shadow-xs" onclick="carregarDadosApp()">Tentar Novamente</button>
            </div>
          `;
        }
        return;
      }

      const d = resposta.dados;
      appState.projetos = Array.isArray(d.projetos) ? d.projetos : [];
      appState.tarefas = Array.isArray(d.tarefas) ? d.tarefas : [];
      appState.eventosCalendario = Array.isArray(d.eventosCalendario) ? d.eventosCalendario : [];
      appState.infoSemana = d.infoSemana || null;
      appState.infoDia = d.infoDia || null;
      appState.infoMes = d.infoMes || null;
      appState.hojeISO = d.hojeISO || formatarDataLocalISO(new Date());

      if (d.infoSemana && d.infoSemana.dataReferenciaISO) {
        appState.dataReferencia = d.infoSemana.dataReferenciaISO;
      }

      // Atualiza contadores dos badges da barra de navegação
      atualizarBadgesNavegacao();

      // Renderiza a visão ativa corrente
      renderizarVisaoAtiva();

      mostrarToast('Ecossistema atualizado com sucesso!', 'success');
    } catch (err) {
      console.error('Erro ao processar dados recebidos do servidor:', err);
      mostrarToast('Erro ao processar agenda: ' + err.message, 'error');
    }
  }

  function onHistoricoCarregado(resposta) {
    if (resposta && resposta.sucesso) {
      appState.historicoTempo = resposta.dados || [];
      if (appState.abaAtiva === 'historico-e-metricas') {
        renderizarMetricas();
      }
    }
  }

  function onErroServidor(err) {
    console.error('Erro na chamada ao servidor:', err);
    const msg = (err && err.message) ? err.message : String(err);
    mostrarToast('Falha na comunicação: ' + msg, 'error');
    if (appState.abaAtiva === 'agenda-semanal') {
      const container = document.getElementById('week-accordion-container');
      if (container && (!appState.eventosCalendario || appState.eventosCalendario.length === 0)) {
        container.innerHTML = `
          <div class="p-8 text-center bg-[#fff8f5] border border-[#ffdbc8] rounded-2xl text-[#4e444c]">
            <span class="material-symbols-outlined text-[32px] mb-2 block text-[#ba1a1a]">cloud_off</span>
            <p class="font-bold text-sm mb-1 text-[#211a1e]">Falha ao sincronizar com o Google Workspace</p>
            <p class="text-xs mb-4 text-[#80747d]">${escapeHtml(msg)}</p>
            <div class="flex items-center justify-center gap-3">
              <button type="button" class="px-4 py-2 bg-[#72526d] text-white rounded-xl text-xs font-bold hover:bg-[#5f445b] transition-all shadow-xs" onclick="carregarDadosApp()">
                Tentar Novamente
              </button>
              <button type="button" class="px-4 py-2 bg-[#f5ece7] text-[#72526d] rounded-xl text-xs font-semibold hover:bg-[#ebdce7] transition-all" onclick="carregarMockLocal()">
                Ver Dados Locais
              </button>
            </div>
          </div>
        `;
      }
    }
  }

  window.recarregarDadosApp = carregarDadosApp;

  // =========================================================================
  // 3. NAVEGAÇÃO ENTRE AS 4 TELAS DA SPA
  // =========================================================================
  function alternarAba(abaId) {
    appState.abaAtiva = abaId;

    // Atualiza estilos dos botões da barra de navegação (desktop e mobile)
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const corresponde = tab.getAttribute('data-tab') === abaId;
      if (corresponde) {
        tab.className = tab.className.replace(/text-\[#4e444c\].*?hover:bg-\[#ebdce7\]\/50/, '');
        tab.classList.add('bg-[#72526d]', 'text-white', 'shadow-sm');
        tab.classList.remove('text-[#4e444c]');
      } else {
        tab.classList.remove('bg-[#72526d]', 'text-white', 'shadow-sm');
        tab.classList.add('text-[#4e444c]');
      }
    });

    // Oculta todas as seções e exibe apenas a solicitada
    const secoes = {
      'agenda-semanal': document.getElementById('view-agenda-semanal'),
      'quadro-de-projetos': document.getElementById('view-quadro-projetos'),
      'fila-de-bloqueios': document.getElementById('view-fila-bloqueios'),
      'historico-e-metricas': document.getElementById('view-historico-metricas')
    };

    Object.keys(secoes).forEach(chave => {
      const sec = secoes[chave];
      if (sec) {
        sec.style.display = (chave === abaId) ? 'block' : 'none';
      }
    });

    renderizarVisaoAtiva();
  }
  window.alternarAba = alternarAba;

  function renderizarVisaoAtiva() {
    switch (appState.abaAtiva) {
      case 'agenda-semanal':
        renderizarAgenda();
        break;
      case 'quadro-de-projetos':
        renderizarProjetos();
        break;
      case 'fila-de-bloqueios':
        renderizarBloqueios();
        break;
      case 'historico-e-metricas':
        renderizarMetricas();
        break;
    }
  }

  function atualizarBadgesNavegacao() {
    const totalProjetosAtivos = appState.projetos.filter(p => p.Status === 'Ativo').length;
    const totalBloqueios = appState.tarefas.filter(t => t.Status === 'Aguardando').length;

    const elBadgeProj = document.getElementById('nav-count-projetos');
    if (elBadgeProj) elBadgeProj.textContent = totalProjetosAtivos;

    const elBadgeBloq = document.getElementById('nav-count-bloqueios');
    if (elBadgeBloq) elBadgeBloq.textContent = totalBloqueios;
  }

  // =========================================================================
  // 4. TELA 1: AGENDA SEMANAL & WORKSPACE CALENDAR
  // =========================================================================
  function renderizarAgenda() {
    atualizarInfoCicloSemana();
    atualizarRibbonMetricasAgenda();
    renderizarAccordionDiasSemana();
    renderizarMiniCalendario();
    atualizarCardRitmoSemanal();
  }

  function atualizarInfoCicloSemana() {
    const elRange = document.getElementById('week-display-range');
    const elStatus = document.getElementById('week-display-status');
    if (!elRange) return;

    const hojeISO = appState.hojeISO || formatarDataLocalISO(new Date());

    if (appState.modoVisualizacao === 'dia') {
      const dataISO = normalizarDataISO(appState.dataReferencia) || hojeISO;
      const dAtual = parseDataISOParaLocal(dataISO);
      elRange.textContent = dAtual.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      if (elStatus) {
        elStatus.textContent = (dataISO === hojeISO) ? 'Hoje (Dia Ativo)' : (dataISO < hojeISO ? 'Dia Passado' : 'Dia Futuro');
      }
      return;
    }

    if (appState.modoVisualizacao === 'mes') {
      const dRef = parseDataISOParaLocal(appState.dataReferencia);
      const mesExtenso = dRef.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      elRange.textContent = mesExtenso.charAt(0).toUpperCase() + mesExtenso.slice(1);
      if (elStatus) elStatus.textContent = 'Mês Completo';
      return;
    }

    // Modo 'semana':
    if (appState.infoSemana && appState.infoSemana.labelPeriodo) {
      elRange.textContent = appState.infoSemana.labelPeriodo;
      const segISO = appState.infoSemana.segundaISO;
      const domISO = appState.infoSemana.domingoISO;
      if (elStatus) {
        if (hojeISO >= segISO && hojeISO <= domISO) {
          elStatus.textContent = 'Ciclo Atual (Hoje)';
        } else if (hojeISO > domISO) {
          elStatus.textContent = 'Ciclo Passado';
        } else {
          elStatus.textContent = 'Planejamento Futuro';
        }
      }
      return;
    }

    const dRef = parseDataISOParaLocal(appState.dataReferencia);
    const seg = obterSegundaFeira(dRef);
    const dom = new Date(seg);
    dom.setDate(dom.getDate() + 6);

    const opcoes = { day: '2-digit', month: 'short' };
    const segFmt = seg.toLocaleDateString('pt-BR', opcoes);
    const domFmt = dom.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });

    elRange.textContent = `${segFmt} a ${domFmt}`;
    
    const segISO = formatarDataLocalISO(seg);
    const domISO = formatarDataLocalISO(dom);
    
    if (hojeISO >= segISO && hojeISO <= domISO) {
      if (elStatus) elStatus.textContent = 'Ciclo Atual (Hoje)';
    } else if (hojeISO > domISO) {
      if (elStatus) elStatus.textContent = 'Ciclo Passado';
    } else {
      if (elStatus) elStatus.textContent = 'Planejamento Futuro';
    }
  }

  function atualizarRibbonMetricasAgenda() {
    const tarefasSemana = obterTarefasDoCicloAtual();
    const totalTarefas = tarefasSemana.length;
    const concluidas = tarefasSemana.filter(t => t.Status === 'Concluída').length;
    const taxa = totalTarefas > 0 ? Math.round((concluidas / totalTarefas) * 100) : 0;
    const reunioesCal = appState.eventosCalendario.length;

    const elTarefas = document.getElementById('stat-tarefas-programadas');
    if (elTarefas) elTarefas.textContent = totalTarefas;

    const elReunioes = document.getElementById('stat-reunioes-calendar');
    if (elReunioes) elReunioes.textContent = reunioesCal;

    const elTaxa = document.getElementById('stat-taxa-conclusao');
    if (elTaxa) elTaxa.textContent = taxa + '%';
  }

  function obterTarefasDoCicloAtual() {
    let segISO = '';
    let domISO = '';

    if (appState.infoSemana && appState.infoSemana.segundaISO && appState.infoSemana.domingoISO) {
      segISO = appState.infoSemana.segundaISO;
      domISO = appState.infoSemana.domingoISO;
    } else {
      const dRef = parseDataISOParaLocal(appState.dataReferencia);
      const seg = obterSegundaFeira(dRef);
      const dom = new Date(seg);
      dom.setDate(dom.getDate() + 6);
      segISO = formatarDataLocalISO(seg);
      domISO = formatarDataLocalISO(dom);
    }

    return appState.tarefas.filter(t => {
      const dt = normalizarDataISO(t.Data_Programada);
      return dt && dt >= segISO && dt <= domISO && t.Status !== 'Arquivada';
    });
  }

  function renderizarAccordionDiasSemana() {
    const container = document.getElementById('week-accordion-container');
    if (!container) return;

    const hojeISO = appState.hojeISO || formatarDataLocalISO(new Date());

    // Se estiver no modo 'dia'
    if (appState.modoVisualizacao === 'dia') {
      const dataISO = normalizarDataISO(appState.dataReferencia) || hojeISO;
      const dAtual = parseDataISOParaLocal(dataISO);
      const diaNum = String(dAtual.getDate()).padStart(2, '0');
      const mesNome = dAtual.toLocaleDateString('pt-BR', { month: 'short' });
      const diaNome = dAtual.toLocaleDateString('pt-BR', { weekday: 'long' });
      const diaNomeCap = diaNome.charAt(0).toUpperCase() + diaNome.slice(1);

      const tarefasDia = appState.tarefas.filter(t => {
        const dt = normalizarDataISO(t.Data_Programada);
        return dt === dataISO && t.Status !== 'Arquivada';
      });
      const concluidas = tarefasDia.filter(t => t.Status === 'Concluída').length;

      const eventosDia = appState.eventosCalendario.filter(e => {
        const dtEv = normalizarDataISO(e.dataISO || (e.inicio ? e.inicio.substring(0, 10) : ''));
        return dtEv === dataISO;
      });

      const ehHoje = (dataISO === hojeISO);

      container.innerHTML = `
        <div class="bg-white/90 border border-[#ebdce7] rounded-2xl shadow-botanical overflow-hidden mb-6">
          <div class="p-4 sm:p-5 bg-[#fff8f5] border-b border-[#ebdce7] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl ${ehHoje ? 'bg-[#72526d] text-white shadow-xs' : 'bg-[#f5ece7] text-[#72526d]'} flex flex-col items-center justify-center font-bold">
                <span class="text-sm leading-none">${diaNum}</span>
                <span class="text-[10px] uppercase font-semibold leading-none mt-1">${mesNome}</span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-headline font-bold text-base text-[#211a1e]">${diaNomeCap}</h3>
                  ${ehHoje ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#72526d] text-white">Hoje</span>' : ''}
                </div>
                <span class="text-xs text-[#80747d] block mt-0.5">${concluidas}/${tarefasDia.length} concluídas • ${eventosDia.length} reuniões na Agenda Fabiane Satie</span>
              </div>
            </div>
            <button type="button" class="px-3.5 py-1.5 bg-[#72526d] hover:bg-[#5f445b] text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5 self-start sm:self-center transition-all active:scale-95" onclick="abrirModalNovaTarefaParaData('${dataISO}')">
              <span class="material-symbols-outlined text-[15px]">add</span>
              <span>Adicionar Tarefa</span>
            </button>
          </div>

          <div class="p-4 sm:p-5">
            ${eventosDia.length > 0 ? `
              <div class="mb-5">
                <span class="text-[10px] font-bold uppercase tracking-wider text-[#4f634f] flex items-center gap-1 mb-2.5">
                  <span class="material-symbols-outlined text-[15px]">calendar_month</span>
                  <span>Agenda Fabiane Satie (${eventosDia.length})</span>
                </span>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${eventosDia.map(ev => renderizarCardReuniaoGoogle(ev)).join('')}
                </div>
              </div>
            ` : ''}

            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-[#72526d] flex items-center gap-1 mb-2.5">
                <span class="material-symbols-outlined text-[15px]">check_box</span>
                <span>Tarefas do Dia (${tarefasDia.length})</span>
              </span>
              ${tarefasDia.length > 0 ? `
                <div class="flex flex-col gap-2.5">
                  ${tarefasDia.map(t => renderizarCardTarefaAgenda(t)).join('')}
                </div>
              ` : `
                <div class="p-6 text-center rounded-xl bg-[#fff8f5] border border-dashed border-[#d2c2cd] text-xs text-[#80747d]">
                  Nenhuma tarefa programada para este dia.
                </div>
              `}
            </div>
          </div>
        </div>
      `;
      return;
    }

    // Modo 'semana':
    let diasSemana = [];
    if (appState.infoSemana && appState.infoSemana.diasSemana && appState.infoSemana.diasSemana.length === 7) {
      diasSemana = appState.infoSemana.diasSemana.map(d => ({
        dataISO: d.dataISO,
        diaNome: d.diaSemanaCompleto,
        diaNum: String(d.numeroDia).padStart(2, '0'),
        mesNome: d.mesCurto,
        ehHoje: d.isHoje
      }));
    } else {
      const dRef = parseDataISOParaLocal(appState.dataReferencia);
      const seg = obterSegundaFeira(dRef);
      const nomesDias = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
      for (let i = 0; i < 7; i++) {
        const dAtual = new Date(seg);
        dAtual.setDate(seg.getDate() + i);
        const dataISO = formatarDataLocalISO(dAtual);
        diasSemana.push({
          dataISO: dataISO,
          diaNome: nomesDias[i],
          diaNum: String(dAtual.getDate()).padStart(2, '0'),
          mesNome: dAtual.toLocaleDateString('pt-BR', { month: 'short' }),
          ehHoje: (dataISO === hojeISO)
        });
      }
    }

    const segISO = diasSemana[0].dataISO;
    const domISO = diasSemana[diasSemana.length - 1].dataISO;

    // Detecta tarefas atrasadas ou sem data que precisam de atenção executiva
    const tarefasAtrasadasOuSemData = appState.tarefas.filter(t => {
      if (t.Status === 'Concluída' || t.Status === 'Arquivada') return false;
      const dt = normalizarDataISO(t.Data_Programada);
      return !dt || dt < segISO;
    });

    let html = '';

    // Gaveta de Tarefas Atrasadas / Sem Data Programada
    if (tarefasAtrasadasOuSemData.length > 0) {
      html += `
        <div class="mb-5 bg-[#fff8f5] border border-[#ffdbc8] rounded-2xl p-4 shadow-sm washi-tape" style="border-top: 4px solid #ffdbc8;">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-[#ffdbc8] text-[#7e5236] flex items-center justify-center font-bold shrink-0">
                <span class="material-symbols-outlined text-[18px]">history</span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-headline font-bold text-sm text-[#211a1e]">Tarefas Pendentes Fora Desta Semana (${tarefasAtrasadasOuSemData.length})</span>
                  <span class="px-2 py-0.2 rounded-full text-[10px] font-bold bg-[#ffdbc8] text-[#7e5236]">Ação Recomendada</span>
                </div>
                <span class="text-[11px] text-[#80747d] block">Tarefas de dias anteriores ainda não concluídas ou sem data programada.</span>
              </div>
            </div>
            <button type="button" class="px-3 py-1.5 bg-[#72526d] hover:bg-[#5f445b] text-white rounded-xl text-xs font-bold transition-all shadow-xs flex items-center gap-1.5 self-start sm:self-center active:scale-95" onclick="puxarTarefasAtrasadasParaHoje()">
              <span class="material-symbols-outlined text-[15px]">today</span>
              <span>Puxar Tudo para Hoje</span>
            </button>
          </div>
          <div class="flex flex-col gap-2.5">
            ${tarefasAtrasadasOuSemData.map(t => renderizarCardTarefaAgenda(t)).join('')}
          </div>
        </div>
      `;
    }

    // Renderiza cada um dos 7 dias da semana
    diasSemana.forEach(diaInfo => {
      const dataISO = diaInfo.dataISO;
      const tarefasDia = appState.tarefas.filter(t => {
        const dt = normalizarDataISO(t.Data_Programada);
        return dt === dataISO && t.Status !== 'Arquivada';
      });
      const concluidas = tarefasDia.filter(t => t.Status === 'Concluída').length;

      const eventosDia = appState.eventosCalendario.filter(e => {
        const dtEv = normalizarDataISO(e.dataISO || (e.inicio ? e.inicio.substring(0, 10) : ''));
        return dtEv === dataISO;
      });

      const ehHoje = diaInfo.ehHoje || (dataISO === hojeISO);
      const ehPassado = (dataISO < hojeISO);

      let badgeTag = '';
      if (ehHoje) {
        badgeTag = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#72526d] text-white">Hoje</span>`;
      } else if (ehPassado) {
        badgeTag = `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#ebdce7] text-[#4e444c]">Passado</span>`;
      }

      const aberto = (appState.accordionAberto[dataISO] !== undefined)
        ? appState.accordionAberto[dataISO]
        : (appState.expandirTodos || ehHoje);

      html += `
        <div class="bg-white/90 border border-[#ebdce7] rounded-2xl shadow-botanical overflow-hidden transition-all duration-200 mb-4">
          <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-[#fff8f5]/80 select-none transition-colors" onclick="toggleAccordionDia('${dataISO}')">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${ehHoje ? 'bg-[#72526d] text-white shadow-xs' : 'bg-[#f5ece7] text-[#72526d]'} flex flex-col items-center justify-center font-bold">
                <span class="text-xs leading-none">${diaInfo.diaNum}</span>
                <span class="text-[9px] uppercase font-semibold leading-none mt-0.5">${diaInfo.mesNome}</span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-headline font-bold text-sm text-[#211a1e]">${diaInfo.diaNome}</span>
                  ${badgeTag}
                </div>
                <span class="text-[11px] text-[#80747d] block mt-0.5">
                  ${concluidas}/${tarefasDia.length} concluídas • ${eventosDia.length} reuniões na Agenda Fabiane Satie
                </span>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button type="button" class="p-1 rounded-full text-[#80747d] hover:bg-[#f5ece7] transition-transform ${aberto ? 'rotate-180' : ''}">
                <span class="material-symbols-outlined text-[20px]">expand_more</span>
              </button>
            </div>
          </div>

          <div class="accordion-content ${aberto ? '' : 'collapsed'} px-4 pb-4 pt-1 border-t border-[#ebdce7]/60">
            ${eventosDia.length > 0 ? `
              <div class="mb-4 pt-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-[#4f634f] flex items-center gap-1 mb-2">
                  <span class="material-symbols-outlined text-[14px]">calendar_month</span>
                  <span>Agenda Fabiane Satie (${eventosDia.length})</span>
                </span>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${eventosDia.map(ev => renderizarCardReuniaoGoogle(ev)).join('')}
                </div>
              </div>
            ` : ''}

            <div class="pt-2">
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-[#72526d] flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px]">check_box</span>
                  <span>Tarefas do Dia (${tarefasDia.length})</span>
                </span>
                <button type="button" class="text-[11px] font-semibold text-[#72526d] hover:underline flex items-center gap-0.5" onclick="abrirModalNovaTarefaParaData('${dataISO}')">
                  <span class="material-symbols-outlined text-[14px]">add</span>
                  <span>Adicionar</span>
                </button>
              </div>

              ${tarefasDia.length > 0 ? `
                <div class="flex flex-col gap-2.5">
                  ${tarefasDia.map(t => renderizarCardTarefaAgenda(t)).join('')}
                </div>
              ` : `
                <div class="p-4 text-center rounded-xl bg-[#fff8f5] border border-dashed border-[#d2c2cd] text-xs text-[#80747d]">
                  Nenhuma tarefa programada para este dia.
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function renderizarCardReuniaoGoogle(ev) {
    const horaInicio = ev.horaInicio || (ev.inicio ? ev.inicio.substring(11, 16) : '--:--');
    const horaFim = ev.horaFim || (ev.fim ? ev.fim.substring(11, 16) : '');
    const horarioTexto = ev.diaInteiro ? 'Dia Inteiro' : (horaFim ? `${horaInicio} - ${horaFim}` : horaInicio);
    const meetLink = ev.linkMeet || (ev.descricao && ev.descricao.includes('meet.google.com') ? (ev.descricao.match(/https:\/\/meet\.google\.com\/[a-z0-9-]+/i) || [''])[0] : '');
    const calNome = ev.nomeCalendario ? escapeHtml(ev.nomeCalendario) : 'Google Calendar';

    return `
      <div class="bg-[#d2e9cf]/25 border border-[#4f634f]/20 rounded-xl p-3 flex flex-col justify-between hover:bg-[#d2e9cf]/35 transition-all shadow-2xs">
        <div>
          <div class="flex items-center justify-between text-[11px] font-semibold text-[#384b39] mb-1">
            <span class="flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">schedule</span>
              <span>${horarioTexto}</span>
            </span>
            <span class="px-1.5 py-0.5 bg-[#4f634f] text-white rounded text-[9px] font-bold line-clamp-1 max-w-[120px]" title="${calNome}">${calNome}</span>
          </div>
          <span class="text-xs font-bold text-[#211a1e] line-clamp-2 block leading-snug" title="${escapeHtml(ev.titulo)}">${escapeHtml(ev.titulo || 'Reunião')}</span>
          ${ev.local ? `
            <span class="text-[10px] text-[#4f634f] flex items-center gap-1 mt-1 line-clamp-1">
              <span class="material-symbols-outlined text-[12px]">location_on</span>
              ${escapeHtml(ev.local)}
            </span>
          ` : ''}
        </div>

        <div class="mt-2.5 pt-2 border-t border-[#4f634f]/15 flex items-center justify-between">
          <button type="button" onclick="abrirGoogleCalendarNaWeb()" class="text-[10px] text-[#4f634f] hover:text-[#384b39] font-semibold hover:underline flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0" title="Abrir Google Agenda em nova guia">
            <span>Ver no Google Agenda</span>
            <svg class="w-3 h-3 text-[#4f634f]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </button>
          ${meetLink ? `
            <button type="button" onclick="window.open('${meetLink}', '_blank')" class="px-2.5 py-1 bg-[#4f634f] hover:bg-[#3d4f3d] text-white rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all shadow-xs cursor-pointer">
              <span class="material-symbols-outlined text-[13px]">video_call</span>
              <span>Entrar no Meet</span>
            </button>
          ` : ''}
        </div>
      </div>
    `;
  }

  function abrirGoogleCalendarNaWeb() {
    window.open('https://calendar.google.com/calendar/r', '_blank');
  }
  window.abrirGoogleCalendarNaWeb = abrirGoogleCalendarNaWeb;

  function renderizarCardTarefaAgenda(t) {
    const concluida = (t.Status === 'Concluída');
    const prioridadeCores = {
      'Alta': 'bg-[#ffdad6] text-[#ba1a1a]',
      'Média': 'bg-[#ffd7f6] text-[#72526d]',
      'Baixa': 'bg-[#d2e9cf] text-[#384b39]'
    };
    const badgePrio = prioridadeCores[t.Prioridade] || 'bg-[#f5ece7] text-[#4e444c]';

    return `
      <div class="bg-white border border-[#ebdce7] rounded-xl p-3 shadow-xs hover:shadow-botanical transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${concluida ? 'opacity-60 bg-[#fff8f5]' : ''}">
        <div class="flex items-start gap-3 min-w-0">
          
          <!-- Botão Concluir Rápido -->
          <button type="button" class="mt-0.5 w-5 h-5 rounded-md border ${concluida ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-[#d2c2cd] hover:border-[#72526d] text-transparent hover:text-[#72526d]'} flex items-center justify-center transition-all shrink-0" onclick="concluirTarefaRapido('${t.ID_Tarefa}')" title="Marcar como Concluída">
            <span class="material-symbols-outlined text-[14px]">check</span>
          </button>

          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-0.5">
              <span class="px-2 py-0.2 rounded-full text-[9px] font-bold ${badgePrio}">${t.Prioridade}</span>
              ${t.Nome_Projeto ? `
                <span class="px-2 py-0.2 rounded-full text-[9px] font-medium bg-[#f5ece7] text-[#72526d]">${escapeHtml(t.Nome_Projeto)}</span>
              ` : ''}
              ${t.Tempo_Total_Segundos > 0 ? `
                <span class="text-[10px] font-mono text-[#80747d] flex items-center gap-0.5">
                  <span class="material-symbols-outlined text-[12px]">timer</span>
                  ${t.Tempo_Total_Formatado}
                </span>
              ` : ''}
            </div>

            <span class="text-xs font-semibold text-[#211a1e] block ${concluida ? 'line-through text-[#80747d]' : ''} cursor-pointer" onclick="abrirModalEditarTarefa('${t.ID_Tarefa}')">
              ${escapeHtml(t.Titulo)}
            </span>

            ${t.Proximos_Passos ? `

  function navegarPeriodoAnterior() {
    const d = parseDataISOParaLocal(appState.dataReferencia);
    if (appState.modoVisualizacao === 'dia') {
      d.setDate(d.getDate() - 1);
    } else if (appState.modoVisualizacao === 'mes') {
      d.setMonth(d.getMonth() - 1);
    } else {
      d.setDate(d.getDate() - 7);
    }
    appState.dataReferencia = formatarDataLocalISO(d);
    carregarDadosApp();
  }
  window.navegarPeriodoAnterior = navegarPeriodoAnterior;

    const d = parseDataISOParaLocal(appState.dataReferencia);
    if (appState.modoVisualizacao === 'dia') {
      d.setDate(d.getDate() + 1);
    } else if (appState.modoVisualizacao === 'mes') {
      d.setMonth(d.getMonth() + 1);
    } else {
      d.setDate(d.getDate() + 7);
    }
    appState.dataReferencia = formatarDataLocalISO(d);
    carregarDadosApp();
  }

  // Mini Calendário Floral
  function renderizarMiniCalendario() {
    const grid = document.getElementById('mini-calendar-grid');
    const elTitulo = document.getElementById('mini-calendar-month-name');
    if (!grid) return;

    const dRef = parseDataISOParaLocal(appState.dataReferencia);
    const ano = dRef.getFullYear();
    const mes = dRef.getMonth();

    if (elTitulo) {
      elTitulo.textContent = dRef.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    }

    const primeiroDia = new Date(ano, mes, 1);
    const ultimoDia = new Date(ano, mes + 1, 0);
    const hojeISO = new Date().toISOString().split('T')[0];

    let html = `
      <span class="text-[10px] font-bold text-[#80747d]">D</span>
      <span class="text-[10px] font-bold text-[#80747d]">S</span>
      <span class="text-[10px] font-bold text-[#80747d]">T</span>
      <span class="text-[10px] font-bold text-[#80747d]">Q</span>
      <span class="text-[10px] font-bold text-[#80747d]">Q</span>
      <span class="text-[10px] font-bold text-[#80747d]">S</span>
      <span class="text-[10px] font-bold text-[#80747d]">S</span>
    `;

    // Espaços vazios antes do 1º dia
    for (let i = 0; i < primeiroDia.getDay(); i++) {
      html += `<span></span>`;
    }

    // Dias do mês
    for (let d = 1; d <= ultimoDia.getDate(); d++) {
      const dataIsoDia = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const ehHoje = (dataIsoDia === hojeISO);
      const ehRef = (dataIsoDia === appState.dataReferencia);

      let classes = 'w-7 h-7 mx-auto rounded-full flex items-center justify-center cursor-pointer transition-all ';
      if (ehRef) {
        classes += 'bg-[#72526d] text-white font-bold shadow-xs';
      } else if (ehHoje) {
        classes += 'ring-2 ring-[#72526d] font-bold text-[#72526d]';
      } else {
        classes += 'hover:bg-[#f5ece7] text-[#211a1e]';
      }

      html += `<button type="button" class="${classes}" onclick="selecionarDataMiniCalendario('${dataIsoDia}')">${d}</button>`;
    }

    grid.innerHTML = html;
  }

  function selecionarDataMiniCalendario(dataISO) {

  }

    const total = tarefas.length;
    const concluidas = tarefas.filter(t => t.Status === 'Concluída').length;
    const pct = total > 0 ? Math.round((concluidas / total) * 100) : 0;

    const elLabel = document.getElementById('weekly-progress-label');
    const elBar = document.getElementById('weekly-progress-bar');
    if (elLabel) elLabel.textContent = `${concluidas} de ${total} tarefas concluídas (${pct}%)`;
    if (elBar) elBar.style.width = pct + '%';
  }

    const pctProgresso = tarefasDoProjeto.length > 0
      ? Math.round((colConcluidas.length / tarefasDoProjeto.length) * 100)
      : 0;

    const corPastel = p.Cor_Pastel || '#ffd7f6';

    return `

  function renderizarCardKanbanTrello(t) {
    const concluida = (t.Status === 'Concluída');
    const aguardando = (t.Status === 'Aguardando');
    const prioridadeCores = {
      'Alta': 'bg-[#ffdad6] text-[#ba1a1a]',
      'Média': 'bg-[#ffd7f6] text-[#72526d]',
      'Baixa': 'bg-[#d2e9cf] text-[#384b39]'
    };
    const badgePrio = prioridadeCores[t.Prioridade] || 'bg-[#f5ece7] text-[#4e444c]';

    return `
      <div class="bg-white border border-[#ebdce7] rounded-xl p-3 shadow-xs hover:shadow-botanical transition-all group ${concluida ? 'opacity-65 bg-[#fff8f5]' : ''}">
        
        <!-- Topo do Card -->
        <div class="flex items-center justify-between mb-1.5">
          <span class="px-2 py-0.2 rounded-full text-[9px] font-bold ${badgePrio}">${t.Prioridade}</span>
          
          <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
            ${!concluida ? `
              <button type="button" class="w-6 h-6 rounded hover:bg-[#f5ece7] text-[#72526d] flex items-center justify-center transition-all" onclick="iniciarCronometroTarefa('${t.ID_Tarefa}')" title="Play Cronômetro">
                <span class="material-symbols-outlined text-[15px]">play_arrow</span>
              </button>
              <button type="button" class="w-6 h-6 rounded hover:bg-[#f5ece7] text-[#4f634f] flex items-center justify-center transition-all" onclick="concluirTarefaRapido('${t.ID_Tarefa}')" title="Marcar como Concluída">
                <span class="material-symbols-outlined text-[15px]">check</span>
              </button>
            ` : `
              <button type="button" class="w-6 h-6 rounded hover:bg-[#f5ece7] text-[#80747d] flex items-center justify-center transition-all" onclick="reabrirTarefaRapido('${t.ID_Tarefa}')" title="Reabrir Tarefa">
                <span class="material-symbols-outlined text-[15px]">undo</span>
              </button>
            `}
          </div>
        </div>

        <!-- Título -->
        <h4 class="text-xs font-semibold text-[#211a1e] leading-snug mb-1.5 cursor-pointer hover:text-[#72526d] ${concluida ? 'line-through text-[#80747d]' : ''}" onclick="abrirModalEditarTarefa('${t.ID_Tarefa}')">
          ${escapeHtml(t.Titulo)}
        </h4>

        <!-- Aging / Bloqueio se Aguardando -->
        ${aguardando ? `
          <div class="p-2 bg-[#ffdbc8]/30 rounded-lg border-l-2 border-l-[#7e5236] text-[10px] text-[#7e5236] leading-tight mb-2">
            <div class="font-bold flex items-center gap-1">
              <span class="material-symbols-outlined text-[12px]">schedule</span>
              <span>${t.diasAguardando || 1} dias aguardando</span>
            </div>
            ${t.Motivo_Aguardando ? `<div class="mt-0.5 text-[#4e444c]">${escapeHtml(t.Motivo_Aguardando)}</div>` : ''}
          </div>
        ` : ''}

        <!-- Próximo Passo Chave -->
        ${t.Proximos_Passos && !aguardando ? `
          <div class="p-2 bg-[#fbf2ed] rounded-lg border-l-2 border-l-[#72526d] text-[10px] text-[#4e444c] leading-tight mb-2">
            <span class="font-bold text-[#72526d]">Passo Chave:</span> ${escapeHtml(t.Proximos_Passos)}
          </div>
        ` : ''}

        <!-- Rodapé do Card: Data, Tempo e Mover de Coluna -->
        <div class="flex items-center justify-between pt-2 border-t border-[#ebdce7]/60 text-[10px] text-[#80747d]">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[13px]">calendar_today</span>
            <span>${t.Data_Programada_BR || t.Data_Programada || '--'}</span>
          </div>

          <!-- Ação rápida para trocar de coluna -->
          <div class="flex items-center gap-1">
            <select class="text-[9px] font-bold bg-[#f5ece7] text-[#72526d] rounded px-1.5 py-0.5 border-0 focus:outline-none cursor-pointer" onchange="trocarStatusTarefaRapido('${t.ID_Tarefa}', this.value)" title="Mover status da tarefa">
              <option value="Pendente" ${t.Status === 'Pendente' || !t.Status ? 'selected' : ''}>📋 A Fazer</option>
              <option value="Em Andamento" ${t.Status === 'Em Andamento' ? 'selected' : ''}>⚡ Andamento</option>
              <option value="Aguardando" ${t.Status === 'Aguardando' ? 'selected' : ''}>⏳ Aguardando</option>
              <option value="Concluída" ${t.Status === 'Concluída' ? 'selected' : ''}>✅ Concluída</option>
            </select>
          </div>
        </div>

      </div>
    `;
  }

  function trocarStatusTarefaRapido(idTarefa, novoStatus) {
    if (!idTarefa || !novoStatus) return;
    mostrarToast('Atualizando status...', 'info');

    if (novoStatus === 'Aguardando') {
      const motivo = prompt('Qual o motivo do bloqueio / aguardo?', 'Aguardando retorno externo');
      if (motivo === null) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.sucesso) {
            mostrarToast('Status atualizado para Aguardando!', 'success');
            carregarDadosApp();
          }
        })
        .withFailureHandler(onErroServidor)
        .atualizarStatusTarefa(idTarefa, novoStatus, motivo);
      return;
    }

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          mostrarToast(`Status atualizado para ${novoStatus}!`, 'success');
          carregarDadosApp();
        }
      })
      .withFailureHandler(onErroServidor)
      .atualizarStatusTarefa(idTarefa, novoStatus);
  }
  window.trocarStatusTarefaRapido = trocarStatusTarefaRapido;

  function reabrirTarefaRapido(idTarefa) {
    trocarStatusTarefaRapido(idTarefa, 'Pendente');
  }
  window.reabrirTarefaRapido = reabrirTarefaRapido;

  function toggleConcluidasProjeto(idProjeto) {
    if (!appState.tarefasConcluidasAbertas) appState.tarefasConcluidasAbertas = {};
    appState.tarefasConcluidasAbertas[idProjeto] = !appState.tarefasConcluidasAbertas[idProjeto];
    renderizarColunasKanban();
  }
  window.toggleConcluidasProjeto = toggleConcluidasProjeto;

  // =========================================================================
  // 6. TELA 3: FILA DE BLOQUEIOS & GARGALOS (AGING PIPELINE)
  // =========================================================================
  function renderizarBloqueios() {
    const container = document.getElementById('blocking-tasks-list');
    if (!container) return;

    // Filtra tarefas com status 'Aguardando'
    let bloqueios = appState.tarefas.filter(t => t.Status === 'Aguardando');

    // Atualiza contadores das 3 Faixas Executivas
    let f1 = 0, f2 = 0, f3 = 0;
    bloqueios.forEach(t => {
      const dias = t.diasAguardando || 1;
      if (dias <= 2) f1++;
      else if (dias <= 5) f2++;
      else f3++;
    });

    const elF1 = document.getElementById('count-faixa-1');
    const elF2 = document.getElementById('count-faixa-2');
    const elF3 = document.getElementById('count-faixa-3');
    if (elF1) elF1.textContent = f1;
    if (elF2) elF2.textContent = f2;
    if (elF3) elF3.textContent = f3;

    // Filtro de busca
    if (appState.filtroBuscaBloqueio) {
      bloqueios = bloqueios.filter(t => {
        const termo = appState.filtroBuscaBloqueio;
        return (t.Titulo && t.Titulo.toLowerCase().includes(termo)) ||
               (t.Motivo_Aguardando && t.Motivo_Aguardando.toLowerCase().includes(termo)) ||
               (t.Nome_Projeto && t.Nome_Projeto.toLowerCase().includes(termo));
      });
    }

    if (bloqueios.length === 0) {
      container.innerHTML = `
        <div class="p-12 text-center bg-white/70 rounded-2xl border border-dashed border-[#d2c2cd] text-[#80747d]">
          <span class="material-symbols-outlined text-[32px] text-emerald-600 mb-2 block">task_alt</span>
          <span class="font-headline font-bold text-base text-[#211a1e] block">Nenhum gargalo ativo!</span>
          <p class="text-xs text-[#80747d] mt-1">Todas as tarefas com dependências externas estão liberadas.</p>
        </div>
      `;
      return;
    }

    let html = '';

    bloqueios.forEach(t => {
      const dias = t.diasAguardando || 1;
      
      // Estilização por faixa
      let agingClass = 'bg-[#d2e9cf] text-[#384b39] border-[#4f634f]/30';
      let tagFaixa = 'Faixa 1 (1-2d)';
      if (dias > 5) {
        agingClass = 'bg-[#ffdad6] text-[#ba1a1a] border-[#ba1a1a]/30';
        tagFaixa = 'Faixa 3 (Crítico)';
      } else if (dias > 2) {
        agingClass = 'bg-[#ffdbc8] text-[#7e5236] border-[#7e5236]/30';
        tagFaixa = 'Faixa 2 (Cobrança)';
      }

      html += `
        <div class="bg-white border border-[#ebdce7] rounded-2xl p-5 shadow-botanical flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          
          <div class="flex items-start gap-4">
            
            <!-- Aging Gauge Badge Grande -->
            <div class="w-14 h-14 rounded-2xl border flex flex-col items-center justify-center shrink-0 ${agingClass}">
              <span class="text-lg font-bold leading-none">${dias}d</span>
              <span class="text-[9px] uppercase font-semibold leading-none mt-1">espera</span>
            </div>

            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.2 rounded-full text-[9px] font-bold ${agingClass}">${tagFaixa}</span>
                ${t.Nome_Projeto ? `
                  <span class="px-2 py-0.2 rounded-full text-[9px] font-medium bg-[#f5ece7] text-[#72526d]">${escapeHtml(t.Nome_Projeto)}</span>
                ` : ''}
                <span class="text-[11px] text-[#80747d]">Retido desde: ${t.Data_Inicio_Aguardando || 'Hoje'}</span>
              </div>

              <h3 class="text-sm font-bold text-[#211a1e] leading-snug cursor-pointer hover:text-[#72526d]" onclick="abrirModalEditarTarefa('${t.ID_Tarefa}')">
                ${escapeHtml(t.Titulo)}
              </h3>

              <!-- Caixa de Motivo de Bloqueio -->
              <div class="mt-2 p-2.5 bg-[#fbf2ed] rounded-xl border border-[#ebdce7] text-xs text-[#4e444c] flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-[#7e5236] shrink-0">warning</span>
                <span><strong>Motivo:</strong> ${escapeHtml(t.Motivo_Aguardando || 'Dependência externa não informada.')}</span>
              </div>
            </div>

          </div>

          <!-- Ações Imediatas de Desbloqueio e Follow-up -->
          <div class="flex items-center gap-2 self-end md:self-center shrink-0 flex-wrap">
            
            <!-- Enviar Cobrança com Template -->
            <button type="button" class="px-3 py-1.5 bg-[#72526d] hover:bg-[#5f445b] text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-1.5 transition-all" onclick="abrirModalFollowupParaTarefa('${t.ID_Tarefa}')">
              <span class="material-symbols-outlined text-[15px]">send</span>
              <span>Enviar Cobrança</span>
            </button>

            <!-- Desbloquear Hoje -->
            <button type="button" class="px-3 py-1.5 bg-[#d2e9cf] hover:bg-[#bfe1bb] text-[#384b39] rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all" onclick="desbloquearTarefa('${t.ID_Tarefa}')">
              <span class="material-symbols-outlined text-[15px]">lock_open</span>
              <span>Desbloquear Hoje</span>
            </button>

            <!-- Adiar +48h -->
            <button type="button" class="px-2.5 py-1.5 bg-[#f5ece7] hover:bg-[#ebdce7] text-[#72526d] rounded-xl text-xs font-semibold flex items-center gap-1 transition-all" onclick="adiarTarefaBloqueada('${t.ID_Tarefa}')" title="Adiar (+48h)">
              <span class="material-symbols-outlined text-[15px]">more_time</span>
              <span>+48h</span>
            </button>

          </div>

        </div>
      `;
    });

    container.innerHTML = html;
  }

  function filtrarBloqueios() {
    const input = document.getElementById('input-busca-bloqueios');
    if (input) appState.filtroBuscaBloqueio = input.value.toLowerCase().trim();
    renderizarBloqueios();
  }
  window.filtrarBloqueios = filtrarBloqueios;

  function desbloquearTarefa(idTarefa) {
    mostrarToast('Atualizando status para Em Andamento...', 'info');
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          mostrarToast('Tarefa desbloqueada com sucesso!', 'success');
          carregarDadosApp();
        } else {
          mostrarToast(res ? res.mensagem : 'Erro ao desbloquear', 'error');
        }
      })
      .withFailureHandler(onErroServidor)
      .atualizarStatusTarefa(idTarefa, 'Em Andamento');
  }
  window.desbloquearTarefa = desbloquearTarefa;

  function adiarTarefaBloqueada(idTarefa) {
    const t = appState.tarefas.find(item => item.ID_Tarefa === idTarefa);
    if (!t) return;

    const dataOrig = t.Data_Programada ? parseDataISOParaLocal(t.Data_Programada) : new Date();
    dataOrig.setDate(dataOrig.getDate() + 2);
    const novaDataISO = dataOrig.toISOString().split('T')[0];

    mostrarToast('Adiou prazo em 48h...', 'info');

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          mostrarToast('Prazo reprogramado para ' + novaDataISO, 'success');
          carregarDadosApp();
        }
      })
      .withFailureHandler(onErroServidor)
      .atualizarDataTarefa(idTarefa, novaDataISO);
  }
  window.adiarTarefaBloqueada = adiarTarefaBloqueada;

  // =========================================================================
  // 7. TELA 4: HISTÓRICO & MÉTRICAS (ATELIER DE GOVERNANÇA & TEMPO)
  // =========================================================================
  function renderizarMetricas() {
    renderizarGraficoDonutTempo();
    renderizarGraficoCadenciaDiaria();
    renderizarTabelaAuditoriaHistorico();

  function renderizarGraficoDonutTempo() {
    const legend = document.getElementById('metricas-legend-projetos');
    if (!legend) return;

    // Agrupa tempo total por projeto a partir do histórico ou das tarefas
    const tempoPorProjeto = {};
    appState.tarefas.forEach(t => {
      const proj = t.Nome_Projeto || 'Sem Projeto';
      tempoPorProjeto[proj] = (tempoPorProjeto[proj] || 0) + (t.Tempo_Total_Segundos || 0);
    });

    const totalSegundos = Object.values(tempoPorProjeto).reduce((acc, v) => acc + v, 0);

    let htmlLegend = '';
    const cores = ['#72526d', '#4f634f', '#7e5236', '#8c6a86', '#4e444c'];
    let idx = 0;

    for (const [projNome, segs] of Object.entries(tempoPorProjeto)) {
      if (segs <= 0) continue;
      const pct = totalSegundos > 0 ? Math.round((segs / totalSegundos) * 100) : 0;
      const cor = cores[idx % cores.length];
      const horasFormatadas = (segs / 3600).toFixed(1) + 'h';

      htmlLegend += `
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${cor};"></span>
            <span class="text-[#211a1e] font-medium">${escapeHtml(projNome)}</span>
          </div>
          <span class="font-bold text-[#72526d]">${horasFormatadas} (${pct}%)</span>
        </div>
      `;
      idx++;
    }

    if (!htmlLegend) {
      htmlLegend = '<span class="text-xs text-[#80747d] text-center">Nenhuma sessão de cronômetro gravada ainda.</span>';
    }

    legend.innerHTML = htmlLegend;
  }

  function renderizarGraficoCadenciaDiaria() {
    const chart = document.getElementById('cadencia-bar-chart');
    if (!chart) return;

    const diasSemana = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'];
    let html = `
      <!-- Linha Tracejada de Meta 8h -->
      <div class="absolute top-10 left-0 right-0 border-b border-dashed border-[#ba1a1a]/40 flex justify-end">
        <span class="text-[9px] text-[#ba1a1a] pr-1 -mt-3 font-semibold">Meta 8h</span>
      </div>
    `;

    // Mock ou cálculo real dos segundos por dia
    const dRef = parseDataISOParaLocal(appState.dataReferencia);
    const seg = obterSegundaFeira(dRef);

    for (let i = 0; i < 5; i++) {
      const dAtual = new Date(seg);
      dAtual.setDate(seg.getDate() + i);
      const dataISO = dAtual.toISOString().split('T')[0];

      // Soma sessões deste dia
      let segsDia = 0;
      appState.historicoTempo.forEach(h => {
        if (h.dataExecucao === dataISO) {
          segsDia += (h.duracaoSegundos || 0);
        }
      });

      const horas = (segsDia / 3600);
      const alturaPct = Math.min(100, Math.round((horas / 8) * 80)); // 8h = 80% da altura

      html += `
        <div class="flex-1 flex flex-col items-center gap-1 z-10">
          <span class="text-[9px] font-bold text-[#72526d]">${horas.toFixed(1)}h</span>
          <div class="w-full bg-[#f5ece7] rounded-t-lg h-24 flex items-end">
            <div class="w-full bg-[#72526d] hover:bg-[#5f445b] rounded-t-lg transition-all" style="height: ${Math.max(8, alturaPct)}%;"></div>
          </div>
          <span class="text-[10px] font-semibold text-[#80747d]">${diasSemana[i]}</span>
        </div>
      `;
    }

    chart.innerHTML = html;
  }

  function iniciarCronometroTarefa(idTarefa) {
    const t = appState.tarefas.find(item => item.ID_Tarefa === idTarefa);
    if (!t) return;

    if (appState.cronometro.ativo && appState.cronometro.idTarefa === idTarefa) {
      mostrarToast('Esta tarefa já está em execução no cronômetro.', 'info');
      return;
    }

    // Se já havia outro cronômetro rodando, salva ou descarta
    if (appState.cronometro.ativo) {
      if (!confirm('Deseja alternar para esta nova tarefa e registrar a sessão anterior?')) {
        return;
      }
      salvarSessaoCronometro();
    }

    appState.cronometro.idTarefa = t.ID_Tarefa;
    appState.cronometro.tituloTarefa = t.Titulo;
    appState.cronometro.nomeProjeto = t.Nome_Projeto || 'Sem Projeto';
    appState.cronometro.segundos = 0;
    appState.cronometro.timestampInicio = Date.now();
    appState.cronometro.ativo = true;

    iniciarLoopCronometro();
    salvarCronometroLocal();
    atualizarDisplayCronometro();

    mostrarToast(`Foco ativado: ${t.Titulo}`, 'success');
  }
  window.iniciarCronometroTarefa = iniciarCronometroTarefa;

  function iniciarLoopCronometro() {
    if (appState.cronometro.intervalId) {
      clearInterval(appState.cronometro.intervalId);
    }

    appState.cronometro.intervalId = setInterval(() => {
      if (appState.cronometro.ativo) {
        appState.cronometro.segundos++;
        atualizarDisplayCronometro();
        if (appState.cronometro.segundos % 10 === 0) {
          salvarCronometroLocal();
        }
      }
    }, 1000);
  }

  function pausarOuRetomarCronometro() {
    if (!appState.cronometro.idTarefa) {
      mostrarToast('Selecione uma tarefa clicando em Play.', 'info');
      return;
    }

    appState.cronometro.ativo = !appState.cronometro.ativo;
    salvarCronometroLocal();

    const icon = document.getElementById('floating-pause-icon');
    if (icon) {
      icon.textContent = appState.cronometro.ativo ? 'pause' : 'play_arrow';
    }

    mostrarToast(appState.cronometro.ativo ? 'Cronômetro retomado!' : 'Cronômetro pausado.', 'info');
  }
  window.pausarOuRetomarCronometro = pausarOuRetomarCronometro;

  function salvarSessaoCronometro() {
    const c = appState.cronometro;
    if (!c.idTarefa || c.segundos <= 0) {
      mostrarToast('Nenhum tempo acumulado para salvar.', 'info');
      return;
    }

    const agora = new Date();
    const horaFim = agora.toTimeString().split(' ')[0];
    const dataExecucao = agora.toISOString().split('T')[0];
    const horaInicio = c.timestampInicio ? new Date(c.timestampInicio).toTimeString().split(' ')[0] : horaFim;

    mostrarToast('Gravando sessão em HISTORICO_TEMPO...', 'info');

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.sucesso) {
          mostrarToast('Sessão registrada com sucesso!', 'success');
          descartarCronometro(false);
          carregarDadosApp();
        } else {
          mostrarToast(res ? res.mensagem : 'Erro ao gravar sessão', 'error');
        }
      })
      .withFailureHandler(onErroServidor)
      .registrarSessaoTempo(c.idTarefa, dataExecucao, horaInicio, horaFim, c.segundos);
  }
  window.salvarSessaoCronometro = salvarSessaoCronometro;

  function descartarCronometro(comConfirmacao = true) {
    if (comConfirmacao && appState.cronometro.segundos > 0) {
      if (!confirm('Deseja realmente descartar a contagem desta sessão?')) {
        return;
      }
    }

    if (appState.cronometro.intervalId) {
      clearInterval(appState.cronometro.intervalId);
    }

    appState.cronometro.idTarefa = null;
    appState.cronometro.tituloTarefa = '';
    appState.cronometro.nomeProjeto = '';
    appState.cronometro.segundos = 0;
    appState.cronometro.ativo = false;
    appState.cronometro.intervalId = null;

    localStorage.removeItem('gp360_active_timer');
    atualizarDisplayCronometro();
  }
  window.descartarCronometro = descartarCronometro;

  function atualizarDisplayCronometro() {
    const elTitle = document.getElementById('floating-timer-title');
    const elProj = document.getElementById('floating-timer-project');
    const elDigits = document.getElementById('floating-timer-digits');
    const elIcon = document.getElementById('floating-pause-icon');

    const c = appState.cronometro;

    if (!c.idTarefa) {
      if (elTitle) elTitle.textContent = 'Nenhuma tarefa ativa';
      if (elProj) elProj.textContent = 'Clique em Play em qualquer tarefa';
      if (elDigits) elDigits.textContent = '00:00:00';
      if (elIcon) elIcon.textContent = 'play_arrow';
      return;
    }

    if (elTitle) elTitle.textContent = c.tituloTarefa || 'Tarefa em Foco';
    if (elProj) elProj.textContent = c.nomeProjeto || 'Sem Projeto';
    if (elDigits) elDigits.textContent = formatarSegundosParaHHMMSS(c.segundos);
    if (elIcon) elIcon.textContent = c.ativo ? 'pause' : 'play_arrow';
  }

  function salvarCronometroLocal() {
    const c = appState.cronometro;
    if (!c.idTarefa) {
      localStorage.removeItem('gp360_active_timer');
      return;
    }
    localStorage.setItem('gp360_active_timer', JSON.stringify({
      idTarefa: c.idTarefa,
      tituloTarefa: c.tituloTarefa,
      nomeProjeto: c.nomeProjeto,
      segundos: c.segundos,
      timestampInicio: c.timestampInicio,
      ativo: c.ativo,
      salvoEm: Date.now()
    }));
  }

  function restaurarCronometroLocal() {
    try {
      const salvo = localStorage.getItem('gp360_active_timer');
      if (!salvo) return;
      const d = JSON.parse(salvo);
      if (!d.idTarefa) return;

      const deltaSegundos = d.ativo ? Math.floor((Date.now() - d.salvoEm) / 1000) : 0;
      appState.cronometro.idTarefa = d.idTarefa;
      appState.cronometro.tituloTarefa = d.tituloTarefa;
      appState.cronometro.nomeProjeto = d.nomeProjeto;
      appState.cronometro.segundos = (d.segundos || 0) + deltaSegundos;
      appState.cronometro.timestampInicio = d.timestampInicio;
      appState.cronometro.ativo = d.ativo;

      iniciarLoopCronometro();
      atualizarDisplayCronometro();
    } catch (e) {
      console.warn('Erro ao restaurar cronômetro local:', e);
    }
  }

  function mostrarToast(mensagem, tipo = 'info') {
    const toast = document.getElementById('toastNotification');
    const msg = document.getElementById('toastMessage');
    const icon = document.getElementById('toastIcon');
    if (!toast || !msg) return;

    msg.textContent = mensagem;

    const icones = {
      'success': 'check_circle',
      'error': 'error',
      'info': 'info'
    };
    if (icon) icon.textContent = icones[tipo] || 'info';

    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 3800);
  }
  window.mostrarToast = mostrarToast;

  function formatarDataLocalISO(d) {
    if (!d || isNaN(d.getTime())) return '';
    const ano = d.getFullYear();
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
  }

  function normalizarDataISO(val) {
    if (!val) return '';
    const s = String(val).trim();
    if (s.length >= 10 && s.charAt(4) === '-' && s.charAt(7) === '-') {
      return s.substring(0, 10);
    }
    if (s.includes('/')) {
      const partes = s.split(' ')[0].split('/');
      if (partes.length === 3) {
        const dia = partes[0].padStart(2, '0');
        const mes = partes[1].padStart(2, '0');
        const ano = partes[2].length === 2 ? '20' + partes[2] : partes[2];
        return `${ano}-${mes}-${dia}`;
      }
    }
    return s;
  }

  function parseDataISOParaLocal(dataISO) {
    if (!dataISO) return new Date();
    const limpo = normalizarDataISO(dataISO);
    const partes = limpo.split('-');
    if (partes.length < 3) return new Date();
    return new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
  }

  function obterSegundaFeira(d) {
    const data = new Date(d);
    const dia = data.getDay();
    const diff = data.getDate() - dia + (dia === 0 ? -6 : 1);
    data.setDate(diff);
    return data;
  }

      appState.tarefas.forEach(t => {

      });
      renderizarVisaoAtiva();

    }
  }

  function formatarSegundosParaHHMMSS(totalSegs) {
    const s = Math.max(0, parseInt(totalSegs, 10) || 0);
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    const segs = s % 60;
    return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(segs).padStart(2, '0')}`;
  }

  function escapeHtml(texto) {
    if (!texto) return '';
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }
