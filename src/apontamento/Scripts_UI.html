<script>
  var appData = null;
  var activeFilter = { diretoria: 'TODAS', regional: 'TODAS', filial: 'TODAS', tipoOcorrencia: 'TODAS' };
  var searchDebounceTimer = null;

  window.addEventListener('DOMContentLoaded', function() {
    var searchInput = document.getElementById('tableSearch');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(function() {
          renderTable();
        }, 150);
      });
    }
    // Disparo único e otimizado no carregamento
    refreshData(false);
  });

  function switchTab(tab) {
    var vDash = document.getElementById('viewDashboard');
    var vCert = document.getElementById('viewCertificados');
    var vPed = document.getElementById('viewPedagogico');

    if (vDash) vDash.classList.add('hidden');
    if (vCert) vCert.classList.add('hidden');
    if (vPed) vPed.classList.add('hidden');

    var btnDash = document.getElementById('tabBtnDashboard');
    var btnCert = document.getElementById('tabBtnCertificados');
    var btnPed = document.getElementById('tabBtnPedagogico');

    var defaultBtnClass = 'px-3 py-1.5 rounded-lg text-white/90 hover:bg-white/10 flex items-center gap-1.5';

    if (btnDash) btnDash.className = defaultBtnClass;
    if (btnCert) btnCert.className = defaultBtnClass;
    if (btnPed) btnPed.className = defaultBtnClass;

    if (tab === 'dashboard') {
      if (vDash) vDash.classList.remove('hidden');
      if (btnDash) btnDash.className = 'px-3 py-1.5 rounded-lg bg-white text-[#0086ff] shadow-sm flex items-center gap-1.5';
    } else if (tab === 'certificados') {
      if (vCert) vCert.classList.remove('hidden');
      if (btnCert) btnCert.className = 'px-3 py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm flex items-center gap-1.5';
      renderCertificadosTable();
    } else if (tab === 'pedagogico') {
      if (vPed) vPed.classList.remove('hidden');
      if (btnPed) btnPed.className = 'px-3 py-1.5 rounded-lg bg-white text-purple-700 shadow-sm flex items-center gap-1.5';
      renderPedagogicoTab();
    }
  }

  function refreshData(force) {
    var iconRef = document.getElementById('refreshIcon');
    var iconSync = document.getElementById('iconSync');
    if (iconRef) iconRef.classList.add('animate-spin');
    if (iconSync) iconSync.classList.add('animate-spin');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(resRaw) {
          if (iconRef) iconRef.classList.remove('animate-spin');
          if (iconSync) iconSync.classList.remove('animate-spin');
          try {
            var data = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
            if (data && data.sucesso) {
              appData = data;
              initDashboard();
            }
          } catch(e) {
            console.error('Erro ao processar dados:', e);
          }
        })
        .withFailureHandler(function(err) {
          if (iconRef) iconRef.classList.remove('animate-spin');
          if (iconSync) iconSync.classList.remove('animate-spin');
          console.error('Erro ao buscar dados:', err);
        })
        .obterDadosAuditoria(!!force);
    }
  }

  function initDashboard() {
    if (!appData) return;
    populateFilterOptions();
    updateDashboard();
  }

  function populateFilterOptions() {
    var selDir = document.getElementById('selectDiretoria');
    var selTipo = document.getElementById('selectTipoOcorrencia');

    if (selDir && appData && appData.mapaHierarquia) {
      var opts = '<option value="TODAS">Todas as Diretorias</option>';
      var dirs = Object.keys(appData.mapaHierarquia).sort();
      dirs.forEach(function(d) {
        opts += '<option value="' + d + '">' + d + '</option>';
      });
      selDir.innerHTML = opts;
    }

    if (selTipo && appData && appData.apontamentosBrutos) {
      var tiposSet = {};
      appData.apontamentosBrutos.forEach(function(a) {
        if (a.tipoIrregularidade) tiposSet[a.tipoIrregularidade] = true;
      });
      var optsTipo = '<option value="TODAS">Todos os Tipos</option>';
      Object.keys(tiposSet).sort().forEach(function(t) {
        optsTipo += '<option value="' + t + '">' + t + '</option>';
      });
      selTipo.innerHTML = optsTipo;
    }

    onDiretoriaChange();
  }

  function onDiretoriaChange() {
    var selDir = document.getElementById('selectDiretoria');
    activeFilter.diretoria = selDir ? selDir.value : 'TODAS';
    activeFilter.regional = 'TODAS';
    activeFilter.filial = 'TODAS';

    var selReg = document.getElementById('selectRegional');
    var opts = '<option value="TODAS">Todas as Regionais</option>';

    if (appData && appData.mapaHierarquia) {
      var regSet = {};
      if (activeFilter.diretoria === 'TODAS') {
        Object.keys(appData.mapaHierarquia).forEach(function(d) {
          Object.keys(appData.mapaHierarquia[d]).forEach(function(r) { regSet[r] = true; });
        });
      } else if (appData.mapaHierarquia[activeFilter.diretoria]) {
        Object.keys(appData.mapaHierarquia[activeFilter.diretoria]).forEach(function(r) { regSet[r] = true; });
      }

      Object.keys(regSet).sort().forEach(function(r) {
        opts += '<option value="' + r + '">' + r + '</option>';
      });
    }
    if (selReg) selReg.innerHTML = opts;

    onRegionalChange();
  }

  function onRegionalChange() {
    var selReg = document.getElementById('selectRegional');
    activeFilter.regional = selReg ? selReg.value : 'TODAS';
    activeFilter.filial = 'TODAS';

    var selFil = document.getElementById('selectFilial');
    var opts = '<option value="TODAS">Todas as Filiais</option>';

    if (appData && appData.filiaisAlertas) {
      var filiais = appData.filiaisAlertas.filter(function(f) {
        var matchDir = activeFilter.diretoria === 'TODAS' || f.diretoria === activeFilter.diretoria;
        var matchReg = activeFilter.regional === 'TODAS' || f.regional === activeFilter.regional;
        return matchDir && matchReg;
      });

      // Ordena numericamente pelo número da filial (ID)
      filiais.sort(function(a, b) {
        var numA = parseInt(String(a.filial).replace(/\D/g, ''), 10) || 0;
        var numB = parseInt(String(b.filial).replace(/\D/g, ''), 10) || 0;
        return numA - numB;
      });

      filiais.forEach(function(f) {
        var label = f.filial + ' - ' + f.nomeLoja;
        opts += '<option value="' + f.filial + '">' + label + '</option>';
      });
    }
    if (selFil) selFil.innerHTML = opts;

    updateDashboard();
  }

  function onFilialChange() {
    var selFil = document.getElementById('selectFilial');
    activeFilter.filial = selFil ? selFil.value : 'TODAS';
    updateDashboard();
  }

  function onTipoOcorrenciaChange() {
    var selTipo = document.getElementById('selectTipoOcorrencia');
    activeFilter.tipoOcorrencia = selTipo ? selTipo.value : 'TODAS';
    updateDashboard();
  }

  function resetFilters() {
    var selDir = document.getElementById('selectDiretoria');
    var selTipo = document.getElementById('selectTipoOcorrencia');
    if (selDir) selDir.value = 'TODAS';
    if (selTipo) selTipo.value = 'TODAS';
    activeFilter.tipoOcorrencia = 'TODAS';
    onDiretoriaChange();
  }

  function getFilteredApontamentos() {
    if (!appData || !appData.apontamentosBrutos) return [];
    return appData.apontamentosBrutos.filter(function(a) {
      var matchDir = activeFilter.diretoria === 'TODAS' || a.diretoria === activeFilter.diretoria;
      var matchReg = activeFilter.regional === 'TODAS' || a.regional === activeFilter.regional;
      var matchFil = activeFilter.filial === 'TODAS' || a.filialId === activeFilter.filial;
      var matchTipo = activeFilter.tipoOcorrencia === 'TODAS' || a.tipoIrregularidade === activeFilter.tipoOcorrencia;
      return matchDir && matchReg && matchFil && matchTipo;
    });
  }

  function updateDashboard() {
    var items = getFilteredApontamentos();
    var colabs = {};
    var totalApont = 0;
    var lojas = {};

    items.forEach(function(it) {
      if (it.nome) colabs[it.nome] = true;
      totalApont += (it.quantidadeMes || 1);
      if (it.filialId) lojas[it.filialId] = true;
    });

    var kpiColab = document.getElementById('kpiColabDistintos');
    var kpiTotal = document.getElementById('kpiTotalApontamentos');
    var kpiLojas = document.getElementById('kpiLojasAfetadas');
    var kpiCerts = document.getElementById('kpiCertificadosQtd');

    if (kpiColab) kpiColab.innerText = Object.keys(colabs).length;
    if (kpiTotal) kpiTotal.innerText = totalApont;
    if (kpiLojas) kpiLojas.innerText = Object.keys(lojas).length;
    if (kpiCerts) kpiCerts.innerText = appData && appData.certificados ? appData.certificados.length : 0;

    renderFiliaisTable();
    renderDynamicRanking();
    renderTable();
  }

  function renderFiliaisTable() {
    var tbody = document.getElementById('filiaisTableBody');
    var badge = document.getElementById('badgeTotalFiliaisAfetadas');
    if (!tbody) return;

    var items = getFilteredApontamentos();
    var mapFiliais = {};

    items.forEach(function(it) {
      var fid = it.filialId || '0';
      if (!mapFiliais[fid]) {
        mapFiliais[fid] = {
          filialId: fid,
          filialNome: it.filialNome || ('Filial ' + fid),
          regional: it.regional || 'Regional SP Interior',
          diretoria: it.diretoria || 'Diretoria Lojas Sul/Sudeste',
          colabsMap: {},
          totalApontamentos: 0
        };
      }
      if (it.nome) mapFiliais[fid].colabsMap[it.nome] = true;
      mapFiliais[fid].totalApontamentos += (it.quantidadeMes || 1);
    });

    var keys = Object.keys(mapFiliais).sort(function(a, b) {
      return mapFiliais[b].totalApontamentos - mapFiliais[a].totalApontamentos;
    });

    if (badge) badge.innerText = keys.length + ' Filiais em Alerta';

    if (keys.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold">Nenhuma filial com inconsistência encontrada para o filtro atual.</td></tr>';
      return;
    }

    var certs = (appData && appData.certificados) ? appData.certificados : [];
    var certsPerFilial = {};
    certs.forEach(function(c) {
      var fid = c.filialId;
      certsPerFilial[fid] = (certsPerFilial[fid] || 0) + 1;
    });

    var htmlBuf = [];
    keys.forEach(function(fid) {
      var f = mapFiliais[fid];
      var totalColabs = Object.keys(f.colabsMap).length;
      var certsEnviados = certsPerFilial[fid] || 0;

      htmlBuf.push(
        '<tr class="hover:bg-slate-50/80 transition-colors">' +
          '<td class="p-3 pl-5 font-bold text-slate-900">' + f.filialNome + ' <span class="text-[10px] text-slate-400 font-normal">(ID: ' + f.filialId + ')</span></td>' +
          '<td class="p-3 text-slate-600 font-medium">' + f.regional + '<br><span class="text-[10px] text-slate-400">' + f.diretoria + '</span></td>' +
          '<td class="p-3 text-center font-bold text-red-600">' + totalColabs + ' colaboradores</td>' +
          '<td class="p-3 text-center font-black text-slate-800">' + f.totalApontamentos + '</td>' +
          '<td class="p-3 text-center font-medium"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + (certsEnviados >= totalColabs ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700') + '">' + certsEnviados + ' de ' + totalColabs + ' entregues</span></td>' +
          '<td class="p-3 pr-5 text-right">' +
            '<div class="flex items-center justify-end gap-1.5">' +
              '<button onclick="sendOfficialEmailAction(\'' + f.filialId + '\')" class="px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white font-bold inline-flex items-center gap-1 transition-all" title="Notificar por E-mail"><i class="bi bi-envelope-fill"></i> <span>E-mail</span></button>' +
              '<button onclick="openWhatsAppModal(\'' + f.filialId + '\')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white font-bold inline-flex items-center gap-1 transition-all" title="Enviar via WhatsApp"><i class="bi bi-whatsapp"></i> <span>WhatsApp</span></button>' +
            '</div>' +
          '</td>' +
        '</tr>'
      );
    });

    tbody.innerHTML = htmlBuf.join('');
  }

  function renderDynamicRanking() {
    var list = document.getElementById('rankingList');
    if (!list) return;

    var items = getFilteredApontamentos();
    var countMap = {};
    items.forEach(function(i) {
      var reg = i.regional || 'OUTRAS';
      countMap[reg] = (countMap[reg] || 0) + (i.quantidadeMes || 1);
    });

    var keys = Object.keys(countMap).sort(function(a,b){ return countMap[b] - countMap[a]; });
    var maxVal = keys.length > 0 ? countMap[keys[0]] : 1;
    var html = '';

    keys.slice(0, 5).forEach(function(r) {
      var cnt = countMap[r];
      var pct = Math.min(100, Math.round((cnt / maxVal) * 100));
      html += '<div class="space-y-1">' +
        '<div class="flex justify-between text-xs font-semibold">' +
          '<span class="text-slate-700">' + r + '</span>' +
          '<span class="text-red-600 font-bold">' + cnt + ' apontamentos</span>' +
        '</div>' +
        '<div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">' +
          '<div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full" style="width: ' + pct + '%"></div>' +
        '</div>' +
      '</div>';
    });

    list.innerHTML = html || '<p class="text-xs text-slate-400">Nenhum dado encontrado.</p>';
  }

  function renderTable() {
    var tbody = document.getElementById('tableBody');
    if (!tbody) return;

    var searchEl = document.getElementById('tableSearch');
    var q = searchEl ? searchEl.value.toLowerCase().trim() : '';
    var rawItems = getFilteredApontamentos();

    var items = rawItems.filter(function(it) {
      return !q || 
        (it.nome && it.nome.toLowerCase().indexOf(q) !== -1) || 
        (it.filialNome && it.filialNome.toLowerCase().indexOf(q) !== -1) ||
        (it.filialId && String(it.filialId).toLowerCase().indexOf(q) !== -1) ||
        (it.chapa && String(it.chapa).toLowerCase().indexOf(q) !== -1);
    });

    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400 text-xs font-bold">Nenhum apontamento encontrado com o filtro atual.</td></tr>';
      return;
    }

    var htmlBuf = [];
    items.forEach(function(item) {
      htmlBuf.push(
        '<tr class="hover:bg-slate-50/80 transition-colors">' +
          '<td class="p-3 pl-5 font-bold text-slate-800">' + item.filialNome + '</td>' +
          '<td class="p-3"><div class="font-bold text-slate-900">' + item.nome + '</div><div class="text-[10px] text-slate-400">Chapa: ' + (item.chapa || '-') + ' • ' + (item.cargo || 'Vendedor') + '</div></td>' +
          '<td class="p-3"><span class="px-2.5 py-1 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-100">' + item.tipoIrregularidade + '</span></td>' +
          '<td class="p-3 text-center font-black text-slate-800">' + (item.quantidadeMes || 1) + '</td>' +
            '<div class="flex items-center justify-end gap-1.5">' +
              '<button onclick="sendOfficialEmailAction(\'' + item.filialId + '\')" class="px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white font-bold flex items-center gap-1 transition-all" title="Enviar Notificação por E-mail"><i class="bi bi-envelope-fill"></i> <span>E-mail</span></button>' +
              '<button onclick="openWhatsAppModal(\'' + item.filialId + '\')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white font-bold flex items-center gap-1 transition-all" title="Enviar Notificação via WhatsApp"><i class="bi bi-whatsapp"></i> <span>WhatsApp</span></button>' +
            '</div>' +
        '</tr>'
      );
    });
    tbody.innerHTML = htmlBuf.join('');
  }

  function renderCertificadosTable() {
    var tbody = document.getElementById('certificadosTableBody');
    var badge = document.getElementById('certificadosCountBadge');
    if (!tbody || !appData) return;

    var certs = appData.certificados || [];
    if (badge) badge.innerText = certs.length + ' registros';

    if (certs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold">Nenhum certificado registrado ainda.</td></tr>';
      return;
    }

    var htmlBuf = [];
    certs.forEach(function(c) {
      htmlBuf.push(
        '<tr class="hover:bg-slate-50/80">' +
          '<td class="p-3 pl-5 text-slate-500 font-medium">' + c.dataEnvio + '</td>' +
          '<td class="p-3 font-bold text-slate-900">' + c.filialNome + '</td>' +
          '<td class="p-3"><div class="font-bold text-slate-800">' + c.colaboradorNome + '</div><div class="text-[10px] text-slate-400">Chapa: ' + c.chapa + '</div></td>' +
          '<td class="p-3 text-slate-700 font-medium">' + (c.tipoTreinamento || c.cursoNome || 'Treinamento de Ponto') + '</td>' +
          '<td class="p-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"><i class="bi bi-check-circle-fill"></i> ' + (c.status || 'Aprovado') + '</span></td>' +
          '<td class="p-3 pr-5 text-right"><a href="' + (c.linkComprovante || '#') + '" target="_blank" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-[#0086ff] text-slate-700 hover:text-white font-bold inline-flex items-center gap-1 transition-colors"><i class="bi bi-box-arrow-up-right"></i> Ver Link</a></td>' +
        '</tr>'
      );
    });
    tbody.innerHTML = htmlBuf.join('');
  }

  function renderPedagogicoTab() {
    var container = document.getElementById('pedagogicoCardsContainer');
    if (!container || !appData || !appData.filiaisAlertas) return;

    var htmlBuf = [];
    appData.filiaisAlertas.slice(0, 6).forEach(function(loja) {
      htmlBuf.push(
        '<div class="bg-white p-5 rounded-2xl border border-slate-100 card-shadow space-y-3">' +
          '<div class="flex justify-between items-start">' +
            '<div>' +
              '<h4 class="font-bold text-slate-900">' + loja.nomeLoja + '</h4>' +
              '<p class="text-xs text-slate-400">' + loja.regional + ' • ' + loja.cidade + '/' + loja.estado + '</p>' +
            '</div>' +
            '<span class="text-xs font-bold text-purple-700 bg-purple-50 px-2.5 py-1 rounded-full border border-purple-100">Magalu GP</span>' +
          '</div>' +
          '<p class="text-xs text-slate-600 leading-relaxed">Gerente: <span class="font-bold text-slate-800">' + loja.gerenteEmail + '</span></p>' +
        '</div>'
      );
    });
    container.innerHTML = htmlBuf.join('');
  }

  function openModal(id) {
    var m = document.getElementById(id);
    if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
  }

  function closeModal(id) {
    var m = document.getElementById(id);
    if (m) { m.classList.remove('flex'); m.classList.add('hidden'); }
  }

  function openCertificateModal() {
    var sel = document.getElementById('certFilialSelect');
    if (sel && appData && appData.filiaisAlertas) {
      var opts = '';
      appData.filiaisAlertas.forEach(function(l) {
        opts += '<option value="' + l.filial + '">' + l.nomeLoja + '</option>';
      });
      sel.innerHTML = opts;
    }
    openModal('modalCertificado');
  }

  function submitCertificateForm(e) {
    e.preventDefault();
    var fid = document.getElementById('certFilialSelect').value;
    var loja = (appData.filiaisAlertas || []).find(function(l){ return l.filial === fid; }) || { nomeLoja: 'Filial ' + fid };

    var payload = {
      filialId: fid,
      filialNome: loja.nomeLoja,
      colaboradorNome: document.getElementById('certColaborador').value,
      chapa: document.getElementById('certChapa').value,
      cargo: document.getElementById('certCargo').value,
      tipoTreinamento: document.getElementById('certCurso').value,
      linkComprovante: document.getElementById('certLink').value,
      observacoes: document.getElementById('certObs').value,
      status: 'Aprovado',
      registradoPor: (appData.perfil ? appData.perfil.nome : 'Gestor GP')
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          alert(res.message || 'Certificado salvo na planilha!');
          closeModal('modalCertificado');
          refreshData(true);
        })
        .saveCertificadoTreinamento(payload);
    }
  }

  function sendOfficialEmailAction(filialId) {
    if (confirm('Deseja enviar a notificação oficial para o gerente da filial ' + filialId + '?')) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message || 'E-mail enviado!');
          })
          .sendEmailFilial(filialId, 'Disparo via Dashboard de Auditoria GP360');
      }
    }
  }

  function openEmailAction(filialId) {
    sendOfficialEmailAction(filialId);
  }

  function triggerRegionalEmail() {
    var reg = activeFilter.regional;
    var msg = reg === 'TODAS' 
      ? 'Confirmar disparo de relatórios em massa para TODAS as regionais?' 
      : 'Confirmar disparo de relatórios em massa para os gerentes da ' + reg + '?';

    if (confirm(msg)) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) { alert(res.message || 'E-mails enviados com sucesso!'); })
          .withFailureHandler(function(err) { alert('Erro no disparo: ' + err); })
          .sendEmailRegional(reg);
      }
    }
  }

  var currentWaFilialId = '';

  function openWhatsAppModal(filialId) {
    currentWaFilialId = filialId;
    var fNorm = (typeof normalizarFilialId === 'function') ? normalizarFilialId(filialId) : String(filialId);
    var loja = (appData && appData.filiaisAlertas) 
      ? appData.filiaisAlertas.find(function(l) { return String(l.filial) === String(filialId) || String(l.filial) === fNorm; }) 
      : null;

    var nomeLoja = loja ? loja.nomeLoja : ('Filial ' + filialId);

    var elFilial = document.getElementById('waFilialNome');
    if (elFilial) elFilial.value = nomeLoja + ' (Filial ' + filialId + ')';

    // Buscar os apontamentos/colaboradores desta filial específica
    var apontamentosFilial = (appData && appData.apontamentosBrutos) 
      ? appData.apontamentosBrutos.filter(function(a) { 
          return String(a.filialId) === String(filialId) || String(a.filialId) === fNorm; 
        })
      : [];

    // Agrupar por colaborador para listar sem duplicar
    var mapaColabMsg = {};
    apontamentosFilial.forEach(function(a) {
      var key = a.chapa || a.nome;
      if (!mapaColabMsg[key]) {
        mapaColabMsg[key] = {
          nome: a.nome,
          chapa: a.chapa,
          cargo: a.cargo,
          tiposMap: {},
          totalCount: 0
        };
      }
      var t = a.tipoIrregularidade || 'Apontamento em Aberto';
      mapaColabMsg[key].tiposMap[t] = (mapaColabMsg[key].tiposMap[t] || 0) + 1;
      mapaColabMsg[key].totalCount += (a.quantidadeMes || 1);
    });

    var colabsListaText = '';
    var colabsKeys = Object.keys(mapaColabMsg);

    if (colabsKeys.length > 0) {
      colabsListaText = "\n📋 *Colaboradores Notificados e Inconsistências:*\n";
      colabsKeys.forEach(function(k) {
        var c = mapaColabMsg[k];
        var resumoTipos = Object.keys(c.tiposMap).map(function(t) {
          var q = c.tiposMap[t];
          return q > 1 ? (t + ' [' + q + 'x]') : t;
        }).join(', ');

        colabsListaText += "• *" + c.nome + "* (Chapa: " + (c.chapa || '-') + ") - " + resumoTipos + "\n";
      });
    }

    var linkCurso = 'https://universidadeluiza.com.br/app/home/canal/magalu?section=csc-conte-sempre-comigo&trail=ponto-eletronico-o-guia-essencial-do-colaborador';
    var baseUrl = (window.location.href || '').split('?')[0];
    var linkPortal = baseUrl + '?mode=certificado&filialId=' + filialId;

    var previewMsg = "Olá, Gerente!\n\n" +
      "Identificamos apontamentos de jornada na sua filial (*" + nomeLoja + "*).\n" +
      colabsListaText + "\n" +
      "🎓 *1. Treinamento Obrigatório dos Colaboradores:*\n" +
      "Encaminhe o link do treinamento para os colaboradores afetados realizarem na Universidade Luiza:\n" +
      linkCurso + "\n\n" +
      "📎 *2. Envio dos Certificados pelo Gerente:*\n" +
      "Após a conclusão, acesse o link abaixo para incluir os comprovantes:\n" +
      linkPortal + "\n\n" +
      "📧 *Nota:* Por favor, verifique também o e-mail oficial enviado para o gerente com os detalhes completos do acompanhamento.";

    var elPreview = document.getElementById('waPreviewText');
    if (elPreview) elPreview.value = previewMsg;

    openModal('modalWhatsApp');
  }

  function dispararWhatsAppWeb() {
    var phoneInput = document.getElementById('whatsappPhone');
    var rawPhone = phoneInput ? phoneInput.value.trim() : '';

    var digits = rawPhone.replace(/\D/g, '');
    if (!digits) {
      alert('Por favor, informe o número de telefone do gerente com DDD no campo de texto.');
      return;
    }

    if (digits.length <= 11 && !digits.startsWith('55')) {
      digits = '55' + digits;
    }

    var text = document.getElementById('waPreviewText').value;
    var waUrl = 'https://api.whatsapp.com/send?phone=' + digits + '&text=' + encodeURIComponent(text);

    window.open(waUrl, '_blank');
    closeModal('modalWhatsApp');
  }
</script>
