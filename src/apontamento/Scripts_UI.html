<script>
  // Estado Global da Aplicação
  var ESTADO_AUDITORIA = {
    dadosBrutos: null,
    exibirTodasFiliais: false
  };

  window.addEventListener('DOMContentLoaded', function() {
    recarregarDados();
  });

  function recarregarDados() {
    if (google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(renderizarDados)
        .withFailureHandler(tratarErro)
        .obterDadosAuditoria();
    }
  }

  function renderizarDados(jsonResposta) {
    try {
      var res = typeof jsonResposta === 'string' ? JSON.parse(jsonResposta) : jsonResposta;
      if (!res.sucesso) {
        alert("Erro ao carregar dados: " + res.erro);
        return;
      }

      ESTADO_AUDITORIA.dadosBrutos = res;

      // Renderiza KPIs
      document.getElementById('kpi-colaboradores').innerText = res.kpis.colaboradoresIrregulares || 0;
      document.getElementById('kpi-apontamentos').innerText = res.kpis.apontamentosCriticos || 0;

      if (res.perfil && res.perfil.nome) {
        document.getElementById('user-badge').setAttribute('title', res.perfil.nome + ' (' + res.perfil.email + ')');
      }

      // Popula Selects de Filtros
      popularFiltro('filtro-diretoria', res.filtros.diretorias, 'Diretoria: Todas');
      popularFiltro('filtro-regional', res.filtros.regionais, 'Regional: Todas');
      popularFiltro('filtro-filial', res.filtros.filiais, 'Filial: Todas');

      // Renderiza Top Regionais e Tabela de Filiais
      renderizarTopRegionais(res.topRegionais);
      renderizarTabelaFiliais();

    } catch(e) {
      console.error("Erro no parse do JSON", e);
    }
  }

  function popularFiltro(idElemento, lista, textoPadrao) {
    var select = document.getElementById(idElemento);
    var valAtual = select.value;
    select.innerHTML = '<option value="TODAS">' + textoPadrao + '</option>';
    lista.forEach(function(item) {
      var opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      select.appendChild(opt);
    });
    if (lista.includes(valAtual)) select.value = valAtual;
  }

  function aplicarFiltros() {
    renderizarTabelaFiliais();
  }

  function renderizarTopRegionais(regionais) {
    var container = document.getElementById('container-top-regionais');
    if (!regionais || regionais.length === 0) {
      container.innerHTML = '<p class="text-body-sm text-on-surface-variant">Nenhum risco regional identificado.</p>';
      return;
    }

    var maxQtd = regionais[0].quantidade || 1;
    var html = '';

    regionais.forEach(function(r, idx) {
      var perc = Math.min(100, Math.round((r.quantidade / maxQtd) * 100));
      var corClass = idx === 0 ? 'text-error bg-error' : (idx === 1 ? 'text-tertiary bg-tertiary' : 'text-primary bg-primary');
      
      html += '<div class="flex flex-col gap-2">' +
                '<div class="flex justify-between text-body-sm text-on-surface">' +
                  '<span class="font-medium">' + r.regional + '</span>' +
                  '<span class="font-bold ' + corClass.split(' ')[0] + '">' + r.quantidade + ' Ocorrências</span>' +
                '</div>' +
                '<div class="w-full h-2 rounded-full bg-surface-variant overflow-hidden">' +
                  '<div class="h-full ' + corClass.split(' ')[1] + ' rounded-full" style="width: ' + perc + '%"></div>' +
                '</div>' +
              '</div>';
    });

    container.innerHTML = html;
  }

  function renderizarTabelaFiliais() {
    var res = ESTADO_AUDITORIA.dadosBrutos;
    if (!res) return;

    var dirSel = document.getElementById('filtro-diretoria').value;
    var regSel = document.getElementById('filtro-regional').value;
    var filSel = document.getElementById('filtro-filial').value;

    var filtradas = res.filiaisAlertas.filter(function(f) {
      if (dirSel !== 'TODAS' && f.diretoria !== dirSel) return false;
      if (regSel !== 'TODAS' && f.regional !== regSel) return false;
      if (filSel !== 'TODAS' && f.filial !== filSel) return false;
      return true;
    });

    document.getElementById('tag-qtd-filiais').innerText = filtradas.length + ' Filiais';

    var container = document.getElementById('container-filiais');
    if (filtradas.length === 0) {
      container.innerHTML = '<p class="p-4 text-body-sm text-on-surface-variant">Nenhuma filial encontrada para os filtros selecionados.</p>';
      return;
    }

    var limite = ESTADO_AUDITORIA.exibirTodasFiliais ? filtradas.length : 3;
    var exibicao = filtradas.slice(0, limite);
    var html = '';

    exibicao.forEach(function(f, idx) {
      var corBorda = f.risco === 'Alto Risco' ? 'bg-error' : (f.risco === 'Médio Risco' ? 'bg-tertiary' : 'bg-primary');
      var badgeStyle = f.risco === 'Alto Risco' 
        ? 'text-error bg-error-container' 
        : (f.risco === 'Médio Risco' ? 'text-tertiary bg-tertiary-container' : 'text-primary bg-surface-container-high');

      html += '<div class="flex items-center justify-between p-4 bg-surface-container-lowest hover:bg-surface-container transition-colors relative group cursor-pointer">' +
                '<div class="absolute left-0 top-0 bottom-0 w-1 ' + corBorda + '"></div>' +
                '<div class="flex flex-col ml-2">' +
                  '<span class="text-body-md font-medium text-on-surface">' + f.nomeLoja + '</span>' +
                  '<span class="text-body-sm text-on-surface-variant">' + f.regional + '</span>' +
                '</div>' +
                '<div class="flex flex-col items-end">' +
                  '<span class="text-label-md font-bold ' + badgeStyle + ' px-2 py-1 rounded-md">' + f.risco + '</span>' +
                  '<span class="text-body-sm text-on-surface-variant mt-1">' + f.totalApontamentos + ' Apont.</span>' +
                '</div>' +
              '</div>';

      if (idx < exibicao.length - 1) {
        html += '<div class="h-[1px] w-full bg-surface-variant"></div>';
      }
    });

    container.innerHTML = html;
  }

  function alternarExibicaoFiliais() {
    ESTADO_AUDITORIA.exibirTodasFiliais = !ESTADO_AUDITORIA.exibirTodasFiliais;
    var btn = document.getElementById('btn-ver-todas');
    btn.querySelector('span').innerText = ESTADO_AUDITORIA.exibirTodasFiliais ? 'Recolher filiais' : 'Ver todas as filiais';
    renderizarTabelaFiliais();
  }

  function executarNotificacao(btn) {
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Notificando...';
    setTimeout(function() {
      btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Notificados com sucesso!';
      btn.classList.remove('from-[#0086ff]', 'to-[#a033ff]');
      btn.classList.add('bg-primary');
    }, 1500);
  }

  function tratarErro(err) {
    console.error("Erro na chamada backend", err);
  }
</script>
