  <script>
    function submitFormGerente(e) {
      e.preventDefault();
      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i> Salvando...';

      var payload = {
        filialId: document.getElementById('gFilial').value,
        filialNome: 'Filial ' + document.getElementById('gFilial').value,
        chapa: document.getElementById('gChapa').value,
        colaboradorNome: document.getElementById('gNome').value,
        cargo: document.getElementById('gCargo').value,
        tipoTreinamento: document.getElementById('gCurso').value,
        linkComprovante: document.getElementById('gLink').value,
        observacoes: document.getElementById('gObs').value,
        status: 'Aprovado',
        registradoPor: 'Gerente de Loja (Portal Exclusivo)'
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message || 'Comprovante salvo com sucesso!');
            window.close();
          })
          .withFailureHandler(function(err) {
            alert('Erro ao salvar: ' + err);
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send-fill"></i> Enviar Certificado';
          })
          .saveCertificadoTreinamento(payload);
      } else {
        alert('Simulação: Certificado do colaborador ' + payload.chapa + ' salvo na planilha!');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill"></i> Enviar Certificado';
      }
    }
  </script>
