<style>
  :root { 
    --main-color: #0086ff; 
    --main-hover: #0073ea;
    --main-dark: #005bb1;
    --main-light: #eaf3ff;
    --bg-color: #F8FAFC; 
    --card-bg: #FFFFFF; 
    --border-color: #E2E8F0;
    --text-color: #0F172A; 
    --text-muted: #64748B;
    --accent-blue: #0086ff;
    --accent-green: #00a650;
    --accent-amber: #f59e0b;
    --accent-yellow: #ffc700;
    --accent-rose: #f43f5e;
  }
  
  body { 
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    background-color: var(--bg-color); 
    color: var(--text-color); 
    margin: 0; 
    display: flex; 
    height: 100vh; 
    overflow: hidden; 
  }

  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .material-symbols-fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

  /* Magalu Donut Chart */
  .magalu-donut {
    background: conic-gradient(
      #0086ff 0% 45%,
      #38bdf8 45% 75%,
      #ffc700 75% 90%,
      #e2e8f0 90% 100%
    );
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease;
  }
  .magalu-donut-hole {
    background-color: #ffffff;
    border-radius: 50%;
    width: 72%;
    height: 72%;
  }

  /* Bento Cards */
  .bento-card {
    background-color: #ffffff;
    border: 1px solid #E2E8F0;
    border-radius: 1rem;
    box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
    transition: all 0.2s ease-in-out;
  }
  .bento-card:hover {
    box-shadow: 0 10px 25px -4px rgba(0, 134, 255, 0.08);
    border-color: #cbd5e1;
  }

  /* Sidebar */
  .sidebar { 
    width: 280px; 
    background: white; 
    border-right: 1px solid #e2e8f0; 
    display: flex; 
    flex-direction: column; 
    transition: all 0.3s ease; 
    z-index: 50; 
  }
  .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .nav-item { 
    display: flex; 
    align-items: center; 
    padding: 10px 16px; 
    color: #64748b; 
    text-decoration: none; 
    font-weight: 600; 
    transition: all 0.2s; 
    cursor: pointer; 
    border-radius: 0.75rem; 
    margin-bottom: 4px;
    font-size: 14px;
  }
  .nav-item i, .nav-item .material-symbols-outlined { 
    width: 24px; 
    text-align: center; 
    margin-right: 12px; 
    font-size: 18px; 
    transition: color 0.2s;
  }
  .nav-item:hover { 
    background-color: #eaf3ff; 
    color: var(--main-color); 
  }
  .nav-item.active { 
    background-color: var(--main-color); 
    color: #ffffff !important; 
    box-shadow: 0 4px 12px rgba(0, 134, 255, 0.25); 
    font-weight: 700;
  }
  .nav-item.active i, .nav-item.active .material-symbols-outlined {
    color: #ffffff !important;
  }

  /* Layout principal */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .topbar { 
    background: white; 
    height: 64px; 
    display: flex; 
    align-items: center; 
    padding: 0 24px; 
    justify-content: space-between; 
    border-bottom: 1px solid #e2e8f0; 
  }
  .menu-toggle { font-size: 22px; cursor: pointer; color: #64748b; display: none; }
  .content-area { flex: 1; padding: 24px; overflow-y: auto; }

  /* Cards e Grids */
  .card { 
    background: var(--card-bg); 
    border-radius: 1rem; 
    padding: 20px; 
    box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04); 
    border: 1px solid #e2e8f0; 
    margin-bottom: 20px; 
    transition: all 0.2s ease-in-out;
  }
  .card:hover {
    box-shadow: 0 8px 24px -4px rgba(0, 134, 255, 0.08);
  }

  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
  
  .indicadores-mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
  .ind-card { 
    background: white; 
    padding: 14px 8px; 
    border-radius: 0.75rem; 
    text-align: center; 
    border: 1px solid #e2e8f0; 
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.03); 
    transition: transform 0.2s;
    overflow: hidden;
  }
  .ind-card:hover { transform: translateY(-2px); border-color: #cbd5e1; }
  .ind-card h5 { margin: 0 0 5px 0; color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ind-card .valor { 
    font-size: 16px; 
    font-weight: 800; 
    color: var(--text-color); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    max-width: 100%; 
    display: block; 
  }
  .loading-ind { text-align: center; font-size: 12px; color: #64748b; padding: 10px; font-style: italic; }

  /* Formulários */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 13px; }
  .form-control { 
    width: 100%; 
    padding: 10px 14px; 
    border: 1px solid #cbd5e1; 
    border-radius: 0.75rem; 
    outline: none; 
    transition: all 0.2s; 
    box-sizing: border-box; 
    font-size: 14px; 
    background: white;
    font-family: inherit;
  }
  .form-control:focus { 
    border-color: var(--main-color); 
    box-shadow: 0 0 0 3px rgba(0, 134, 255, 0.15); 
  }

  /* Zona de Drop / Paste */
  .paste-zone { 
    border: 2px dashed #cbd5e1; 
    padding: 18px; 
    text-align: center; 
    border-radius: 0.75rem; 
    background: #f8fafc; 
    color: #64748b; 
    cursor: pointer; 
    outline: none; 
    transition: all 0.2s ease-in-out; 
    font-size: 13px; 
    user-select: none; 
  }
  .paste-zone:focus, .paste-zone:hover { 
    border-color: var(--main-color); 
    background: var(--main-light); 
    color: var(--main-color); 
    box-shadow: 0 0 0 3px rgba(0, 134, 255, 0.15); 
  }

  /* Botões e Pílulas */
  .pill-btn { 
    display: inline-block; 
    padding: 6px 14px; 
    background: white; 
    border: 1px solid #cbd5e1; 
    border-radius: 9999px; 
    cursor: pointer; 
    font-size: 12px; 
    font-weight: 600; 
    color: #475569; 
    transition: all 0.2s; 
    user-select: none; 
  }
  .pill-btn:hover { background-color: #f1f5f9; border-color: #94a3b8; }
  .chk-abrangencia:checked + .pill-btn, .chk-tema:checked + .pill-btn { 
    background-color: var(--main-color); 
    color: white; 
    border-color: var(--main-dark); 
  }
  .check-label input { display: none; }

  .filter-pill-active { 
    background-color: var(--main-color) !important; 
    color: white !important; 
    border-color: var(--main-dark) !important; 
    box-shadow: 0 2px 8px rgba(0, 134, 255, 0.25) !important; 
  }

  .btn-primary { 
    background-color: var(--main-color); 
    color: white; 
    border: none; 
    padding: 11px 20px; 
    border-radius: 0.75rem; 
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.2s; 
    width: 100%; 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 4px 12px rgba(0, 134, 255, 0.2); 
    font-family: inherit;
  }
  .btn-primary:hover { 
    background-color: var(--main-hover); 
    box-shadow: 0 6px 18px rgba(0, 134, 255, 0.3); 
  }
  .btn-secondary { 
    background-color: #f8fafc; 
    color: #334155; 
    border: 1px solid #cbd5e1; 
    padding: 9px 16px; 
    border-radius: 0.75rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.2s; 
    font-family: inherit;
  }
  .btn-secondary:hover { 
    background-color: #f1f5f9; 
    border-color: #94a3b8; 
  }
  .btn-danger { 
    background-color: var(--accent-rose); 
    color: white; 
    border: none; 
    padding: 9px 16px; 
    border-radius: 0.75rem; 
    font-weight: 700; 
    cursor: pointer; 
    transition: all 0.2s; 
    font-family: inherit;
  }
  .btn-danger:hover { background-color: #be123c; }

  /* Listas e Linha do Tempo */
  .history-list { list-style: none; padding: 0; margin: 0; }
  .history-item { 
    background: white; 
    padding: 16px; 
    border-radius: 0.875rem; 
    margin-bottom: 12px; 
    border-left: 4px solid var(--main-color); 
    border: 1px solid #e2e8f0; 
    border-left-width: 4px; 
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); 
    position: relative;
    transition: all 0.2s;
  }
  .history-item:hover { box-shadow: 0 6px 15px rgba(0, 134, 255, 0.06); border-color: #cbd5e1; }
  .history-date { font-size: 12px; color: #64748b; margin-bottom: 5px; font-weight: 500; }
  .history-title { font-weight: 700; color: #1e293b; font-size: 15px;}
  .history-desc { font-size: 13px; color: #475569; margin-top: 5px;}
  .delete-btn { position: absolute; right: 15px; top: 15px; color: var(--accent-rose); cursor: pointer; font-size: 16px; padding: 4px; transition: transform 0.2s;}
  .delete-btn:hover { transform: scale(1.15); }
  .lock-btn { position: absolute; right: 15px; top: 15px; color: #cbd5e1; cursor: not-allowed; font-size: 16px; padding: 4px;}

  /* Mural de Avisos */
  .mural-avisos { 
    background: #fffbeb; 
    border-left: 4px solid #f59e0b; 
    padding: 16px; 
    border-radius: 1rem; 
    margin-bottom: 20px; 
    border: 1px solid #fef08a; 
    border-left-width: 4px;
  }
  .aviso-item { border-bottom: 1px dashed #fcd34d; padding-bottom: 10px; margin-bottom: 10px; position: relative; }
  .aviso-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .aviso-meta { font-size: 11px; color: #b45309; margin-bottom: 3px; font-weight: 700; }
  .btn-del-aviso { position: absolute; right: 0; top: 0; color: #f43f5e; cursor: pointer; font-size: 14px; }

  /* Modais e Overlays */
  .loading-overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(255, 255, 255, 0.95); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    z-index: 9999; 
  }
  .spinner { 
    border: 4px solid var(--main-light); 
    border-top: 4px solid var(--main-color); 
    border-radius: 50%; 
    width: 44px; 
    height: 44px; 
    animation: spin 0.8s linear infinite; 
    margin-bottom: 15px; 
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .toast { 
    position: fixed; 
    bottom: 24px; 
    right: 24px; 
    background: #0f172a; 
    color: white; 
    padding: 14px 22px; 
    border-radius: 0.875rem; 
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18); 
    transform: translateY(100px); 
    opacity: 0; 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
    z-index: 1000; 
    font-size: 13px;
    font-weight: 600;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .modal-overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(15, 23, 42, 0.6); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 1000; 
    backdrop-filter: blur(4px); 
  }
  .modal-content { 
    background: white; 
    padding: 28px; 
    border-radius: 1.25rem; 
    width: 90%; 
    max-width: 440px; 
    box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.15); 
    border: 1px solid #e2e8f0;
  }

  .blocked-screen { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background-color: #9f1239; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    z-index: 10000; 
    color: white; 
    text-align: center; 
    padding: 24px; 
    display: none; 
  }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -280px; height: 100%; box-shadow: 2px 0 15px rgba(0,0,0,0.1); }
    .sidebar.open { left: 0; }
    .menu-toggle { display: block; }
    .content-area { padding: 16px; }
  }
</style>
