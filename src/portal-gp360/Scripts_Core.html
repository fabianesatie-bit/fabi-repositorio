<script>
  if (typeof google === 'undefined') {
      console.warn("Ambiente Google Apps Script não detectado. Iniciando modo Mock.");
      window.google = {
          script: {
              run: {
                  registrarAuditoria: function() { return this; },
                  withSuccessHandler: function(cb) {
                      return {
                          obterDadosIniciais: function() { setTimeout(() => cb({ bloqueado: false, usuario: { nome: "Coordenador", cargo: "Coordenador GP", infoLinha2: "Regional SP" }, lojas: [], moedas: 100, historico: [], avisos: [], ranking: [] }), 400); },
                          buscarIndicadoresLoja: function() { setTimeout(() => cb({ sucesso: true, venda: "105%", nps: "90", bancoHoras: "8 h", lixo: "2", quadro: "0", txdes: "1.2%" }), 400); }
                      };
                  }
              }
          }
      };
  }

  var dadosGlobais = typeof dadosGlobais !== 'undefined' ? dadosGlobais : null; 
  var modoCicloDash = 'atual';
  var arquivoColadoMemoria = null;

  var urlsRedirecionamento = {
      "Relatorios/Feedback/Acompanhamento": "https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycbw4tWtEFsyTKrvE1cxGWcXz2X7WYUzT-rSEUvbrBkyKtcWQB_KicKnzJ7wLpDjU_kH0kQ/exec",
      "Relatórios/Feedback/Acompanhamento": "https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycbw4tWtEFsyTKrvE1cxGWcXz2X7WYUzT-rSEUvbrBkyKtcWQB_KicKnzJ7wLpDjU_kH0kQ/exec",
      "Atendimento Social": "https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycby5uSTGw249dLHn7sTa2Ar7k0g3VZTXallI2C3h2jRcR8g8bvO2xdPprrgXsRVZKegQaQ/exec"
  };
  var motivosRedirecionamento = Object.keys(urlsRedirecionamento);

  function normalizarFilialId(val) {
      if (!val && val !== 0) return "";
      let num = parseInt(String(val).replace(/\D/g, ''), 10);
      if (isNaN(num)) return String(val).trim();
      if (num > 3000) { num -= 3000; }
      return String(num);
  }

  function usarIniciaisComoFallback(imgElement) {
      let nome = imgElement.getAttribute('data-nome') || 'Usuario GP';
      imgElement.outerHTML = usarIniciais(nome);
  }

  function usarIniciais(nome) {
      let iniciais = (nome || 'GP').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      return '<div style="width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg, #005bb1, #0086ff);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;border:3px solid #0086ff;box-shadow:0 4px 12px rgba(0,134,255,0.2);">' + iniciais + '</div>';
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function toggleMenu() {
    let sb = document.getElementById('sidebar');
    if (sb) sb.classList.toggle('open');
  }

  function customConfirm(message, onConfirm) {
      let boxConfirm = document.createElement('div');
      boxConfirm.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; color:#333; padding:25px; border-radius:14px; z-index:9999; box-shadow:0 10px 25px rgba(0,0,0,0.2); text-align:center; min-width:320px; border:1px solid #e2e8f0;";
      boxConfirm.innerHTML = `
          <div style="margin-bottom:15px; color:#f43f5e; font-size:30px;"><i class="fa-solid fa-circle-exclamation"></i></div>
          <h3 style="margin-top:0; color:#1e293b; font-size:18px;">Atenção</h3>
          <p style="color:#64748b; font-size:14px; margin-bottom:20px;">${message}</p>
          <div style="display:flex; gap:10px; justify-content:center;">
              <button id="btn-cancelar-modal" class="btn-secondary" style="width:auto;">Cancelar</button>
              <button id="btn-confirmar-modal" class="btn-danger" style="width:auto;">Sim, Confirmar</button>
          </div>
      `;
      document.body.appendChild(boxConfirm);
      document.getElementById('btn-cancelar-modal').onclick = () => boxConfirm.remove();
      document.getElementById('btn-confirmar-modal').onclick = () => {
          boxConfirm.remove();
          onConfirm();
      };
  }

  function abrirPainelInternoEmbutido(url, titulo) {
     const container = document.getElementById('container-embutido-painel');
     const iframe = document.getElementById('iframe-painel-embutido-src');
     const lblTitulo = document.getElementById('titulo-painel-embutido');
     if (!container || !iframe) return;

     if (lblTitulo) lblTitulo.innerText = titulo || "Painel Corporativo";
     iframe.src = url;
     container.style.display = 'block';
     setTimeout(() => { container.scrollIntoView({ behavior: 'smooth' }); }, 100);
     google.script.run.registrarAuditoria("Painel Embutido", titulo || url);
  }

  function fecharPainelEmbutido() {
     const container = document.getElementById('container-embutido-painel');
     const iframe = document.getElementById('iframe-painel-embutido-src');
     if (container) container.style.display = 'none';
     if (iframe) iframe.src = 'about:blank';
  }

  function mostrarInstrucoesPWA() {
    alert("📱 Para instalar o Portal GP 360º no seu celular:\n\n1. No Chrome (Android): toque nos três pontinhos (⋮) e selecione 'Adicionar à tela inicial'.\n2. No Safari (iPhone/iOS): toque no ícone de Compartilhar (quadrado com seta para cima) e escolha 'Adicionar à Tela de Início'.");
  }
</script>
