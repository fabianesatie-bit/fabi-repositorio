<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_Core.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  var dadosGlobais = {};

  window.alterarPeriodoGeral = function() {
    inicializarAplicacao();
  };

  window.onload = function() {
    var hoje = new Date().toISOString().split('T')[0];
    var fieldData = document.getElementById('input-data-atividade');
    if (fieldData) fieldData.value = hoje;
    var fieldAvulsoData = document.getElementById('avulso-data');
    if (fieldAvulsoData) fieldAvulsoData.value = hoje;
    inicializarAplicacao();
  };

  function inicializarAplicacao() {
    var mElem = document.getElementById('seletor-mes');
    var aElem = document.getElementById('seletor-ano');
    var m = mElem ? mElem.value : '';
    var a = aElem ? aElem.value : '';

    // ETAPA 1: Leitura ultrarrápida da Home
    google.script.run
      .withSuccessHandler(function(res) {
        var splash = document.getElementById('loading-splash');
        if (splash) splash.classList.add('d-none');

        if (!res.temAcesso) {
          var lockScreen = document.getElementById('bloqueio-tela');
          if (lockScreen) lockScreen.classList.remove('d-none');
          var lockMsg = document.getElementById('bloqueio-mensagem');
          if (lockMsg) lockMsg.innerText = res.motivo || 'Acesso Restrito ao Portal GP 360.';
          return;
        }

        var appCont = document.getElementById('app-container');
        if (appCont) appCont.classList.remove('d-none');
        dadosGlobais = res;
        
        // Renderiza a Home Instantaneamente
        renderizarInterfaceCompleta();

        // ETAPA 2: Hidratação silenciosa em segundo plano dos formulários e indicadores
        carregarDadosComplementaresEmSegundoPlano();
      })
      .withFailureHandler(function(err) {
        var splash = document.getElementById('loading-splash');
        if (splash) splash.classList.add('d-none');
        var lockScreen = document.getElementById('bloqueio-tela');
        if (lockScreen) lockScreen.classList.remove('d-none');
        var lockMsg = document.getElementById('bloqueio-mensagem');
        if (lockMsg) lockMsg.innerText = 'Erro ao conectar ao servidor: ' + err.message;
      })
      .obterDadosIniciais(m, a);
  }

  function carregarDadosComplementaresEmSegundoPlano() {
    google.script.run
      .withSuccessHandler(function(comp) {
        if (!comp) return;
        dadosGlobais.lojas = comp.lojas || [];
        dadosGlobais.lojasCarteiraTotal = comp.lojasCarteiraTotal || 0;
        dadosGlobais.indicadoresLojas = comp.indicadoresLojas || {};
        dadosGlobais.naturezas = comp.naturezas || [];
        dadosGlobais.temas = comp.temas || { reuniao: [], treinamento: [] };

        var kpiLojas = document.getElementById('kpi-lojas-carteira');
        if (kpiLojas) kpiLojas.innerText = dadosGlobais.lojasCarteiraTotal;

        povoarDropdownsFormulario();
        renderizarListaNaturezasAdmin();
        renderizarGestaoTemasAdmin();
      })
      .obterDadosComplementares();
  }

  function salvarAtividade() {
    var escopo = document.getElementById('select-escopo-atendimento').value;
    var filial = (escopo === 'FILIAL') ? document.getElementById('select-filial').value : '';
    var natureza = document.getElementById('select-natureza').value;
    var obs = document.getElementById('input-observacao').value;
    var fileInput = document.getElementById('input-evidencia-file');
    var urlInput = document.getElementById('input-evidencia-url').value;

    if (escopo === 'FILIAL' && !filial) {
      mostrarToast('Selecione a loja de destino!', 'danger');
      return;
    }
    if (!natureza) {
      mostrarToast('Selecione a natureza da atividade!', 'danger');
      return;
    }

    var btn = document.getElementById('btn-salvar-lancamento');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Salvando...';
    }

    var temaStr = '';
    var natLower = natureza.toLowerCase();
    if (natLower.includes('reunião') || natLower.includes('reuniao')) {
      temaStr = temasReuniaoSelecionados.join(', ');
    } else if (natLower.includes('treinamento')) {
      var selTreina = document.getElementById('select-tema-treinamento');
      if (selTreina) temaStr = selTreina.value;
    }

    var payloadData = {
      filial: filial,
      escopo: escopo,
      tipoRoteiro: document.getElementById('select-tipo-roteiro').value,
      motivo: natureza,
      tema: temaStr,
      pessoasImpactadas: document.getElementById('input-pessoas-impactadas').value,
      tempoGasto: document.getElementById('input-tempo-gasto').value,
      observacao: obs,
      evidenciaUrlDirect: urlInput,
      rateKm: document.getElementById('input-rate-km').value,
      kmPercorrido: document.getElementById('input-km').value,
      valorAlimentacao: document.getElementById('input-alimentacao').value,
      valorHospedagem: document.getElementById('input-hospedagem').value,
      valorAereo: document.getElementById('input-aereo').value,
      valorPedagio: document.getElementById('input-pedagio').value,
      valorEstacionamento: document.getElementById('input-estacionamento').value
    };

    if (fileInput && fileInput.files.length > 0) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        var fileData = {
          base64: e.target.result,
          mimeType: file.type,
          ext: file.name.split('.').pop()
        };
        enviarBackendSalvar(payloadData, fileData, btn, natureza);
      };
      reader.readAsDataURL(file);
    } else {
      enviarBackendSalvar(payloadData, null, btn, natureza);
    }
  }

  function enviarBackendSalvar(payloadData, fileData, btn, natureza) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-coin me-1"></i> Salvar e Ganhar Moeda';
        }

        if (res.sucesso) {
          dispararConfetesFestao();
          var formLanc = document.getElementById('form-lancamento');
          if (formLanc) formLanc.reset();

          var natLower = String(natureza || '').toLowerCase();
          
          if (natLower.includes('atendimento social')) {
            mostrarToast('Atividade salva no histórico! Abrindo formulário detalhado...', 'success');
            window.open('https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycby5uSTGw249dLHn7sTa2Ar7k0g3VZTXallI2C3h2jRcR8g8bvO2xdPprrgXsRVZKegQaQ/exec', '_blank');
          } else if (natLower.includes('apuraç') || natLower.includes('apurac') || natLower.includes('feedback') || natLower.includes('acompanhamento')) {
            mostrarToast('Atividade salva no histórico! Abrindo painel de apuração...', 'success');
            window.open('https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycbw4tWtEFsyTKrvE1cxGWcXz2X7WYUzT-rSEUvbrBkyKtcWQB_KicKnzJ7wLpDjU_kH0kQ/exec', '_blank');
          } else {
            mostrarToast('Sua atividade foi registrada com sucesso!', 'success');
          }

          inicializarAplicacao();
        } else {
          mostrarToast('Erro ao salvar: ' + res.mensagem, 'danger');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-coin me-1"></i> Salvar e Ganhar Moeda';
        }
        mostrarToast('Erro no servidor: ' + err.message, 'danger');
      })
      .registrarAtividade(payloadData, fileData);
  }

  function salvarKMAvulso() {
    var dataViagem = document.getElementById('avulso-data').value;
    var destino = document.getElementById('avulso-destino').value;
    var km = document.getElementById('avulso-km').value;

    if (!destino || !km) {
      mostrarToast('Preencha o Destino e a Quantidade de KM!', 'danger');
      return;
    }

    var payloadData = {
      filial: 'AVULSO: ' + destino,
      escopo: 'REGIONAL',
      tipoRoteiro: 'Presencial (Visita in loco)',
      motivo: 'Deslocamento Avulso (' + destino + ')',
      kmPercorrido: km,
      rateKm: document.getElementById('avulso-rate').value,
      valorAlimentacao: document.getElementById('avulso-alimentacao').value,
      valorHospedagem: document.getElementById('avulso-hospedagem').value,
      valorAereo: document.getElementById('avulso-aereo').value,
      valorPedagio: document.getElementById('avulso-pedagio').value,
      valorEstacionamento: document.getElementById('avulso-estacionamento').value,
      observacao: 'Lançamento de KM Avulso'
    };

    google.script.run
      .withSuccessHandler(function(res) {
        alternarFormularioKMAvulso();
        mostrarToast(res.mensagem, res.sucesso ? 'success' : 'danger');
        inicializarAplicacao();
      })
      .registrarAtividade(payloadData, null);
  }

  function deletarHistorico(id) {
    google.script.run
      .withSuccessHandler(function(res) {
        mostrarToast(res.mensagem, res.sucesso ? 'success' : 'danger');
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirLancamento(id);
  }

  function addNatureza() {
    var txtElem = document.getElementById('input-nova-natureza');
    var txt = txtElem ? txtElem.value.trim() : '';
    if (!txt) return;

    google.script.run
      .withSuccessHandler(function(res) {
        mostrarToast(res.mensagem, res.sucesso ? 'success' : 'danger');
        if (res.sucesso) inicializarAplicacao();
      })
      .adicionarNatureza(txt);
  }

  function delNatureza(texto) {
    google.script.run
      .withSuccessHandler(function(res) {
        mostrarToast(res.mensagem, res.sucesso ? 'success' : 'danger');
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirNatureza(texto);
  }

  function deletarTemaAdmin(cat, texto) {
    google.script.run
      .withSuccessHandler(function(res) {
        mostrarToast(res.mensagem, res.sucesso ? 'success' : 'danger');
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirTema(cat, texto);
  }
</script>
