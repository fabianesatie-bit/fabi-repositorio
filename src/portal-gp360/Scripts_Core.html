<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_Core.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  var dadosGlobais = {};

  window.onload = function() {
    inicializarAplicacao();
  };

  function inicializarAplicacao() {
    var m = document.getElementById('seletor-mes').value;
    var a = document.getElementById('seletor-ano').value;

    google.script.run
      .withSuccessHandler(function(res) {
        document.getElementById('loading-splash').classList.add('d-none');

        if (!res.temAcesso) {
          document.getElementById('bloqueio-tela').classList.remove('d-none');
          document.getElementById('bloqueio-mensagem').innerText = res.motivo || 'Acesso Restrito ao Portal GP 360.';
          return;
        }

        document.getElementById('app-container').classList.remove('d-none');
        dadosGlobais = res;
        renderizarInterfaceCompleta();
      })
      .withFailureHandler(function(err) {
        document.getElementById('loading-splash').classList.add('d-none');
        document.getElementById('bloqueio-tela').classList.remove('d-none');
        document.getElementById('bloqueio-mensagem').innerText = 'Erro ao conectar: ' + err.message;
      })
      .obterDadosIniciais(m, a);
  }

  function alterarPeriodoGeral() {
    var m = document.getElementById('seletor-mes').value;
    var a = document.getElementById('seletor-ano').value;

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.temAcesso) {
          dadosGlobais.gamificacao = res.gamificacao;
          dadosGlobais.lancamentos = res.lancamentos;
          atualizarCardsGamificacao();
          renderizarTimelineAtividades();
        }
      })
      .obterDadosIniciais(m, a);
  }

  function salvarAtividade() {
    var filial = document.getElementById('select-filial').value;
    var natureza = document.getElementById('select-natureza').value;
    var tema = document.getElementById('select-tema-dinamico').value;
    var obs = document.getElementById('input-observacao').value;
    var fileInput = document.getElementById('input-evidencia');

    if (!filial || !natureza) {
      alert('Preencha todos os campos obrigatórios!');
      return;
    }

    var btn = document.getElementById('btn-salvar-lancamento');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Salvando...';

    var payloadData = {
      filial: filial,
      motivo: natureza,
      tema: tema,
      observacao: obs
    };

    if (fileInput.files.length > 0) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        var fileData = {
          base64: e.target.result,
          mimeType: file.type,
          ext: file.name.split('.').pop()
        };
        enviarBackendSalvar(payloadData, fileData, btn);
      };
      reader.readAsDataURL(file);
    } else {
      enviarBackendSalvar(payloadData, null, btn);
    }
  }

  function enviarBackendSalvar(payloadData, fileData, btn) {
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Salvar Lançamento';

        if (res.sucesso) {
          dispararConfetesFestao();
          abrirModalCelebracao('Sua atividade foi registrada e as moedas foram creditadas!');
          document.getElementById('form-lancamento').reset();
          alterarPeriodoGeral();
        } else {
          alert('Erro ao salvar: ' + res.mensagem);
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Salvar Lançamento';
        alert('Erro no servidor: ' + err.message);
      })
      .registrarAtividade(payloadData, fileData);
  }

  function salvarNovoTemaAdmin() {
    var cat = document.getElementById('admin-tema-categoria').value;
    var texto = document.getElementById('admin-tema-texto').value;
    if (!texto) return alert('Digite a descrição do tema!');

    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) {
          document.getElementById('admin-tema-texto').value = '';
          inicializarAplicacao();
        }
      })
      .adicionarTema(cat, texto);
  }

  function deletarTemaAdmin(cat, texto) {
    if (!confirm('Deseja excluir este tema?')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirTema(cat, texto);
  }
</script>
