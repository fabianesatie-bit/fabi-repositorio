<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_Core.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  /**
   * Submete o formulário principal de Lançamento de Atividade
   */
  function salvarAtividade() {
    var btn = document.getElementById('btn-salvar-lancamento');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Gravando Atividade...';
    }

    var dataAtividade = document.getElementById('input-data-atividade').value;
    var escopo = document.getElementById('select-escopo-atendimento').value;
    var tipoRoteiro = document.getElementById('select-tipo-roteiro').value;
    var filial = document.getElementById('select-filial').value;
    var natureza = document.getElementById('select-natureza').value;

    if (!dataAtividade) {
      mostrarToast('Por favor, informe a data da atividade.', 'danger');
      restaurarBotaoSalvar();
      return;
    }

    if (escopo === 'FILIAL' && !filial) {
      mostrarToast('Por favor, selecione a filial de destino.', 'danger');
      restaurarBotaoSalvar();
      return;
    }

    if (!natureza) {
      mostrarToast('Por favor, selecione a natureza do atendimento.', 'danger');
      restaurarBotaoSalvar();
      return;
    }

    var fileInput = document.getElementById('input-evidencia-file');
    var fileObj = null;

    if (fileInput && fileInput.files && fileInput.files[0]) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        fileObj = {
          base64: e.target.result,
          mimeType: file.type,
          nome: file.name
        };
        enviarPayloadAtividade(fileObj);
      };
      reader.readAsDataURL(file);
    } else {
      enviarPayloadAtividade(null);
    }
  }

  function enviarPayloadAtividade(arquivoEvidencia) {
    var payload = {
      dataAtividade: document.getElementById('input-data-atividade').value,
      escopo: document.getElementById('select-escopo-atendimento').value,
      tipoRoteiro: document.getElementById('select-tipo-roteiro').value,
      filial: document.getElementById('select-filial').value,
      natureza: document.getElementById('select-natureza').value,
      temasReuniao: window.temasReuniaoSelecionados || [],
      temaTreinamento: document.getElementById('select-tema-treinamento') ? document.getElementById('select-tema-treinamento').value : '',
      pessoasImpactadas: document.getElementById('input-pessoas-impactadas').value,
      tempoGasto: document.getElementById('input-tempo-gasto').value,
      rateKm: document.getElementById('input-rate-km').value,
      km: document.getElementById('input-km').value,
      alimentacao: document.getElementById('input-alimentacao').value,
      hospedagem: document.getElementById('input-hospedagem').value,
      aereo: document.getElementById('input-aereo').value,
      pedagio: document.getElementById('input-pedagio').value,
      estacionamento: document.getElementById('input-estacionamento').value,
      evidenciaUrl: document.getElementById('input-evidencia-url').value,
      observacao: document.getElementById('input-observacao').value,
      arquivoEvidencia: arquivoEvidencia
    };

    google.script.run
      .withSuccessHandler(function(res) {
        restaurarBotaoSalvar();
        if (res && res.sucesso) {
          mostrarToast(res.mensagem, 'success');
          dispararConfetesFestao();
          document.getElementById('form-lancamento').reset();
          window.temasReuniaoSelecionados = [];
          var containerChips = document.getElementById('chips-container-reuniao');
          if (containerChips) {
            var chips = containerChips.querySelectorAll('.chip-tema');
            chips.forEach(function(c) { c.classList.remove('selected'); });
          }
          mudarAba('aba-home', document.querySelector('.nav-btn-card'));
          carregarDadosIniciais();
        } else {
          mostrarToast((res ? res.mensagem : 'Falha ao salvar atividade.'), 'danger');
        }
      })
      .withFailureHandler(function(err) {
        restaurarBotaoSalvar();
        mostrarToast('Erro na conexão com o servidor: ' + (err.message || err), 'danger');
      })
      .salvarAtividadeServidor(payload);
  }

  function restaurarBotaoSalvar() {
    var btn = document.getElementById('btn-salvar-lancamento');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-coin me-1"></i> Salvar e Ganhar Moeda';
    }
  }

  function salvarKMAvulso() {
    var data = document.getElementById('avulso-data').value;
    var destino = document.getElementById('avulso-destino').value;
    var km = document.getElementById('avulso-km').value;

    if (!data || !destino || !km) {
      mostrarToast('Preencha os campos obrigatórios do KM Avulso.', 'danger');
      return;
    }

    var payload = {
      data: data,
      destino: destino,
      rate: document.getElementById('avulso-rate').value,
      km: km,
      alimentacao: document.getElementById('avulso-alimentacao').value,
      hospedagem: document.getElementById('avulso-hospedagem').value,
      aereo: document.getElementById('avulso-aereo').value,
      pedagio: document.getElementById('avulso-pedagio').value,
      estacionamento: document.getElementById('avulso-estacionamento').value
    };

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          mostrarToast(res.mensagem, 'success');
          document.getElementById('form-km-avulso').reset();
          alternarFormularioKMAvulso();
          carregarDadosIniciais();
        } else {
          mostrarToast((res ? res.mensagem : 'Erro ao salvar KM avulso.'), 'danger');
        }
      })
      .withFailureHandler(function(err) {
        mostrarToast('Erro ao gravar KM Avulso: ' + (err.message || err), 'danger');
      })
      .salvarKMAvulsoServidor(payload);
  }

  function deletarHistorico(idReg) {
    if (!idReg) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.sucesso) {
          mostrarToast(res.mensagem, 'success');
          carregarDadosIniciais();
        } else {
          mostrarToast((res ? res.mensagem : 'Erro ao excluir registro.'), 'danger');
        }
      })
      .withFailureHandler(function(err) {
        mostrarToast('Erro ao comunicar com o servidor: ' + (err.message || err), 'danger');
      })
      .deletarLancamento(idReg);
  }
</script>
