<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_Core.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  var dadosGlobais = {};

  window.alterarPeriodoGeral = function() {
    inicializarAplicacao();
  };

  window.onload = function() {
    var hoje = new Date().toISOString().split('T')[0];
    var fieldDataAtividade = document.getElementById('input-data-atividade');
    if (fieldDataAtividade) fieldDataAtividade.value = hoje;
    var fieldAvulsoData = document.getElementById('avulso-data');
    if (fieldAvulsoData) fieldAvulsoData.value = hoje;
    
    inicializarAplicacao();
  };

  function inicializarAplicacao() {
    var mSel = document.getElementById('seletor-mes');
    var aSel = document.getElementById('seletor-ano');
    var m = mSel ? mSel.value : (new Date().getMonth() + 1);
    var a = aSel ? aSel.value : new Date().getFullYear();

    google.script.run
      .withSuccessHandler(function(res) {
        var splash = document.getElementById('loading-splash');
        if (splash) splash.classList.add('d-none');

        if (!res.temAcesso) {
          var bloqueio = document.getElementById('bloqueio-tela');
          if (bloqueio) bloqueio.classList.remove('d-none');
          var msg = document.getElementById('bloqueio-mensagem');
          if (msg) msg.innerText = res.motivo || 'Acesso Restrito ao Portal GP 360.';
          return;
        }

        var app = document.getElementById('app-container');
        if (app) app.classList.remove('d-none');
        dadosGlobais = res;
        
        renderizarInterfaceCompleta();

        // Refresh currently active tab if needed
        var abaGaleria = document.getElementById('aba-galeria');
        if (abaGaleria && !abaGaleria.classList.contains('d-none')) {
          carregarGaleriaEvidencias();
        }
        var abaHistorico = document.getElementById('aba-historico');
        if (abaHistorico && !abaHistorico.classList.contains('d-none')) {
          renderizarHistoricos();
        }
        var abaGestao = document.getElementById('aba-gestao');
        if (abaGestao && !abaGestao.classList.contains('d-none')) {
          renderizarTimelineAtividades();
        }
      })
      .withFailureHandler(function(err) {
        var splash = document.getElementById('loading-splash');
        if (splash) splash.classList.add('d-none');
        var bloqueio = document.getElementById('bloqueio-tela');
        if (bloqueio) bloqueio.classList.remove('d-none');
        var msg = document.getElementById('bloqueio-mensagem');
        if (msg) msg.innerText = 'Erro ao conectar: ' + err.message;
      })
      .obterDadosIniciais(m, a);
  }

  function salvarAtividade() {
    var escopo = document.getElementById('select-escopo-atendimento').value;
    var filial = (escopo === 'FILIAL') ? document.getElementById('select-filial').value : '';
    var natureza = document.getElementById('select-natureza').value;
    var obs = document.getElementById('input-observacao').value;
    var fileInput = document.getElementById('input-evidencia-file');
    var urlInput = document.getElementById('input-evidencia-url').value;

    if (escopo === 'FILIAL' && !filial) {
      alert('Selecione a loja de destino!');
      return;
    }
    if (!natureza) {
      alert('Selecione a natureza da atividade!');
      return;
    }

    var btn = document.getElementById('btn-salvar-lancamento');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Salvando...';
    }

    var temaStr = '';
    if (natureza.toLowerCase().includes('reunião') || natureza.toLowerCase().includes('reuniao')) {
      temaStr = (typeof temasReuniaoSelecionados !== 'undefined') ? temasReuniaoSelecionados.join(', ') : '';
    } else if (natureza.toLowerCase().includes('treinamento')) {
      var selTr = document.getElementById('select-tema-treinamento');
      if (selTr) temaStr = selTr.value;
    }

    var payloadData = {
      filial: filial,
      escopo: escopo,
      tipoRoteiro: document.getElementById('select-tipo-roteiro').value,
      motivo: natureza,
      tema: temaStr,
      pessoasImpactadas: document.getElementById('input-pessoas-impactadas').value,
      tempoGasto: document.getElementById('input-tempo-gasto').value,
      observacao: obs,
      evidenciaUrlDirect: urlInput,
      rateKm: document.getElementById('input-rate-km').value,
      kmPercorrido: document.getElementById('input-km').value,
      valorAlimentacao: document.getElementById('input-alimentacao').value,
      valorHospedagem: document.getElementById('input-hospedagem').value,
      valorAereo: document.getElementById('input-aereo').value,
      valorPedagio: document.getElementById('input-pedagio').value,
      valorEstacionamento: document.getElementById('input-estacionamento').value
    };

    if (fileInput && fileInput.files.length > 0) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        var fileData = {
          base64: e.target.result,
          mimeType: file.type,
          ext: file.name.split('.').pop()
        };
        enviarBackendSalvar(payloadData, fileData, btn);
      };
      reader.readAsDataURL(file);
    } else {
      enviarBackendSalvar(payloadData, null, btn);
    }
  }

  function enviarBackendSalvar(payloadData, fileData, btn) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-coin me-1"></i> Salvar e Ganhar Moeda';
        }

        if (res.sucesso) {
          dispararConfetesFestao();
          alert('Sua atividade foi registrada com sucesso!');
          var form = document.getElementById('form-lancamento');
          if (form) form.reset();
          inicializarAplicacao();
        } else {
          alert('Erro ao salvar: ' + res.mensagem);
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-coin me-1"></i> Salvar e Ganhar Moeda';
        }
        alert('Erro no servidor: ' + err.message);
      })
      .registrarAtividade(payloadData, fileData);
  }

  function salvarKMAvulso() {
    var dataViagem = document.getElementById('avulso-data').value;
    var destino = document.getElementById('avulso-destino').value;
    var km = document.getElementById('avulso-km').value;

    if (!destino || !km) {
      alert('Preencha o Destino e a Quantidade de KM!');
      return;
    }

    var payloadData = {
      filial: 'AVULSO: ' + destino,
      escopo: 'REGIONAL',
      tipoRoteiro: 'Presencial (Visita in loco)',
      motivo: 'Deslocamento Avulso (' + destino + ')',
      kmPercorrido: km,
      rateKm: document.getElementById('avulso-rate').value,
      valorAlimentacao: document.getElementById('avulso-alimentacao').value,
      valorHospedagem: document.getElementById('avulso-hospedagem').value,
      valorAereo: document.getElementById('avulso-aereo').value,
      valorPedagio: document.getElementById('avulso-pedagio').value,
      valorEstacionamento: document.getElementById('avulso-estacionamento').value,
      observacao: 'Lançamento de KM Avulso'
    };

    google.script.run
      .withSuccessHandler(function(res) {
        alternarFormularioKMAvulso();
        alert(res.mensagem);
        inicializarAplicacao();
      })
      .registrarAtividade(payloadData, null);
  }

  function deletarHistorico(id) {
    if (!confirm('Deseja realmente excluir este lançamento?')) return;

    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirLancamento(id);
  }

  function addNatureza() {
    var txt = document.getElementById('input-nova-natureza').value.trim();
    if (!txt) return;

    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) inicializarAplicacao();
      })
      .adicionarNatureza(txt);
  }

  function delNatureza(texto) {
    if (!confirm('Deseja excluir esta natureza?')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirNatureza(texto);
  }

  function deletarTemaAdmin(cat, texto) {
    if (!confirm('Deseja excluir este tema?')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        alert(res.mensagem);
        if (res.sucesso) inicializarAplicacao();
      })
      .excluirTema(cat, texto);
  }
</script>
