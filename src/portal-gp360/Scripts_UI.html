<script>
  window.onload = function() {
    document.getElementById('lanc-data').valueAsDate = new Date(); 
    let h = new Date().getHours();
    let saudacao = h < 12 ? "Bom dia" : (h < 18 ? "Boa tarde" : "Boa noite");

    google.script.run.withSuccessHandler(function(res) {
       document.getElementById('loading-splash').style.display = 'none';

       if(res.bloqueado) {
          document.getElementById('bloqueio-tela').style.display = 'flex';
          if(res.mensagem) document.getElementById('txt-motivo-bloqueio').innerText = res.mensagem;
          return;
       }

       if(res.erro) {
          mostrarToast(res.erro);
          document.getElementById('app-container').style.display = 'flex';
          document.getElementById('user-name').innerText = "Erro no Login";
          return;
       }
       document.getElementById('app-container').style.display = 'flex';
       dadosGlobais = res;

       document.getElementById('user-name').innerText = saudacao + ", " + res.usuario.nome.split(' ')[0];
       document.getElementById('user-role').innerText = res.usuario.cargo;
       document.getElementById('user-info2').innerText = res.usuario.infoLinha2;
       document.getElementById('user-coins').innerText = res.moedas;
       let divFoto = document.getElementById('user-photo-container');
       if (res.usuario.foto) {
           divFoto.innerHTML = '<img src="' + res.usuario.foto + '" alt="Foto" data-nome="' + res.usuario.nome + '" onerror="usarIniciaisComoFallback(this)">';
       } else {
           divFoto.innerHTML = usarIniciais(res.usuario.nome);
       }
       if (res.usuario.isAdmin || res.usuario.isSuperAdmin) {
           document.getElementById('btn-add-aviso').style.display = 'block';
       }
       if (res.usuario.isConfigAdmin || res.usuario.isGerenteGP) {
           document.getElementById('menu-admin').style.display = 'block';
       }

       if (typeof res.mesAtualNum === 'number') {
           document.getElementById('lbl-mes-atual-nome').innerText = nomesMesesMap[res.mesAtualNum];
           document.getElementById('lbl-mes-anterior-nome').innerText = nomesMesesMap[res.mesAnteriorNum];
       }

       renderizarGamificacaoVisual(res);
       atualizarCardsDashboard();

       document.getElementById('dash-lojas').innerText = res.qtdLojasCarteira || res.lojas.length;
       let selectDestino = document.getElementById('lanc-destino');
       res.lojas.forEach(loja => {
          let opt = document.createElement('option');
          opt.value = loja.id;
          opt.text = loja.id + ' - ' + loja.nome;
          selectDestino.add(opt);
       });
       
       atualizarSelectNaturezas(res.naturezas);
       renderizarRanking(res.ranking);
       renderizarAvisos(res.avisos);
       renderizarHistoricos();
       renderizarListaAdmin(res.naturezas);
    }).obterDadosIniciais();
  };

  function selecionarCicloDash(modo) {
      modoCicloDash = modo;
      if (modo === 'atual') {
          document.getElementById('btn-dash-atual').classList.add('filter-pill-active');
          document.getElementById('btn-dash-anterior').classList.remove('filter-pill-active');
      } else {
          document.getElementById('btn-dash-anterior').classList.add('filter-pill-active');
          document.getElementById('btn-dash-atual').classList.remove('filter-pill-active');
      }
      atualizarCardsDashboard();
  }

  function atualizarCardsDashboard() {
      if (!dadosGlobais) return;
      if (modoCicloDash === 'atual') {
          document.getElementById('arvore-moedas-mes').innerText = dadosGlobais.moedasMes || 0;
          document.getElementById('dash-gastos').innerText = 'R$ ' + (dadosGlobais.gastos || 0).toFixed(2).replace('.', ',');
          document.getElementById('dash-visitas').innerText = dadosGlobais.qtdVisitas || 0;
      } else {
          document.getElementById('arvore-moedas-mes').innerText = dadosGlobais.moedasMesAnterior || 0;
          document.getElementById('dash-gastos').innerText = 'R$ ' + (dadosGlobais.gastosMesAnterior || 0).toFixed(2).replace('.', ',');
          document.getElementById('dash-visitas').innerText = dadosGlobais.qtdVisitasAnterior || 0;
      }
      renderizarRanking(dadosGlobais.ranking);
  }

  function renderizarGamificacaoVisual(res) {
      document.getElementById('arvore-moedas-mes').innerText = res.moedasMes || 0;
      document.getElementById('arvore-moedas-total').innerText = res.moedas || 0;

      let emoji = '🥾';
      let nomeFase = 'Fase 1: Acampamento Base';
      if (res.faseMontanha === 2) { emoji = '🧗'; nomeFase = 'Fase 2: Subida da Montanha'; }
      else if (res.faseMontanha === 3) { emoji = '🏔️'; nomeFase = 'Fase 3: Cume Alcançado'; }
      else if (res.faseMontanha === 4) { emoji = '🏔️⚡'; nomeFase = 'Fase Final: Bandeira no Everest'; }

      document.getElementById('arvore-visual-box').innerText = emoji;
      document.getElementById('arvore-fase-badge').innerText = nomeFase;
  }

  function renderizarRanking(ranking) {
      const ul = document.getElementById('lista-ranking');
      if(!ul) return;
      ul.innerHTML = '';
      if (!ranking || ranking.length === 0) {
          ul.innerHTML = '<li style="padding:10px;text-align:center;color:#64748b;">Nenhum engajamento registrado.</li>';
          return;
      }

      // Ordenar cópia do ranking com base no ciclo ativo selecionado
      let rankingCiclo = [...ranking];
      if (modoCicloDash === 'atual') {
          rankingCiclo.sort((a, b) => (b.moedasMes || 0) - (a.moedasMes || 0));
      } else {
          rankingCiclo.sort((a, b) => (b.moedasMesAnterior || 0) - (a.moedasMesAnterior || 0));
      }

      const top5 = rankingCiclo.filter(u => {
          let m = modoCicloDash === 'atual' ? u.moedasMes : u.moedasMesAnterior;
          return m > 0;
      }).slice(0, 5);

      if (top5.length === 0) {
          ul.innerHTML = '<li style="padding:10px;text-align:center;color:#64748b;">Nenhum engajamento registrado neste ciclo.</li>';
          return;
      }

      const nomesFaseMontanha = { 
        1: '🥾 Acampamento Base', 
        2: '🧗 Subida da Montanha', 
        3: '🏔️ Cume Alcançado', 
        4: '🏔️⚡ Bandeira no Everest' 
      };

      top5.forEach((user, index) => {
          let pos = index + 1;
          let posHtml = `<div class="ranking-pos">${pos}º</div>`;
          let fotoHtml = user.foto ? `<img src="${user.foto}" class="ranking-img" onerror="usarIniciaisComoFallback(this)" data-nome="${user.nome}">` : `<div class="ranking-img">${usarIniciais(user.nome)}</div>`;

          let statusTag = `<span style="font-size:10px; font-weight:bold; background:#f3e8ff; color:#6b21a8; padding:2px 8px; border-radius:10px; display:inline-block;">${nomesFaseMontanha[user.fase || 1]}</span>`;

          let moedasExibidas = modoCicloDash === 'atual' ? user.moedasMes : user.moedasMesAnterior;

          let li = document.createElement('li');
          li.className = 'ranking-item';
          li.innerHTML = posHtml + fotoHtml +
                         `<div class="ranking-info">
                            <div class="ranking-nome">${user.nome}</div>
                            <div style="display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap;">
                              ${statusTag}
                            </div>
                          </div>
                          <div class="ranking-moedas"><i class="fa-solid fa-coins" style="color:#f59e0b;"></i> ${moedasExibidas}</div>`;
          ul.appendChild(li);
      });
  }

  function renderizarAvisos(avisos) {
      const container = document.getElementById('mural-avisos-container');
      const lista = document.getElementById('lista-avisos');
      if (!container || !lista) return;
      lista.innerHTML = '';
      if (!avisos || avisos.length === 0) {
          container.style.display = 'none';
          return;
      }
      container.style.display = 'block';
      avisos.forEach(a => {
          let btnDel = (dadosGlobais && dadosGlobais.usuario && (dadosGlobais.usuario.isAdmin || dadosGlobais.usuario.isSuperAdmin)) 
                       ? `<i class="fa-solid fa-xmark btn-del-aviso" onclick="deletarAviso('${a.data}', '${a.mensagem}')" title="Excluir Aviso"></i>` : '';
          let div = document.createElement('div');
          div.className = 'aviso-item';
          div.innerHTML = `<div class="aviso-meta"><i class="fa-regular fa-clock"></i> ${a.data} • ${a.autor}</div>
                           <div style="font-size:13px; color:#1e293b;">${a.mensagem}</div>
                           ${btnDel}`;
          lista.appendChild(div);
      });
  }

  function abrirModalAviso() {
      let selectDir = document.getElementById('aviso-diretoria');
      selectDir.innerHTML = '<option value="Todos">Todas as Diretorias</option>';
      if (dadosGlobais && dadosGlobais.diretorias) {
          dadosGlobais.diretorias.forEach(d => {
              selectDir.add(new Option(d, d));
          });
      }
      document.getElementById('texto-novo-aviso').value = '';
      document.getElementById('modal-novo-aviso').style.display = 'flex';
  }

  function fecharModalAviso() {
      document.getElementById('modal-novo-aviso').style.display = 'none';
  }

  function salvarNovoAviso() {
      let msg = document.getElementById('texto-novo-aviso').value.trim();
      let dir = document.getElementById('aviso-diretoria').value;
      if (!msg) return mostrarToast('Digite a mensagem!');
      let btn = document.getElementById('btn-salvar-aviso');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publicando...';

      google.script.run.withSuccessHandler(function(res){
          btn.disabled = false;
          btn.innerHTML = 'Publicar Aviso';
          if (res.erro) { mostrarToast(res.erro); return; }
          mostrarToast('Recado publicado!');
          fecharModalAviso();
          google.script.run.withSuccessHandler(function(newData){
              dadosGlobais = newData;
              renderizarAvisos(newData.avisos);
          }).obterDadosIniciais();
      }).publicarAviso(msg, dir);
  }

  function deletarAviso(data, msg) {
      customConfirm("Tem certeza que deseja apagar este recado?", function() {
          google.script.run.withSuccessHandler(function(res){
              if (res.erro) { mostrarToast(res.erro); return; }
              mostrarToast('Recado excluído!');
              google.script.run.withSuccessHandler(function(newData){
                  dadosGlobais = newData;
                  renderizarAvisos(newData.avisos);
              }).obterDadosIniciais();
          }).excluirAvisoPlanilha(data, msg);
      });
  }

  function toggleTodasAbrangencias(checkbox) {
     document.querySelectorAll('.chk-abrangencia').forEach(chk => chk.checked = checkbox.checked);
  }

  function alternarEscopo(valor) {
    document.getElementById('grupo-filial').style.display = valor === 'filial' ? 'block' : 'none';
    document.getElementById('grupo-abrangencia-lancamento').style.display = (valor === 'regional' || valor === 'diretoria') ? 'block' : 'none';
    if(valor !== 'filial') document.getElementById('painel-indicadores-lancamento').style.display = 'none';
    
    let containerPils = document.getElementById('container-pilulas-abrangencia');
    let lblAbrangencia = document.getElementById('lbl-abrangencia');
    
    if (containerPils && dadosGlobais) {
        containerPils.innerHTML = '';
        let checkTodas = document.getElementById('check-todas-abrangencia');
        if(checkTodas) checkTodas.checked = false;

        let arrayBase = [];
        if (valor === 'regional') {
            lblAbrangencia.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> Selecione as Regionais:';
            arrayBase = dadosGlobais.usuario.isSuperAdmin ? [...new Set(dadosGlobais.lojas.map(l => l.regional))].sort() : dadosGlobais.usuario.regionais;
        } else if (valor === 'diretoria') {
            lblAbrangencia.innerHTML = '<i class="fa-solid fa-sitemap"></i> Selecione as Diretorias:';
            arrayBase = dadosGlobais.usuario.isSuperAdmin ? dadosGlobais.diretorias : dadosGlobais.usuario.diretoriasAtendidas;
        }
        if (arrayBase && arrayBase.length > 0) {
            arrayBase.forEach(r => {
                containerPils.innerHTML += `<label class="check-label"><input type="checkbox" value="${r}" class="chk-abrangencia"><span class="pill-btn">${r}</span></label>`;
            });
        }
    }
    verificarCamposDinamicos();
  }

  function atualizarSelectNaturezas(naturezas) {
     let optgroup = document.getElementById('optgroup-dinamico');
     if (!optgroup) return;
     optgroup.innerHTML = "";
     if(naturezas && naturezas.length > 0) {
         optgroup.style.display = 'block';
         naturezas.forEach(item => { optgroup.innerHTML += `<option value="${item}">${item}</option>`; });
     } else {
         optgroup.style.display = 'none';
     }
  }

  function verificarCamposDinamicos() {
     const motivo = document.getElementById('lanc-motivo').value;
     const roteiro = document.getElementById('lanc-roteiro').value;
     const isRedirect = motivosRedirecionamento.includes(motivo);

     if (motivo === "Reunião regional") {
         document.getElementById('sub-reuniao').style.display = 'block';
         document.getElementById('sub-treinamento').style.display = 'none';
     } else if (motivo === "Treinamentos") {
         document.getElementById('sub-reuniao').style.display = 'none';
         document.getElementById('sub-treinamento').style.display = 'block';
     } else {
         document.getElementById('sub-reuniao').style.display = 'none';
         document.getElementById('sub-treinamento').style.display = 'none';
         document.querySelectorAll('.chk-tema').forEach(chk => chk.checked = false);
     }
     
     if (isRedirect) {
         document.getElementById('grupo-evidencia').style.display = 'none';
         document.getElementById('grupo-obs').style.display = 'block';
         document.getElementById('grupo-metricas-impacto').style.display = 'block';
     } else {
         document.getElementById('grupo-evidencia').style.display = 'block';
         document.getElementById('grupo-obs').style.display = 'block';
         document.getElementById('grupo-metricas-impacto').style.display = 'block';
     }
     
     if (roteiro && roteiro.includes('Presencial')) {
         document.getElementById('grupo-km').style.display = 'block';
     } else {
         document.getElementById('grupo-km').style.display = 'none';
         document.getElementById('km-qtd').value = 0;
         document.getElementById('gasto-alimentacao').value = '';
         document.getElementById('gasto-hospedagem').value = '';
         document.getElementById('gasto-aereo').value = '';
         document.getElementById('gasto-pedagio').value = '';
         document.getElementById('gasto-estacionamento').value = '';
         calcularDespesas();
     }
     
     const btnSalvar = document.getElementById('btn-salvar');
     if (isRedirect) {
         mostrarToast("Atenção: Ação requer envio via Portal Externo!");
         btnSalvar.innerHTML = '<i class="fa-solid fa-external-link-alt"></i> Ir para Portal Externo (+1 Moeda)';
         btnSalvar.style.backgroundColor = "#f43f5e";
     } else {
         btnSalvar.innerHTML = '<i class="fa-solid fa-coins"></i> Salvar e Ganhar Moeda';
         btnSalvar.style.backgroundColor = "var(--main-color)";
     }
  }

  function calcularDespesas() {
     let kmValor = parseFloat(document.getElementById('km-valor').value) || 0;
     let kmQtd = parseFloat(document.getElementById('km-qtd').value) || 0;
     let kmCusto = kmValor * kmQtd;
     document.getElementById('km-custo-display').value = kmCusto.toFixed(2);

     let alimentacao = parseFloat(document.getElementById('gasto-alimentacao').value) || 0;
     let hospedagem = parseFloat(document.getElementById('gasto-hospedagem').value) || 0;
     let aereo = parseFloat(document.getElementById('gasto-aereo').value) || 0;
     let pedagio = parseFloat(document.getElementById('gasto-pedagio').value) || 0;
     let estacionamento = parseFloat(document.getElementById('gasto-estacionamento').value) || 0;

     let total = kmCusto + alimentacao + hospedagem + aereo + pedagio + estacionamento;
     document.getElementById('gasto-total-display').innerText = total.toFixed(2).replace('.', ',');
  }

  function calcularDespesasAvulso() {
     let kmValor = parseFloat(document.getElementById('avulso-valor').value) || 0;
     let kmQtd = parseFloat(document.getElementById('avulso-qtd').value) || 0;
     let kmCusto = kmValor * kmQtd;

     let alimentacao = parseFloat(document.getElementById('avulso-alimentacao').value) || 0;
     let hospedagem = parseFloat(document.getElementById('avulso-hospedagem').value) || 0;
     let aereo = parseFloat(document.getElementById('avulso-aereo').value) || 0;
     let pedagio = parseFloat(document.getElementById('avulso-pedagio').value) || 0;
     let estacionamento = parseFloat(document.getElementById('avulso-estacionamento').value) || 0;

     let total = kmCusto + alimentacao + hospedagem + aereo + pedagio + estacionamento;
     document.getElementById('avulso-total-display').innerText = total.toFixed(2).replace('.', ',');
  }

  function mostrarIndicadoresLancamento(filialId) {
      const painel = document.getElementById('painel-indicadores-lancamento');
      const loading = document.getElementById('loading-indicadores-lanc');
      const grid = document.getElementById('grid-indicadores-lanc');
      if (!filialId) { painel.style.display = 'none'; return; }

      painel.style.display = 'block';
      loading.style.display = 'block';
      grid.style.display = 'none';

      document.getElementById('ind-nps-val').innerText = '-';
      document.getElementById('ind-rec-val').innerText = '-';
      document.getElementById('ind-bh-val').innerText = '-';
      document.getElementById('ind-quadro-val').innerText = '-';
      document.getElementById('ind-txdes-val').innerText = '-';
      google.script.run.withSuccessHandler(function(res){
          loading.style.display = 'none';
          grid.style.display = 'grid'; 
          if(res.erro || !res.sucesso) return mostrarToast("Erro ao buscar: " + res.erro);

          document.getElementById('ind-nps-val').innerText = res.nps;
          document.getElementById('ind-rec-val').innerText = res.venda;
          document.getElementById('ind-bh-val').innerText = res.bancoHoras !== "-" ? res.bancoHoras + " h" : "-";
          document.getElementById('ind-quadro-val').innerText = res.quadro;
          document.getElementById('ind-txdes-val').innerText = res.txdes;
      }).buscarIndicadoresLoja(filialId);
  }

  function salvarAtividade() {
     let btn = document.getElementById('btn-salvar');
     const escopo = document.getElementById('lanc-escopo').value;
     const motivo = document.getElementById('lanc-motivo').value;
     
     let destino = "";
     if (escopo === 'filial') {
         destino = document.getElementById('lanc-destino').value;
     } else {
         let selecionadas = [];
         document.querySelectorAll('.chk-abrangencia:checked').forEach(cb => selecionadas.push(cb.value));
         if(selecionadas.length === 0) return mostrarToast("Selecione pelo menos uma opção!");
         let prefixo = escopo === 'regional' ? 'REGIONAL - ' : 'DIRETORIA - ';
         destino = prefixo + selecionadas.join(' / ');
     }
     
     let subTema = "";
     try {
         if (motivo === "Reunião regional") {
             let temasR = [];
             document.querySelectorAll('.chk-tema:checked').forEach(cb => temasR.push(cb.value));
             subTema = temasR.join(', ');
         } else if (motivo === "Treinamentos") {
             let elemTreino = document.getElementById('treinamento-tema');
             if(elemTreino) subTema = elemTreino.value;
         }
     } catch(e) {}
     
     let dataAtiv = document.getElementById('lanc-data').value;
     if(!dataAtiv || !destino || !motivo) {
         return mostrarToast("Preencha Data, Destino e Motivo!");
     }
     
     let pessoasImpactadas = 0;
     try { let p = document.getElementById('lanc-pessoas'); if(p && p.value) pessoasImpactadas = parseInt(p.value, 10); } catch(e){}

     let tempoGasto = 0;
     try { let t = document.getElementById('lanc-tempo'); if(t && t.value) tempoGasto = parseFloat(t.value); } catch(e){}
     let observacoes = "";
     try { let o = document.getElementById('lanc-obs'); if(o && o.value) observacoes = o.value; } catch(e){}
     
     let gastoTotalFormatado = parseFloat(document.getElementById('gasto-total-display').innerText.replace(',', '.')) || 0;
     let linkInputDrive = "";
     try { let ld = document.getElementById('lanc-link-drive'); if(ld && ld.value) linkInputDrive = ld.value; } catch(e){}

     if (motivosRedirecionamento.includes(motivo)) {
         window.open(urlsRedirecionamento[motivo], "_blank");
         mostrarToast("Redirecionando para painel externo...");

         let dRedir = {
             dataAtividade: document.getElementById('lanc-data').value || new Date().toISOString().split('T')[0],
             roteiro: document.getElementById('lanc-roteiro').value || "Não informado",
             destino: destino,
             motivo: motivo,
             observacoes: observacoes ? observacoes + " (Redirecionamento efetuado via formulário do Portal GP 360)" : "Redirecionamento efetuado via formulário do Portal GP 360",
             notaChecklist: "",
             moedas: 1, 
             kmValor: parseFloat(document.getElementById('km-valor').value) || 0,
             kmQtd: parseFloat(document.getElementById('km-qtd').value) || 0,
             kmCusto: parseFloat(document.getElementById('km-custo-display').value) || 0,
             alimentacao: parseFloat(document.getElementById('gasto-alimentacao').value) || 0,
             hospedagem: parseFloat(document.getElementById('gasto-hospedagem').value) || 0,
             aereo: parseFloat(document.getElementById('gasto-aereo').value) || 0,
             pedagio: parseFloat(document.getElementById('gasto-pedagio').value) || 0,
             estacionamento: parseFloat(document.getElementById('gasto-estacionamento').value) || 0,
             gastoTotal: gastoTotalFormatado,
             subTema: subTema, 
             pessoasImpactadas: isNaN(pessoasImpactadas) ? 0 : pessoasImpactadas, 
             tempoGasto: isNaN(tempoGasto) ? 0 : tempoGasto, 
             linkEvidenciaExterna: ""
         };
         btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Registrando..."; btn.disabled = true;
         chamarBackendSalvar(dRedir, btn);
         document.getElementById('lanc-motivo').value = '';
         verificarCamposDinamicos();
         return; 
     }
     
     let d = {
        dataAtividade: dataAtiv,
        roteiro: document.getElementById('lanc-roteiro').value || "",
        destino: destino,
        motivo: motivo,
        observacoes: observacoes,
        notaChecklist: "",
        moedas: 1, 
        kmValor: parseFloat(document.getElementById('km-valor').value) || 0,
        kmQtd: parseFloat(document.getElementById('km-qtd').value) || 0,
        kmCusto: parseFloat(document.getElementById('km-custo-display').value) || 0,
        alimentacao: parseFloat(document.getElementById('gasto-alimentacao').value) || 0,
        hospedagem: parseFloat(document.getElementById('gasto-hospedagem').value) || 0,
        aereo: parseFloat(document.getElementById('gasto-aereo').value) || 0,
        pedagio: parseFloat(document.getElementById('gasto-pedagio').value) || 0,
        estacionamento: parseFloat(document.getElementById('gasto-estacionamento').value) || 0,
        gastoTotal: gastoTotalFormatado,
        subTema: subTema,
        pessoasImpactadas: isNaN(pessoasImpactadas) ? 0 : pessoasImpactadas,
        tempoGasto: isNaN(tempoGasto) ? 0 : tempoGasto,
        linkEvidenciaExterna: linkInputDrive
     };
     btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Salvando..."; btn.disabled = true;
     chamarBackendSalvar(d, btn);
  }

  function chamarBackendSalvar(dados, btn) {
     google.script.run.withSuccessHandler(function(res){
         if(res.erro) { mostrarToast("Erro: " + res.erro); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-coins"></i> Salvar e Ganhar Moeda'; return; }

         dispararConfetes();
         mostrarToast("Ação salva com sucesso!");
         btn.disabled = false;
         setTimeout(function() {
             document.getElementById('lanc-data').valueAsDate = new Date();
             document.getElementById('lanc-destino').value = '';
             let obsEl = document.getElementById('lanc-obs'); if(obsEl) obsEl.value = '';
             let pesEl = document.getElementById('lanc-pessoas'); if(pesEl) pesEl.value = '';
             let tmpEl = document.getElementById('lanc-tempo'); if(tmpEl) tmpEl.value = '';
             document.getElementById('km-qtd').value = 0;
             document.getElementById('gasto-alimentacao').value = '';
             document.getElementById('gasto-hospedagem').value = '';
             document.getElementById('gasto-aereo').value = '';
             document.getElementById('gasto-pedagio').value = '';
             document.getElementById('gasto-estacionamento').value = '';
             document.querySelectorAll('.chk-abrangencia').forEach(chk => chk.checked = false);
             let checkTodas = document.getElementById('check-todas-abrangencia'); if(checkTodas) checkTodas.checked = false;
             calcularDespesas();
             document.getElementById('painel-indicadores-lancamento').style.display = 'none';

             verificarCamposDinamicos();
             google.script.run.withSuccessHandler(function(newData){
                 dadosGlobais = newData;
                 renderizarGamificacaoVisual(newData);
                 renderizarHistoricos();
                 renderizarRanking(newData.ranking);

                 let domMoedas = document.getElementById('user-coins');
                 if(domMoedas) domMoedas.innerText = newData.moedas;

                 atualizarCardsDashboard();
                 mudarAba('home', document.querySelector('.nav-item'));
             }).obterDadosIniciais();
         }, 1000);
     }).registrarAtividade(dados);
  }

  function abrirModalAvulso() {
      document.getElementById('avulso-data').valueAsDate = new Date();
      document.getElementById('avulso-destino').value = '';
      document.getElementById('avulso-qtd').value = '';
      document.getElementById('avulso-alimentacao').value = '';
      document.getElementById('avulso-hospedagem').value = '';
      document.getElementById('avulso-aereo').value = '';
      document.getElementById('avulso-pedagio').value = '';
      document.getElementById('avulso-estacionamento').value = '';
      document.getElementById('avulso-total-display').innerText = '0,00';
      document.getElementById('modal-km-avulso').style.display='block';
  }

  function salvarKMAvulso() {
     const data = document.getElementById('avulso-data').value; 
     const destino = document.getElementById('avulso-destino').value; 
     const valor = parseFloat(document.getElementById('avulso-valor').value) || 0; 
     const qtd = parseFloat(document.getElementById('avulso-qtd').value) || 0;
     const kmCusto = valor * qtd;

     const alimentacao = parseFloat(document.getElementById('avulso-alimentacao').value) || 0;
     const hospedagem = parseFloat(document.getElementById('avulso-hospedagem').value) || 0;
     const aereo = parseFloat(document.getElementById('avulso-aereo').value) || 0;
     const pedagio = parseFloat(document.getElementById('avulso-pedagio').value) || 0;
     const estacionamento = parseFloat(document.getElementById('avulso-estacionamento').value) || 0;

     const totalFloat = kmCusto + alimentacao + hospedagem + aereo + pedagio + estacionamento;
     if(!data || !destino || totalFloat <= 0) { 
         mostrarToast("Preencha data, destino e ao menos um gasto válido!"); 
         return; 
     }
     const payload = { 
       destino: "AVULSO: " + destino, 
       motivo: "Deslocamento Avulso (Sede/Evento)", 
       dataViagem: data, 
       kmValor: valor, 
       kmQtd: qtd, 
       kmCusto: kmCusto, 
       alimentacao: alimentacao,
       hospedagem: hospedagem,
       aereo: aereo,
       pedagio: pedagio,
       estacionamento: estacionamento,
       gastoTotal: totalFloat, 
       moedas: 0,
       roteiro: "Presencial (KM Avulso)",
       linkEvidenciaExterna: ""
     };
     document.getElementById('modal-km-avulso').style.display='none';
     mostrarToast("Salvando KM Avulso...");
     google.script.run.withSuccessHandler(function(res){ 
         if(res.erro) { mostrarToast(res.erro); return; }
         dispararConfetes();
         mostrarToast("KM Avulso registrado!"); 
         google.script.run.withSuccessHandler(function(newData){
             dadosGlobais = newData;
             renderizarHistoricos();
             atualizarCardsDashboard();
         }).obterDadosIniciais(); 
     }).registrarAtividade(payload);
  }

  function parseDataBR(dataString) {
      if (!dataString) return 0;
      if (dataString.includes('-')) return new Date(dataString + "T00:00:00").getTime();
      let partes = dataString.split('/');
      if (partes.length === 3) return new Date(partes[2], partes[1] - 1, partes[0]).getTime();
      return 0;
  }

  function filtrarCicloRapido(mes) {
      let ano = new Date().getFullYear();
      if (mes === 'julho') {
          document.getElementById('filtro-dt-inicio').value = ano + '-07-01';
          document.getElementById('filtro-dt-fim').value = ano + '-07-31';
      } else if (mes === 'agosto') {
          document.getElementById('filtro-dt-inicio').value = ano + '-08-01';
          document.getElementById('filtro-dt-fim').value = ano + '-08-31';
      }
      renderizarHistoricos();
  }

  function limparFiltroDatas() {
      document.getElementById('filtro-dt-inicio').value = '';
      document.getElementById('filtro-dt-fim').value = '';
      renderizarHistoricos();
  }

  function renderizarHistoricos() {
     const ulHistoricoFinanceiro = document.getElementById('lista-historico');
     const ulGestao = document.getElementById('lista-gestao');

     if(!ulHistoricoFinanceiro || !ulGestao) return;

     ulHistoricoFinanceiro.innerHTML = '';
     ulGestao.innerHTML = '';
     if (!dadosGlobais || !dadosGlobais.historico) return;
     let dtInicioInput = document.getElementById('filtro-dt-inicio').value;
     let dtFimInput = document.getElementById('filtro-dt-fim').value;
     let dtInicio = parseDataBR(dtInicioInput);
     let dtFim = parseDataBR(dtFimInput);
     if (dtFim) dtFim += 86399000; 
     let temItensFin = false;
     let temItensGes = false;

     dadosGlobais.historico.forEach(h => {
        let dataTimestamp = parseDataBR(h.dataViagem || h.dataRegistro);
        let dentroDoFiltro = true;
        if (dtInicio && dataTimestamp < dtInicio) dentroDoFiltro = false;
        if (dtFim && dataTimestamp > dtFim) dentroDoFiltro = false;

        let badgeGastos = h.gastoTotal > 0 ? "<span style='background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:10px; font-size:11px; margin-left:10px;'><i class='fa-solid fa-receipt'></i> R$ " + h.gastoTotal.toFixed(2).replace('.', ',') + "</span>" : "";
        let detalhesDespesas = "";
        if (h.gastoTotal > 0 || h.kmCusto > 0) {
           detalhesDespesas = `<div style="margin-top: 10px; padding: 10px; background: #fffcf0; border: 1px dashed #fcd34d; border-radius: 6px; font-size: 11px; color: #b45309; display:flex; gap:15px; flex-wrap:wrap;">`;
           if (h.kmCusto > 0) detalhesDespesas += `<span><i class="fa-solid fa-car"></i> KM: R$ ${h.kmCusto.toFixed(2).replace('.',',')}</span>`;
           if (h.alimentacao > 0) detalhesDespesas += `<span><i class="fa-solid fa-utensils"></i> Alim: R$ ${h.alimentacao.toFixed(2).replace('.',',')}</span>`;
           if (h.hospedagem > 0) detalhesDespesas += `<span><i class="fa-solid fa-bed"></i> Hosp: R$ ${h.hospedagem.toFixed(2).replace('.',',')}</span>`;
           if (h.aereo > 0) detalhesDespesas += `<span><i class="fa-solid fa-plane"></i> Aéreo: R$ ${h.aereo.toFixed(2).replace('.',',')}</span>`;
           if (h.pedagio > 0) detalhesDespesas += `<span><i class="fa-solid fa-road"></i> Pedágio: R$ ${h.pedagio.toFixed(2).replace('.',',')}</span>`;
           if (h.estacionamento > 0) detalhesDespesas += `<span><i class="fa-solid fa-square-parking"></i> Estacion.: R$ ${h.estacionamento.toFixed(2).replace('.',',')}</span>`;
           detalhesDespesas += `</div>`;
        }
        let subTemaHtml = h.subTema ? ` - <span style="color:var(--main-color);">${h.subTema}</span>` : '';
        let linhaHtmlBase = '<div class="history-date">' + (h.dataViagem || h.dataRegistro) + ' • Lançado por: ' + h.autorNome + '</div>' +
                            '<div class="history-title">Local: ' + h.destino + ' ' + badgeGastos + '</div>' +
                            '<div class="history-desc"><strong>Motivo:</strong> ' + h.motivo + subTemaHtml + '</div>' +
                            detalhesDespesas;

        let isExternal = motivosRedirecionamento.includes(h.motivo);
        let btnAcaoGestao = "";
        if (h.isOwner || dadosGlobais.usuario.isAdmin || dadosGlobais.usuario.isSuperAdmin) {
            if (isExternal) {
                btnAcaoGestao = `<i class='fa-solid fa-lock lock-btn' title='Registro Externo: A exclusão deve ser solicitada ao Administrador.'></i>`;
            } else {
                btnAcaoGestao = `<i class='fa-solid fa-trash delete-btn' onclick="deletarHistorico('${h.id}')" title='Excluir Lançamento'></i>`;
            }
        }
        let liGes = document.createElement('li');
        liGes.className = 'history-item';
        liGes.id = 'linha-gestao-' + h.id;
        liGes.innerHTML = btnAcaoGestao + linhaHtmlBase;
        ulGestao.appendChild(liGes);
        temItensGes = true;

        if (dentroDoFiltro && h.gastoTotal > 0) {
            temItensFin = true;
            let liFin = document.createElement('li');
            liFin.className = 'history-item';
            liFin.id = 'linha-fin-' + h.id;
            liFin.innerHTML = linhaHtmlBase;
            ulHistoricoFinanceiro.appendChild(liFin);
        }
     });

     if (!temItensFin) ulHistoricoFinanceiro.innerHTML = '<li style="text-align:center;color:#64748b;padding:20px;">Nenhum registro de custo encontrado neste período.</li>';
     if (!temItensGes) ulGestao.innerHTML = '<li style="text-align:center;color:#64748b;padding:20px;">Nenhuma atividade registrada.</li>';
  }

  function deletarHistorico(id) {
     customConfirm("Excluir este lançamento permanentemente?", function() {
         let linhaG = document.getElementById('linha-gestao-' + id);
         let linhaF = document.getElementById('linha-fin-' + id);
         if (linhaG) linhaG.style.opacity = '0.5';
         if (linhaF) linhaF.style.opacity = '0.5';

         google.script.run.withSuccessHandler(function(res){
             if(res.erro) { mostrarToast(res.erro); return; }
             mostrarToast("Excluído com sucesso!");
             dadosGlobais.historico = dadosGlobais.historico.filter(h => h.id !== id);
             renderizarHistoricos();

             google.script.run.withSuccessHandler(function(newData){
                 dadosGlobais = newData;
                 atualizarCardsDashboard();
             }).obterDadosIniciais();

         }).excluirLancamento(id);
     });
  }

  function imprimirRelatorioKM() {
     if (!dadosGlobais || !dadosGlobais.historico) return mostrarToast("Sem dados para imprimir.");

     let dtInicioInput = document.getElementById('filtro-dt-inicio').value;
     let dtFimInput = document.getElementById('filtro-dt-fim').value;

     let dtInicio = parseDataBR(dtInicioInput);
     let dtFim = parseDataBR(dtFimInput);
     if (dtFim) dtFim += 86399000;
     let descPeriodo = "Todos os Períodos";
     if(dtInicioInput && dtFimInput) {
        descPeriodo = "De " + dtInicioInput.split('-').reverse().join('/') + " até " + dtFimInput.split('-').reverse().join('/');
     } else if (dtInicioInput) {
        descPeriodo = "A partir de " + dtInicioInput.split('-').reverse().join('/');
     } else if (dtFimInput) {
        descPeriodo = "Até " + dtFimInput.split('-').reverse().join('/');
     }
     let html = '<html><head><title>Relatório de Despesas e KM</title>';
     html += '<style>body{font-family:Arial,sans-serif;padding:20px;} table{width:100%;border-collapse:collapse;margin-top:20px;} th,td{border:1px solid #ddd;padding:10px;text-align:left;} th{background-color:#f4f4f4;} .header{text-align:center;margin-bottom:30px;} .total{font-size:18px;font-weight:bold;margin-top:20px;text-align:right;} .obs-box{border:1px dashed #777; height: 120px; margin-top: 30px; padding: 15px; border-radius: 8px; color: #555;}</style>';
     html += '</head><body>';
     html += '<div class="header"><h2>Relatório de Despesas de Viagem e KM</h2><p>Usuário: ' + dadosGlobais.usuario.nome + '</p><p>Período: ' + descPeriodo + '</p></div>';
     html += '<table><thead><tr><th>Data Viagem</th><th>Local</th><th>Motivo</th><th>Qtd KM</th><th>Gasto Total (R$)</th></tr></thead><tbody>';
     
     let totalGeral = 0;
     let temDados = false;
     
     let arrParaImpressao = [];
     dadosGlobais.historico.forEach(function(item) {
         let dataTimestamp = parseDataBR(item.dataViagem || item.dataRegistro);
         let dentroDoPeriodo = true;
         if (dtInicio && dataTimestamp < dtInicio) dentroDoPeriodo = false;
         if (dtFim && dataTimestamp > dtFim) dentroDoPeriodo = false;
         
         let gastoLinha = item.gastoTotal;
         if (dentroDoPeriodo && gastoLinha > 0) {
             arrParaImpressao.push({ item: item, ts: dataTimestamp });
         }
     });
     
     arrParaImpressao.sort((a, b) => a.ts - b.ts);
     
     arrParaImpressao.forEach(function(d) {
         let item = d.item;
         let gastoLinha = item.gastoTotal;
         temDados = true;
         totalGeral += gastoLinha;
         html += '<tr><td>' + (item.dataViagem || item.dataRegistro) + '</td><td>' + item.destino + '</td><td>' + item.motivo + '</td><td>' + item.kmQtd + '</td><td>R$ ' + gastoLinha.toFixed(2).replace('.', ',') + '</td></tr>';
     });
     
     html += '</tbody></table>';
     if (!temDados) {
         html += '<p style="text-align:center;margin-top:20px;">Nenhum registro de custo encontrado neste período.</p>';
     } else {
         html += '<div class="total">Total a Reembolsar: R$ ' + totalGeral.toFixed(2).replace('.', ',') + '</div>';
         html += '<div class="obs-box"><strong>Observações Extras:</strong></div>';
         html += '<br><br><p style="text-align:center;margin-top:50px;">------------------------------------<br>Assinatura Digital</p>';
     }
     html += '</body></html>';
     let win = window.open('', '', 'width=800,height=600');
     win.document.write(html);
     win.document.close();
     win.print();
     google.script.run.registrarAuditoria("Impressão KM", descPeriodo);
  }

  function renderizarListaAdmin(naturezas) {
     let ul = document.getElementById('lista-naturezas-admin');
     if(!ul) return;
     ul.innerHTML = '';
     if(!naturezas || naturezas.length === 0) {
        ul.innerHTML = '<li style="text-align:center; color:#94a3b8; font-size:12px; padding:10px;">Nenhuma natureza extra.</li>';
        return;
     }
     naturezas.forEach(n => {
         let li = document.createElement('li');
         li.className = 'history-item';
         li.innerHTML = '<span class="history-title">' + n + '</span>' +
                        '<i class="fa-solid fa-trash delete-btn" onclick="delNatureza(\''+n+'\')" title="Excluir"></i>';
         ul.appendChild(li);
     });
  }

  function addNatureza() {
     let input = document.getElementById('nova-natureza');
     let val = input.value.trim();
     if(!val) return;
     google.script.run.withSuccessHandler(function(res){
         if(res.erro) { mostrarToast(res.erro); return; }
         input.value = '';
         dadosGlobais.naturezas = res.naturezas;
         atualizarSelectNaturezas(res.naturezas);
         renderizarListaAdmin(res.naturezas);
         mostrarToast("Natureza adicionada!");
     }).adicionarNatureza(val);
  }

  function delNatureza(texto) {
     customConfirm("Tem certeza que deseja excluir a natureza '" + texto + "'?", function() {
         google.script.run.withSuccessHandler(function(res){
             if(res.erro) { mostrarToast(res.erro); return; }
             dadosGlobais.naturezas = res.naturezas;
             atualizarSelectNaturezas(res.naturezas);
             renderizarListaAdmin(res.naturezas);
             mostrarToast("Natureza removida!");
         }).excluirNatureza(texto);
     });
  }
</script>
