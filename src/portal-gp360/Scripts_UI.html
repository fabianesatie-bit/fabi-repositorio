<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_UI.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  function mudarAba(abaId, element) {
    var abas = document.querySelectorAll('.view-aba');
    abas.forEach(function(a) { a.classList.add('d-none'); });

    var links = document.querySelectorAll('.nav-link-custom');
    links.forEach(function(l) { l.classList.remove('active'); });

    document.getElementById(abaId).classList.remove('d-none');
    if (element) element.classList.add('active');

    if (abaId === 'aba-galeria') carregarGaleriaEvidencias();
  }

  function renderizarInterfaceCompleta() {
    var u = dadosGlobais.usuario;
    document.getElementById('user-nome-display').innerText = u.nome;
    document.getElementById('user-cargo-display').innerText = u.cargo + ' (' + u.nivelAcesso + ')';
    document.getElementById('user-regional-display').innerText = 'Regionais: ' + u.regionais.join(', ');

    if (!u.isAdmin) {
      var btnAdmin = document.getElementById('menu-admin');
      if (btnAdmin) btnAdmin.classList.add('d-none');
    }

    povoarDropdownsFormulario();
    atualizarCardsGamificacao();
    renderizarRankingTop5();
    renderizarMuralAvisos();
    renderizarTimelineAtividades();
    renderizarGestaoTemasAdmin();
  }

  function povoarDropdownsFormulario() {
    var selFilial = document.getElementById('select-filial');
    selFilial.innerHTML = '<option value="">Selecione a loja...</option>';
    dadosGlobais.lojas.forEach(function(l) {
      selFilial.innerHTML += '<option value="' + l.id + '">' + l.id + ' - ' + l.nome + ' (' + l.regional + ')</option>';
    });

    var selNat = document.getElementById('select-natureza');
    selNat.innerHTML = '<option value="">Selecione a natureza...</option>';
    dadosGlobais.naturezas.forEach(function(n) {
      selNat.innerHTML += '<option value="' + n + '">' + n + '</option>';
    });
  }

  function verificarCamposDinamicos() {
    var nat = document.getElementById('select-natureza').value;
    var boxTema = document.getElementById('box-tema-dinamico');
    var selTema = document.getElementById('select-tema-dinamico');
    var lblTema = document.getElementById('label-tema-dinamico');

    var isReuniao = nat.toLowerCase().includes('reunião') || nat.toLowerCase().includes('reuniao');
    var isTreinamento = nat.toLowerCase().includes('treinamento');

    if (isReuniao || isTreinamento) {
      boxTema.classList.remove('d-none');
      selTema.innerHTML = '<option value="">Selecione o tema...</option>';
      lblTema.innerText = isReuniao ? 'Tema da Reunião Regional' : 'Tema do Treinamento';

      var lista = isReuniao ? dadosGlobais.temas.reuniao : dadosGlobais.temas.treinamento;
      lista.forEach(function(t) {
        selTema.innerHTML += '<option value="' + t + '">' + t + '</option>';
      });
    } else {
      boxTema.classList.add('d-none');
      selTema.innerHTML = '<option value="">Selecione o tema...</option>';
    }
  }

  function atualizarCardsGamificacao() {
    var g = dadosGlobais.gamificacao;
    document.getElementById('kpi-moedas-mes').innerText = g.moedasMes;
    document.getElementById('kpi-moedas-totais').innerText = g.moedasTotais;
    document.getElementById('kpi-filiais-visitadas').innerText = g.filiaisVisitadas;
    document.getElementById('kpi-everest-progresso').innerText = g.percentualEverest + '%';

    var bar = document.getElementById('bar-everest');
    bar.style.width = g.percentualEverest + '%';
    bar.innerText = g.percentualEverest + '%';
  }

  function renderizarRankingTop5() {
    var lista = document.getElementById('lista-ranking');
    lista.innerHTML = '';
    var r = dadosGlobais.gamificacao.ranking;

    if (!r || r.length === 0) {
      lista.innerHTML = '<li class="list-group-item text-muted">Nenhum registro no período.</li>';
      return;
    }

    r.forEach(function(item, index) {
      var badgeClass = index === 0 ? 'bg-warning text-dark' : (index === 1 ? 'bg-secondary text-white' : 'bg-dark text-white');
      lista.innerHTML += '<li class="list-group-item d-flex justify-content-between align-items-center">' +
        '<div><span class="badge ' + badgeClass + ' me-2">#' + (index + 1) + '</span>' + item.email + '</div>' +
        '<span class="fw-bold text-primary">' + item.mes + ' moedas</span>' +
        '</li>';
    });
  }

  function renderizarMuralAvisos() {
    var container = document.getElementById('mural-avisos-container');
    container.innerHTML = '';
    if (!dadosGlobais.avisos || dadosGlobais.avisos.length === 0) {
      container.innerHTML = '<div class="alert alert-light border">Nenhum aviso publicado.</div>';
      return;
    }
    dadosGlobais.avisos.forEach(function(a) {
      container.innerHTML += '<div class="alert alert-info mb-1 py-2 px-3"><strong>' + a.autor + ' (' + a.data + '):</strong> ' + a.mensagem + '</div>';
    });
  }

  function renderizarTimelineAtividades() {
    var container = document.getElementById('timeline-atividades');
    container.innerHTML = '';
    if (!dadosGlobais.lancamentos || dadosGlobais.lancamentos.length === 0) {
      container.innerHTML = '<div class="alert alert-light border">Nenhuma atividade localizada no período.</div>';
      return;
    }

    dadosGlobais.lancamentos.forEach(function(l) {
      var evTag = l.evidenciaUrl ? '<a href="' + l.evidenciaUrl + '" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-paperclip"></i> Evidência</a>' : '';
      container.innerHTML += '<div class="bento-card d-flex justify-content-between align-items-center">' +
        '<div>' +
          '<h6 class="fw-bold mb-1">' + l.filial + ' - ' + l.lojaNome + ' <span class="badge bg-secondary">' + l.motivo + '</span></h6>' +
          '<small class="text-muted">' + l.data + ' • Autor: ' + l.autor + (l.tema ? ' • Tema: ' + l.tema : '') + '</small>' +
          (l.observacao ? '<p class="mb-0 mt-1 small text-dark">' + l.observacao + '</p>' : '') +
        '</div>' +
        '<div>' + evTag + '</div>' +
      '</div>';
    });
  }

  function renderizarGestaoTemasAdmin() {
    var container = document.getElementById('container-lista-temas');
    container.innerHTML = '';

    var t = dadosGlobais.temas;
    var html = '<div class="col-md-6"><h6 class="fw-bold text-primary">Reunião Regional</h6><ul class="list-group">';
    t.reuniao.forEach(function(item) {
      html += '<li class="list-group-item d-flex justify-content-between align-items-center">' + item + 
        '<button class="btn btn-sm btn-outline-danger" onclick="deletarTemaAdmin(\'REUNIAO_REGIONAL\', \'' + item + '\')"><i class="bi bi-trash"></i></button></li>';
    });
    html += '</ul></div><div class="col-md-6"><h6 class="fw-bold text-success">Treinamento</h6><ul class="list-group">';
    t.treinamento.forEach(function(item) {
      html += '<li class="list-group-item d-flex justify-content-between align-items-center">' + item + 
        '<button class="btn btn-sm btn-outline-danger" onclick="deletarTemaAdmin(\'TREINAMENTO\', \'' + item + '\')"><i class="bi bi-trash"></i></button></li>';
    });
    html += '</ul></div>';

    container.innerHTML = html;
  }

  function carregarGaleriaEvidencias() {
    var grid = document.getElementById('grid-galeria');
    grid.innerHTML = '<div class="col-12 text-center py-4"><span class="spinner-border text-primary"></span> Carregando evidências...</div>';

    google.script.run
      .withSuccessHandler(function(fotos) {
        grid.innerHTML = '';
        if (!fotos || fotos.length === 0) {
          grid.innerHTML = '<div class="col-12"><div class="alert alert-light border">Nenhuma imagem localizada.</div></div>';
          return;
        }
        fotos.forEach(function(f) {
          grid.innerHTML += '<div class="col-md-4 col-lg-3">' +
            '<div class="bento-card p-2 text-center">' +
              '<img src="' + f.thumbUrl + '" class="img-fluid rounded mb-2" style="max-height: 180px; object-fit: cover;">' +
              '<small class="d-block fw-bold">' + f.loja + '</small>' +
              '<small class="text-muted d-block">' + f.data + ' • ' + f.motivo + '</small>' +
              '<a href="' + f.url + '" target="_blank" class="btn btn-sm btn-light border mt-2 w-100">Abrir Imagem</a>' +
            '</div>' +
          '</div>';
        });
      })
      .getEvidenciasUsuario();
  }

  function dispararConfetesFestao() {
    if (typeof confetti !== 'function') return;

    var coresMarca = ['#FBE53B', '#FF8A00', '#FF253A', '#FF14B3', '#8000FF', '#0087FF', '#5EB5FF', '#17F036'];

    // Estágio 1: Esquerda
    confetti({
      particleCount: 80,
      angle: 60,
      spread: 70,
      origin: { x: 0, y: 0.7 },
      colors: coresMarca
    });

    // Estágio 2: Direita (após 250ms)
    setTimeout(function() {
      confetti({
        particleCount: 80,
        angle: 120,
        spread: 70,
        origin: { x: 1, y: 0.7 },
        colors: coresMarca
      });
    }, 250);

    // Estágio 3: Festões caindo do centro (após 500ms)
    setTimeout(function() {
      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.3 },
        colors: coresMarca,
        scalar: 1.2
      });
    }, 500);
  }

  function abrirModalCelebracao(msg) {
    document.getElementById('celebracao-mensagem').innerText = msg;
    var modal = new bootstrap.Modal(document.getElementById('modal-celebracao'));
    modal.show();
  }
</script>
