<script>
  /**
   * ECOSSISTEMA GP360 - PORTAL GP 360
   * Arquivo: Scripts_UI.html
   * Subpasta Monorepo: src/portal-gp360/
   */

  var meuGraficoAtividades = null;
  var temasReuniaoSelecionados = [];

  function obterDataRawSegura(dataValor) {
    if (!dataValor) return 0;
    try {
      if (dataValor instanceof Date) return dataValor.getTime();
      var parts = String(dataValor).split('/');
      if (parts.length === 3) {
        var d = new Date(parts[2], parts[1] - 1, parts[0]);
        return d.getTime();
      }
      var d2 = new Date(dataValor);
      return isNaN(d2.getTime()) ? 0 : d2.getTime();
    } catch (e) {
      return 0;
    }
  }

  function gerarAvatarSVG(nome) {
    var inis = 'GP';
    if (nome) {
      var partes = String(nome).trim().split(' ');
      inis = partes[0].charAt(0).toUpperCase();
      if (partes.length > 1) inis += partes[partes.length - 1].charAt(0).toUpperCase();
    }
    return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><rect width='80' height='80' fill='%230087FF'/><text x='50%' y='55%' font-size='30' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>" + inis + "</text></svg>";
  }

  function mostrarToast(mensagem, tipo) {
    var container = document.getElementById('toast-container');
    if (!container) return;

    var bgClass = 'bg-dark text-white';
    var icon = 'bi-info-circle-fill text-info';
    if (tipo === 'success') { bgClass = 'bg-success text-white'; icon = 'bi-check-circle-fill text-white'; }
    if (tipo === 'danger') { bgClass = 'bg-danger text-white'; icon = 'bi-exclamation-triangle-fill text-white'; }

    var toastHtml = '<div class="toast-custom ' + bgClass + '">' +
      '<i class="bi ' + icon + ' fs-5"></i>' +
      '<span>' + mensagem + '</span>' +
    '</div>';

    var elem = document.createElement('div');
    elem.innerHTML = toastHtml;
    var toastNode = elem.firstChild;
    container.appendChild(toastNode);

    setTimeout(function() {
      if (toastNode && toastNode.parentNode) {
        toastNode.parentNode.removeChild(toastNode);
      }
    }, 4000);
  }

  function ativarDropzoneClipboard(elem) {
    elem.focus();
    var txt = document.getElementById('txt-dropzone');
    if (txt) txt.innerText = 'Pronto! Aperte Ctrl+V para colar sua imagem agora';

    if (navigator.clipboard && navigator.clipboard.read) {
      navigator.clipboard.read().then(function(items) {
        for (var i = 0; i < items.length; i++) {
          for (var j = 0; j < items[i].types.length; j++) {
            if (items[i].types[j].indexOf('image') !== -1) {
              items[i].getType(items[i].types[j]).then(function(blob) {
                var reader = new FileReader();
                reader.onload = function(e) {
                  document.getElementById('input-evidencia-url').value = e.target.result;
                  if (txt) txt.innerText = '✓ Imagem colada com sucesso da área de transferência!';
                  mostrarToast('Imagem capturada do Clipboard!', 'success');
                };
                reader.readAsDataURL(blob);
              });
            }
          }
        }
      }).catch(function(e) {});
    }
  }

  document.addEventListener('paste', function(e) {
    var items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (var index in items) {
      var item = items[index];
      if (item.kind === 'file') {
        var blob = item.getAsFile();
        var reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('input-evidencia-url').value = event.target.result;
          var txt = document.getElementById('txt-dropzone');
          if (txt) txt.innerText = '✓ Imagem colada com sucesso via Ctrl+V!';
          mostrarToast('Imagem colada com sucesso!', 'success');
        };
        reader.readAsDataURL(blob);
      }
    }
  });

  function mudarAba(abaId, element) {
    var abas = document.querySelectorAll('.view-aba');
    abas.forEach(function(a) { a.classList.add('d-none'); });

    var links = document.querySelectorAll('.nav-btn-card');
    links.forEach(function(l) { l.classList.remove('active'); });

    var targetAba = document.getElementById(abaId);
    if (targetAba) targetAba.classList.remove('d-none');
    if (element) element.classList.add('active');

    if (abaId === 'aba-galeria') carregarGaleriaEvidencias();
    if (abaId === 'aba-historico') renderizarHistoricos();
    if (abaId === 'aba-gestao') renderizarTimelineAtividades();
  }

  function abrirPainelInternoEmbutido(url, titulo) {
    var titleElem = document.getElementById('titulo-painel-embutido');
    if (titleElem) titleElem.innerText = titulo;
    var iframe = document.getElementById('iframe-painel-embutido-src');
    if (iframe) iframe.src = url;
    var container = document.getElementById('container-embutido-painel');
    if (container) {
      container.classList.remove('d-none');
      container.scrollIntoView({ behavior: 'smooth' });
    }
  }

  function fecharPainelEmbutido() {
    var iframe = document.getElementById('iframe-painel-embutido-src');
    if (iframe) iframe.src = 'about:blank';
    var container = document.getElementById('container-embutido-painel');
    if (container) container.classList.add('d-none');
  }

  function renderizarInterfaceCompleta() {
    var u = dadosGlobais.usuario || {};
    var nameElem = document.getElementById('user-nome-display');
    if (nameElem) nameElem.innerText = u.nome || 'Usuário GP';
    var cargoElem = document.getElementById('user-cargo-display');
    if (cargoElem) cargoElem.innerText = (u.cargo || 'Colaborador') + ' (' + (u.nivelAcesso || '') + ')';

    var boxRegionais = document.getElementById('user-regional-display');
    if (boxRegionais) {
      boxRegionais.innerHTML = '';
      if (u.regionais && u.regionais.length > 0) {
        u.regionais.forEach(function(reg) {
          boxRegionais.innerHTML += '<span class="regional-pill">' + reg + '</span>';
        });
      } else {
        boxRegionais.innerHTML = '<span class="regional-pill bg-success-subtle text-success border-success">Visão Nacional</span>';
      }
    }

    var imgUser = document.getElementById('user-avatar-img');
    if (imgUser) {
      if (u.fotoUrl && u.fotoUrl.length > 20) {
        imgUser.src = u.fotoUrl;
      } else {
        imgUser.src = gerarAvatarSVG(u.nome);
      }
    }

    if (!u.isAdmin) {
      var btnAdmin = document.getElementById('menu-admin');
      if (btnAdmin) btnAdmin.classList.add('d-none');
    }

    var kpiLojas = document.getElementById('kpi-lojas-carteira');
    if (kpiLojas) kpiLojas.innerText = dadosGlobais.lojasCarteiraTotal || 0;
    var kpiVisitas = document.getElementById('kpi-visitas-loco');
    if (kpiVisitas) kpiVisitas.innerText = dadosGlobais.visitasInLocoMes || 0;
    
    var valReembolso = dadosGlobais.reembolsoEstimadoMes || 0;
    var kpiReembolso = document.getElementById('kpi-reembolso-mes');
    if (kpiReembolso) kpiReembolso.innerText = 'R$ ' + valReembolso.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

    povoarDropdownsFormulario();
    atualizarCardsGamificacao();
    renderizarRankingTop5();
    renderizarGraficoAtividades();
    renderizarListaNaturezasAdmin();
    renderizarGestaoTemasAdmin();
  }

  function renderizarGraficoAtividades() {
    var ctx = document.getElementById('chart-atividades');
    if (!ctx) return;

    var mapa = dadosGlobais.distribuicaoAtividades || {};
    var labels = Object.keys(mapa);
    var valores = Object.values(mapa);

    if (labels.length === 0) {
      labels = ['Sem registros no período'];
      valores = [1];
    }

    if (meuGraficoAtividades) meuGraficoAtividades.destroy();

    meuGraficoAtividades = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: valores,
          backgroundColor: ['#0087FF', '#FF8A00', '#17F036', '#FF253A', '#8000FF', '#FBE53B', '#5EB5FF', '#FF14B3']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  function povoarDropdownsFormulario() {
    var selFilial = document.getElementById('select-filial');
    if (selFilial) {
      selFilial.innerHTML = '<option value="">Selecione a loja...</option>';
      (dadosGlobais.lojas || []).forEach(function(l) {
        selFilial.innerHTML += '<option value="' + l.id + '">' + l.id + ' - ' + l.nome + ' (' + l.regional + ')</option>';
      });
    }

    var selNat = document.getElementById('select-natureza');
    if (selNat) {
      selNat.innerHTML = '<option value="">Selecione a natureza...</option>';
      var naturezasOrdenadas = (dadosGlobais.naturezas || []).slice().sort(function(a, b) {
        return a.localeCompare(b, 'pt-BR');
      });
      naturezasOrdenadas.forEach(function(n) {
        selNat.innerHTML += '<option value="' + n + '">' + n + '</option>';
      });
    }

    var containerChips = document.getElementById('chips-container-reuniao');
    if (containerChips) {
      containerChips.innerHTML = '';
      var listaReuniao = (dadosGlobais.temas && dadosGlobais.temas.reuniao) ? dadosGlobais.temas.reuniao : ['NPS', 'GMD', 'Banco de Horas', 'PCD', 'Quadro', 'Lixo Eletrônico', 'Campanha Sazonais', 'Agente Integrador'];
      listaReuniao.forEach(function(t) {
        containerChips.innerHTML += '<span class="chip-tema" onclick="toggleChipTema(this, \'' + t + '\')">' + t + '</span>';
      });
    }

    var selTreinamento = document.getElementById('select-tema-treinamento');
    if (selTreinamento) {
      selTreinamento.innerHTML = '<option value="">Selecione o tema...</option>';
      var listaTreinamento = (dadosGlobais.temas && dadosGlobais.temas.treinamento) ? dadosGlobais.temas.treinamento : ['Liderança', 'Assédio', 'Jurídico', 'Auditoria', 'Integração', 'Atendimento 10 estrelas', 'Motivacional', 'Feedback', 'Inegociáveis', 'Apontamento'];
      listaTreinamento.forEach(function(t) {
        selTreinamento.innerHTML += '<option value="' + t + '">' + t + '</option>';
      });
    }
  }

  function toggleChipTema(elem, tema) {
    elem.classList.toggle('selected');
    var idx = temasReuniaoSelecionados.indexOf(tema);
    if (idx > -1) temasReuniaoSelecionados.splice(idx, 1);
    else temasReuniaoSelecionados.push(tema);
  }

  function alternarEscopoAtendimento() {
    var escopo = document.getElementById('select-escopo-atendimento').value;
    var boxFilial = document.getElementById('box-destino-filial');
    if (boxFilial) {
      if (escopo === 'FILIAL') boxFilial.classList.remove('d-none');
      else boxFilial.classList.add('d-none');
    }
  }

  function verificarCamposDinamicos() {
    var nat = document.getElementById('select-natureza').value.toLowerCase();
    var boxReuniao = document.getElementById('box-temas-reuniao');
    var boxTreinamento = document.getElementById('box-tema-treinamento');

    if (boxReuniao) boxReuniao.classList.add('d-none');
    if (boxTreinamento) boxTreinamento.classList.add('d-none');

    if (nat.includes('reunião') || nat.includes('reuniao')) {
      if (boxReuniao) boxReuniao.classList.remove('d-none');
    } else if (nat.includes('treinamento')) {
      if (boxTreinamento) boxTreinamento.classList.remove('d-none');
    }
  }

  function calcularDespesas() {
    var rate = parseFloat(document.getElementById('input-rate-km').value) || 1.20;
    var km = parseFloat(document.getElementById('input-km').value) || 0;
    var custoKm = km * rate;
    var displayKm = document.getElementById('display-custo-km');
    if (displayKm) displayKm.value = custoKm.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

    var ali = parseFloat(document.getElementById('input-alimentacao').value) || 0;
    var hos = parseFloat(document.getElementById('input-hospedagem').value) || 0;
    var aer = parseFloat(document.getElementById('input-aereo').value) || 0;
    var ped = parseFloat(document.getElementById('input-pedagio').value) || 0;
    var est = parseFloat(document.getElementById('input-estacionamento').value) || 0;

    var total = custoKm + ali + hos + aer + ped + est;
    var displayTotal = document.getElementById('display-gasto-total');
    if (displayTotal) displayTotal.innerText = 'Gasto Total: R$ ' + total.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  function calcularDespesasAvulso() {
    var rate = parseFloat(document.getElementById('avulso-rate').value) || 1.20;
    var km = parseFloat(document.getElementById('avulso-km').value) || 0;
    var custoKm = km * rate;

    var ali = parseFloat(document.getElementById('avulso-alimentacao').value) || 0;
    var hos = parseFloat(document.getElementById('avulso-hospedagem').value) || 0;
    var aer = parseFloat(document.getElementById('avulso-aereo').value) || 0;
    var ped = parseFloat(document.getElementById('avulso-pedagio').value) || 0;
    var est = parseFloat(document.getElementById('avulso-estacionamento').value) || 0;

    var total = custoKm + ali + hos + aer + ped + est;
    var displayAvulso = document.getElementById('avulso-display-total');
    if (displayAvulso) displayAvulso.innerText = 'Gasto Total: R$ ' + total.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  }

  function alternarFormularioKMAvulso() {
    var box = document.getElementById('box-form-km-avulso');
    if (box) box.classList.toggle('d-none');
  }

  function limparOutrasEvidencias(origem) {
    if (origem !== 'file') document.getElementById('input-evidencia-file').value = '';
    if (origem !== 'url') document.getElementById('input-evidencia-url').value = '';
  }

  function atualizarCardsGamificacao() {
    var g = dadosGlobais.gamificacao || {};
    var moedasMesElem = document.getElementById('kpi-moedas-mes');
    if (moedasMesElem) moedasMesElem.innerText = g.moedasMes || 0;
    var moedasTotElem = document.getElementById('kpi-moedas-totais');
    if (moedasTotElem) moedasTotElem.innerText = g.moedasTotais || 0;
    var badgeFaseElem = document.getElementById('badge-fase-nome');
    if (badgeFaseElem) badgeFaseElem.innerText = g.faseNome || '⛺ Fase 1: Acampamento Base';

    var iconeVisual = '🥾';
    if (g.faseNome && g.faseNome.includes('Fase 4')) iconeVisual = '🚩';
    else if (g.faseNome && g.faseNome.includes('Fase 3')) iconeVisual = '🏔️';
    else if (g.faseNome && g.faseNome.includes('Fase 2')) iconeVisual = '🧗';
    var iconeElem = document.getElementById('icone-fase-visual');
    if (iconeElem) iconeElem.innerText = iconeVisual;
  }

  function renderizarRankingTop5() {
    var lista = document.getElementById('lista-ranking');
    if (!lista) return;
    lista.innerHTML = '';
    var r = (dadosGlobais.gamificacao && dadosGlobais.gamificacao.ranking) ? dadosGlobais.gamificacao.ranking : [];

    // Filtra exclusivamente usuarios que possuem mais de 0 moedas no mes selecionado
    r = r.filter(function(item) {
      return (item.mes || 0) > 0;
    });

    if (!r || r.length === 0) {
      lista.innerHTML = '<li class="list-group-item text-muted py-3 text-center border-0">' +
        '<i class="bi bi-info-circle me-1 text-primary"></i> Nenhum colaborador possui moedas computadas no período selecionado.' +
      '</li>';
      return;
    }

    r.forEach(function(item, index) {
      var badgePos = '<span class="fw-bold me-3 fs-5 text-secondary" style="width:24px; display:inline-block;">#' + (index + 1) + '</span>';
      if (index === 0) badgePos = '<span class="fw-bold text-warning me-3 fs-4">1º</span>';
      else if (index === 1) badgePos = '<span class="fw-bold text-secondary me-3 fs-4">2º</span>';
      else if (index === 2) badgePos = '<span class="fw-bold text-danger me-3 fs-4">3º</span>';

      var faseTag = '<span class="badge bg-light text-primary border me-2">⛺ Fase 1: Acampamento Base</span>';
      if (item.mes >= 100) faseTag = '<span class="badge bg-success text-white border me-2">🚩 ⚡ Fase 4: Bandeira no Everest!</span>';
      else if (item.mes >= 75) faseTag = '<span class="badge bg-info text-white border me-2">🏔️ Fase 3: Cume Alcançado</span>';
      else if (item.mes >= 40) faseTag = '<span class="badge bg-warning text-dark border me-2">🧗 Fase 2: Subida da Montanha</span>';

      var avatarSrc = (item.foto && item.foto.length > 20) ? item.foto : gerarAvatarSVG(item.email);

      lista.innerHTML += '<li class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-bottom">' +
        '<div class="d-flex align-items-center">' +
          badgePos +
          '<img src="' + avatarSrc + '" class="rounded-circle me-3 border" style="width:42px; height:42px; object-fit:cover;" onerror="this.src=gerarAvatarSVG(\'' + item.email + '\');">' +
          '<div>' +
            '<div class="fw-bold text-dark mb-1">' + item.email + '</div>' +
            '<div>' + faseTag + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="fw-bold fs-5 text-primary"><i class="bi bi-coin text-warning me-1"></i>' + item.mes + ' <small class="fs-6 text-muted">moedas</small></div>' +
      '</li>';
    });
  }

  function renderizarTimelineAtividades() {
    var container = document.getElementById('timeline-atividades');
    if (!container) return;
    container.innerHTML = '';
    var l = dadosGlobais.lancamentos || [];

    if (l.length === 0) {
      container.innerHTML = '<div class="alert alert-light border">Nenhuma atividade registrada no período.</div>';
      return;
    }

    var u = dadosGlobais.usuario || {};

    l.forEach(function(item) {
      var localStr = item.filial ? ('Local: ' + item.filial) : ('Local: AVULSO');
      var podeExcluir = (u.isSuperAdmin || (item.autor && item.autor.toLowerCase() === (u.email || '').toLowerCase()));

      var btnDeleteHtml = podeExcluir ? 
        '<button class="btn btn-sm btn-outline-danger border-0" onclick="deletarHistorico(\'' + item.id + '\')"><i class="bi bi-trash fs-5"></i></button>' : 
        '<i class="bi bi-lock-fill text-muted" title="Sem permissão para excluir"></i>';

      var motLower = String(item.motivo || '').toLowerCase();
      var statusBadge = '';

      if (motLower.includes('atendimento social') || motLower.includes('apuraç') || motLower.includes('apurac') || motLower.includes('feedback') || motLower.includes('acompanhamento')) {
        if (item.statusValidacao === 'VALIDADO' || item.validadoEspecialista) {
          statusBadge = '<span class="badge bg-success-subtle text-success border border-success me-2"><i class="bi bi-patch-check-fill me-1"></i> VALIDADO NA PLANILHA ESPECIALISTA</span>';
        } else {
          statusBadge = '<span class="badge bg-warning-subtle text-warning border border-warning text-dark me-2"><i class="bi bi-clock-history me-1"></i> PENDENTE REGISTRO EXTERNO</span>';
        }
      }

      container.innerHTML += '<div class="bento-card p-3 border-start border-4 border-primary shadow-sm mb-2">' +
        '<div class="d-flex justify-content-between align-items-start mb-1">' +
          '<small class="text-muted">' + item.data + ' • Lançado por: ' + (item.autor || 'Usuário GP') + '</small>' +
          btnDeleteHtml +
        '</div>' +
        '<h6 class="fw-bold text-dark mb-1">' + localStr + '</h6>' +
        '<div class="small text-secondary mb-2">' + statusBadge + '<strong>Motivo:</strong> ' + item.motivo + (item.tema ? ' (' + item.tema + ')' : '') + (item.observacao ? ' - ' + item.observacao : '') + '</div>' +
      '</div>';
    });
  }

  function renderizarHistoricos() {
    var container = document.getElementById('tabela-extrato-container');
    if (!container) return;
    container.innerHTML = '';
    var l = (dadosGlobais.lancamentos || []).slice();

    // Filtro Rígido: Exibir apenas lançamentos com custo total calculado maior que zero
    l = l.filter(function(item) {
      return (parseFloat(item.custoTotal) || 0) > 0;
    });

    var dtInicio = document.getElementById('filtro-extrato-inicio').value;
    var dtFim = document.getElementById('filtro-extrato-fim').value;

    if (dtInicio || dtFim) {
      l = l.filter(function(item) {
        var rawDt = obterDataRawSegura(item.data);
        var rawIni = dtInicio ? new Date(dtInicio).getTime() : 0;
        var rawFim = dtFim ? new Date(dtFim).getTime() : Infinity;
        return rawDt >= rawIni && rawDt <= rawFim;
      });
    }

    if (l.length === 0) {
      container.innerHTML = '<div class="alert alert-light border">Nenhum reembolso/despesa localizado no período selecionado.</div>';
      return;
    }

    l.forEach(function(item) {
      var localStr = item.filial ? ('Local: ' + item.filial) : ('Local: AVULSO');
      var valKmStr = 'R$ ' + (item.custoTotal || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

      container.innerHTML += '<div class="bento-card p-3 border-start border-4 border-primary shadow-sm mb-2">' +
        '<div class="d-flex justify-content-between text-muted small mb-1">' +
          '<span>' + item.data + ' • Lançado por: ' + (item.autor || 'Usuário GP') + '</span>' +
        '</div>' +
        '<h6 class="fw-bold text-dark mb-1">' + localStr + ' <span class="badge bg-warning text-dark ms-2">' + valKmStr + '</span></h6>' +
        '<div class="small text-secondary mb-2">Motivo: ' + item.motivo + (item.observacao ? ' - ' + item.observacao : '') + '</div>' +
        '<div class="p-2 bg-warning-subtle rounded border border-warning-subtle text-dark small fw-bold">' +
          '<i class="bi bi-car-front me-1"></i> KM/Despesas: ' + valKmStr +
        '</div>' +
      '</div>';
    });
  }

  function imprimirRelatorioKM() {
    var u = (dadosGlobais.usuario && dadosGlobais.usuario.nome) ? dadosGlobais.usuario.nome : 'Usuário GP';
    var l = (dadosGlobais.lancamentos || []).slice();

    l = l.filter(function(item) {
      return (parseFloat(item.custoTotal) || 0) > 0;
    });

    var dtInicio = document.getElementById('filtro-extrato-inicio').value;
    var dtFim = document.getElementById('filtro-extrato-fim').value;

    if (dtInicio || dtFim) {
      l = l.filter(function(item) {
        var rawDt = obterDataRawSegura(item.data);
        var rawIni = dtInicio ? new Date(dtInicio).getTime() : 0;
        var rawFim = dtFim ? new Date(dtFim).getTime() : Infinity;
        return rawDt >= rawIni && rawDt <= rawFim;
      });
    }

    var mSel = document.getElementById('seletor-mes').value;
    var aSel = document.getElementById('seletor-ano').value;
    var periodoStr = mSel + '/' + aSel;

    l.sort(function(a, b) {
      return obterDataRawSegura(a.data) - obterDataRawSegura(b.data);
    });

    var win = window.open('', '_blank');
    var html = '<html><head><title>Relatório de Despesas de Viagem e KM</title>' +
      '<style>' +
      'body { font-family: Arial, sans-serif; padding: 20px; color: #111; }' +
      'h2 { text-align: center; margin-bottom: 5px; }' +
      'p { text-align: center; margin: 3px 0; color: #555; }' +
      'table { width: 100%; border-collapse: collapse; margin-top: 20px; }' +
      'th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }' +
      'th { background-color: #f2f2f2; font-weight: bold; }' +
      '.total-col { font-weight: bold; }' +
      '</style></head><body>' +
      '2 Relatório de Despesas de Viagem e KM</h2>' +
      '<p>Usuário: <strong>' + u.toUpperCase() + '</strong></p>' +
      '<p>Período: <strong>' + periodoStr + '</strong></p>' +
      '<table><thead><tr>' +
      '<th>Data Viagem</th><th>Local</th><th>Motivo</th><th>Qtd KM</th><th>Gasto Total (R$)</th>' +
      '</tr></thead><tbody>';

    l.forEach(function(item) {
      html += '<tr>' +
        '<td>' + item.data + '</td>' +
        '<td>' + (item.filial || 'AVULSO') + '</td>' +
        '<td>' + item.motivo + '</td>' +
        '<td>' + (item.kmPercorrido || 0) + '</td>' +
        '<td class="total-col">R$ ' + (item.custoTotal || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) + '</td>' +
        '</tr>';
    });

    html += '</tbody></table></body></html>';

    win.document.write(html);
    win.document.close();
    win.print();
  }

  function renderizarListaNaturezasAdmin() {
    var container = document.getElementById('container-lista-naturezas');
    if (!container) return;
    container.innerHTML = '';

    var nats = dadosGlobais.naturezas || [];
    nats.forEach(function(nat) {
      container.innerHTML += '<div class="bento-card p-2 d-flex justify-content-between align-items-center mb-1 border-start border-3 border-primary">' +
        '<span class="fw-semibold text-dark">' + nat + '</span>' +
        '<button class="btn btn-sm btn-outline-danger" onclick="delNatureza(\'' + nat + '\')"><i class="bi bi-trash"></i></button>' +
      '</div>';
    });
  }

  function renderizarGestaoTemasAdmin() {
    var container = document.getElementById('container-lista-temas');
    if (!container) return;
    container.innerHTML = '';

    var t = dadosGlobais.temas || { reuniao: [], treinamento: [] };
    var html = '<div class="row"><div class="col-md-6"><h6 class="fw-bold text-primary">Reunião Regional</h6><ul class="list-group">';
    (t.reuniao || []).forEach(function(item) {
      html += '<li class="list-group-item d-flex justify-content-between align-items-center">' + item + 
        '<button class="btn btn-sm btn-outline-danger" onclick="deletarTemaAdmin(\'REUNIAO_REGIONAL\', \'' + item + '\')"><i class="bi bi-trash"></i></button></li>';
    });
    html += '</ul></div><div class="col-md-6"><h6 class="fw-bold text-success">Treinamento</h6><ul class="list-group">';
    (t.treinamento || []).forEach(function(item) {
      html += '<li class="list-group-item d-flex justify-content-between align-items-center">' + item + 
        '<button class="btn btn-sm btn-outline-danger" onclick="deletarTemaAdmin(\'TREINAMENTO\', \'' + item + '\')"><i class="bi bi-trash"></i></button></li>';
    });
    html += '</ul></div></div>';

    container.innerHTML = html;
  }

  function limparFiltroDatas() {
    document.getElementById('filtro-extrato-inicio').value = '';
    document.getElementById('filtro-extrato-fim').value = '';
    renderizarHistoricos();
  }

  function carregarGaleriaEvidencias() {
    var grid = document.getElementById('grid-galeria');
    if (!grid) return;
    grid.innerHTML = '<div class="col-12 text-center py-4"><span class="spinner-border text-primary"></span> Carregando evidências...</div>';

    var mSel = document.getElementById('seletor-mes');
    var aSel = document.getElementById('seletor-ano');
    var m = mSel ? mSel.value : '';
    var a = aSel ? aSel.value : '';

    google.script.run
      .withSuccessHandler(function(fotos) {
        grid.innerHTML = '';
        if (!fotos || fotos.length === 0) {
          grid.innerHTML = '<div class="col-12"><div class="alert alert-light border">Nenhuma imagem localizada no período selecionado.</div></div>';
          return;
        }
        fotos.forEach(function(f) {
          grid.innerHTML += '<div class="col-md-4 col-lg-3">' +
            '<div class="bento-card p-2 text-center">' +
              '<img src="' + f.thumbUrl + '" class="img-fluid rounded mb-2" style="max-height: 180px; object-fit: cover; width:100%;" onerror="this.src=gerarAvatarSVG(\'Galeria\');">' +
              '<small class="d-block fw-bold">' + f.loja + '</small>' +
              '<small class="text-muted d-block">' + f.data + ' • ' + f.motivo + '</small>' +
              '<a href="' + f.url + '" target="_blank" class="btn btn-sm btn-light border mt-2 w-100">Abrir Imagem</a>' +
            '</div>' +
          '</div>';
        });
      })
      .getEvidenciasUsuario(m, a);
  }

  function dispararConfetesFestao() {
    if (typeof confetti !== 'function') return;
    var coresMarca = ['#FBE53B', '#FF8A00', '#FF253A', '#FF14B3', '#8000FF', '#0087FF', '#5EB5FF', '#17F036'];
    confetti({ particleCount: 80, angle: 60, spread: 70, origin: { x: 0, y: 0.7 }, colors: coresMarca });
    setTimeout(function() {
      confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.7 }, colors: coresMarca });
    }, 250);
    setTimeout(function() {
      confetti({ particleCount: 120, spread: 100, origin: { y: 0.3 }, colors: coresMarca, scalar: 1.2 });
    }, 500);
  }
</script>
